<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b63ce">
  <title>Guinée Web 🇬🇳</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --blue:#0b63ce;
      --blue2:#0751aa;
      --bg:#f3f6fa;
      --card:#fff;
      --text:#172033;
      --muted:#687386;
      --line:#e4e8ef;
      --danger:#d92d20;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
    }

    button,input,textarea,select{font:inherit}

    button{
      cursor:pointer;
      border:0
    }

    img,video{
      max-width:100%
    }

    .hidden{
      display:none!important
    }

    .center{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px
    }

    .welcome{
      min-height:100vh;
      display:grid;
      place-content:center;
      text-align:center;
      padding:24px;
      max-width:620px;
      margin:auto
    }

    .logo{
      width:76px;
      height:76px;
      border-radius:24px;
      background:var(--blue);
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:28px;
      margin:0 auto 16px
    }

    .logo.sm{
      width:52px;
      height:52px;
      border-radius:16px;
      font-size:19px
    }

    h1,h2,h3{
      margin:0 0 10px
    }

    .muted,small{
      color:var(--muted)
    }

    .tag{
      font-size:19px
    }

    .features{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      margin:24px 0
    }

    .features span{
      background:#eaf2ff;
      padding:9px 12px;
      border-radius:999px
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      box-shadow:0 3px 14px #0b1f3a0b;
      margin-bottom:12px
    }

    .auth{
      width:min(440px,100%)
    }

    form{
      display:grid;
      gap:12px
    }

    label{
      display:grid;
      gap:6px;
      font-weight:650;
      text-align:left
    }

    input,textarea,select{
      width:100%;
      border:1px solid #ccd4df;
      border-radius:12px;
      padding:12px;
      background:#fff;
      outline:none
    }

    input:focus,
    textarea:focus,
    select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px #0b63ce18
    }

    .primary,
    .secondary,
    .danger,
    .link{
      padding:11px 15px;
      border-radius:12px;
      font-weight:750
    }

    .primary{
      background:var(--blue);
      color:#fff
    }

    .primary:hover{
      background:var(--blue2)
    }

    .secondary{
      background:#eaf2ff;
      color:var(--blue)
    }

    .danger{
      background:#fff0ee;
      color:var(--danger)
    }

    .link{
      background:transparent;
      color:var(--blue);
      padding:6px
    }

    .wide{
      width:100%;
      margin-top:8px
    }

    .small{
      padding:8px 11px;
      font-size:14px
    }

    .shell{
      min-height:100vh;
      padding-bottom:78px
    }

    .top{
      position:sticky;
      top:0;
      z-index:10;
      background:#ffffffee;
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px max(14px,calc((100vw - 900px)/2));
    }

    .brand{
      background:transparent;
      font-weight:900;
      font-size:20px;
      color:var(--blue)
    }

    .brand span{
      color:var(--text)
    }

    .top-right{
      display:flex;
      gap:8px;
      align-items:center
    }

    .icon{
      background:#eef3f9;
      border-radius:12px;
      padding:9px;
      position:relative
    }

    .badge{
      position:absolute;
      right:-3px;
      top:-5px;
      background:#e5484d;
      color:#fff;
      font-size:10px;
      border-radius:99px;
      padding:2px 5px
    }

    main{
      width:min(900px,100%);
      margin:0 auto;
      padding:14px
    }

    .composer{
      display:flex;
      gap:10px;
      align-items:center
    }

    .composer button{
      flex:1;
      text-align:left;
      background:#f0f3f7;
      color:var(--muted);
      padding:13px;
      border-radius:999px
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#dce9fb;
      color:var(--blue);
      display:grid;
      place-items:center;
      font-weight:850;
      overflow:hidden;
      flex:0 0 auto
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .avatar.sm{
      width:34px;
      height:34px
    }

    .avatar.lg{
      width:92px;
      height:92px;
      font-size:30px;
      margin:auto
    }

    .head,
    .person,
    .row{
      display:flex;
      align-items:center;
      gap:10px
    }

    .head>div:nth-child(2),
    .person>div{
      display:grid
    }

    .head small{
      display:block
    }

    .post p{
      white-space:pre-wrap;
      line-height:1.5
    }

    .media{
      display:block;
      width:100%;
      max-height:560px;
      object-fit:cover;
      border-radius:14px;
      margin-top:10px;
      background:#111
    }

    .actions{
      display:flex;
      gap:6px;
      border-top:1px solid var(--line);
      margin-top:12px;
      padding-top:10px;
      flex-wrap:wrap
    }

    .actions button{
      background:#f4f6f9;
      padding:9px 11px;
      border-radius:10px
    }

    .title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:8px 0 12px
    }

    .empty{
      text-align:center;
      padding:35px 18px
    }

    .error{
      color:var(--danger)
    }

    .people{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:10px
    }

    .person{
      padding:12px
    }

    .person button{
      margin-left:auto
    }

    .shorts{
      display:grid;
      gap:14px
    }

    .short{
      background:#000;
      border-radius:18px;
      overflow:hidden;
      color:#fff;
      position:relative
    }

    .short video{
      width:100%;
      height:min(78vh,650px);
      object-fit:cover;
      background:#000
    }

    .short .caption{
      padding:12px
    }

    .tabs{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#fff;
      border-top:1px solid var(--line);
      z-index:20;
      display:flex;
      justify-content:center
    }

    .tabs button{
      background:transparent;
      color:var(--muted);
      padding:9px 10px;
      min-width:68px
    }

    .tabs button.active{
      color:var(--blue);
      font-weight:800
    }

    .tabs small{
      display:block;
      font-size:11px
    }

    .chat{
      max-height:55vh;
      overflow:auto;
      display:grid;
      gap:8px
    }

    .bubble{
      max-width:78%;
      padding:9px 12px;
      border-radius:14px;
      background:#edf1f6
    }

    .mine{
      justify-self:end;
      background:#dceaff
    }

    .payment-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:10px
    }

    .pay-option{
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      background:#fff;
      text-align:left
    }

    .pay-option.active{
      border:2px solid var(--blue);
      background:#eef5ff
    }

    .notice{
      background:#fff8df;
      border:1px solid #f1df9b;
      padding:12px;
      border-radius:12px;
      color:#735b00
    }

    @media(min-width:760px){
      .tabs{
        position:sticky;
        bottom:0;
        width:min(900px,100%);
        margin:auto;
        border:1px solid var(--line);
        border-radius:16px 16px 0 0
      }

      .shell{
        padding-bottom:0
      }
    }
  </style>
</head>

<div id="app"></div>

<script>

const SUPABASE_URL =
  "https://llmftxuasvysawaazedm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fzGII8rJsleL-jGQb491Ag_0jMkE_46";

const { createClient } = supabase;

const sb = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const app = document.getElementById("app");

let user = null;
let profile = null;
let tab = "home";
let selectedChat = null;


/* =========================
   UTILITAIRES
========================= */

const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

const initials = p =>
  (p?.full_name || "U")
    .trim()
    .charAt(0)
    .toUpperCase();

const avatar = p =>
  p?.avatar_url
    ? `
      <div class="avatar">
        <img src="${esc(p.avatar_url)}" alt="">
      </div>
    `
    : `
      <div class="avatar">
        ${esc(initials(p))}
      </div>
    `;

const fmt = d =>
  new Date(d).toLocaleString(
    "fr-FR",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

const msg = e => {
  const el = document.getElementById("msg");

  if(el){
    el.textContent =
      e?.message ||
      String(e);
  }
};


/* =========================
   PAGE D'ACCUEIL
========================= */

function welcome(){

  app.innerHTML = `
    <section class="welcome">

      <div class="logo">
        GW
      </div>

      <h1>
        Guinée Web 🇬🇳
      </h1>

      <p class="tag">
        Le réseau social guinéen.
      </p>

      <p class="muted">
        Application vierge : aucune publication
        de démonstration. Le contenu vient uniquement

      </p>

      <div class="features">
        <span>📰 Fil</span>

        <span>👥 Amis</span>

/* =========================
   AUTHENTIFICATION
========================= */

function auth(mode){

  app.innerHTML = `
    <section class="center">

      <div class="card auth">

        <div class="logo sm">
          GW
        </div>

        <h2>
          ${
            mode === "login"
              ? "Se connecter"
              : "Créer mon compte"
          }
        </h2>

        <form id="authForm">

          ${
            mode === "signup"
              ? `
                <label>
                  Nom complet
                  <input
                    id="name"
                    required
                    maxlength="100"
                  >
                </label>

                <label>
                  Ville
                  <input
                    id="city"
                    required
                    placeholder="Conakry"
                  >
                </label>
              `
              : ""
          }

          <label>
            Email
            <input
              id="email"
              type="email"
              required
            >
          </label>

          <label>
            Mot de passe
            <input
              id="pass"
              type="password"
              minlength="6"
              required
            >
          </label>

          <button class="primary">
            ${
              mode === "login"
                ? "Se connecter"
                : "Créer le compte"
            }
          </button>

        </form>

        <p id="msg" class="muted"></p>

        <button
          class="link"
          onclick="auth('${
            mode === "login"
              ? "signup"
              : "login"
          }')"
        >
          ${
            mode === "login"
              ? "Créer un compte"
              : "J'ai déjà un compte"
          }
        </button>

        <button
          class="link"
          onclick="welcome()"
        >
          ← Retour
        </button>

      </div>

    </section>
  `;


  document.getElementById("authForm").onsubmit =
    async e => {

      e.preventDefault();

      msg("Patiente...");

      try{

        if(mode === "login"){

          const r =
            await sb.auth.signInWithPassword({
              email:email.value,
              password:pass.value
            });

          if(r.error)
            throw r.error;

        }else{

          const r =
            await sb.auth.signUp({
              email:email.value,
              password:pass.value,
              options:{
                data:{
                  full_name:name.value,
                  city:city.value
                }
              }
            });

          if(r.error)
            throw r.error;

          if(!r.data.session){

            msg(
              "Compte créé. Vérifie ton email pour confirmer ton adresse."
            );

            return;
          }
        }

      }catch(e){

        msg(e);

      }

    };
}


/* =========================
   PROFIL
========================= */

async function loadProfile(){

  const r =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(r.error)
    throw r.error;

  profile =
    r.data ||
    {
      id:user.id,
      full_name:
        user.email?.split("@")[0] ||
        "Utilisateur",
      city:"Guinée"
    };
}


/* =========================
   NOTIFICATIONS
========================= */

async function counts(){

  const r =
    await sb
      .from("notifications")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq("user_id",user.id)
      .eq("read",false);

  return r.count || 0;
}

/* =========================
   NAVIGATION
========================= */

async function go(t){

  tab = t;

  document
    .querySelectorAll(".tabs button")
    .forEach(
      b => b.classList.remove("active")
    );

  document
    .getElementById("tab-"+t)
    ?.classList.add("active");

  const v =
    document.getElementById("view");

  if(!v)
    return;

  try{

    if(t === "home")
      await home();

    else if(t === "shorts")
      await shorts();

    else if(t === "friends")
      await friends();

    else if(t === "messages")
      await messages();

    else if(t === "profile")
      await profilePage();

    else if(t === "notifications")
      await notifications();

    else if(t === "payments")
      await payments();

  }catch(e){

    v.innerHTML = `
      <div class="card error">
        ${esc(e.message)}
      </div>
    `;

  }
}


/* =========================
   BADGE NOTIFICATIONS
========================= */

async function updateBadge(){

  const n = await counts();

  const b =
    document.getElementById("badge");

  if(!b)
    return;

  b.textContent =
    n > 99
      ? "99+"
      : n;

  b.classList.toggle(
    "hidden",
    !n
  );
}


/* =========================
   FIL D'ACTUALITÉ
========================= */

async function home(){

  const v =
    document.getElementById("view");

  v.innerHTML = `
    <div class="card">
      Chargement du fil...
    </div>
  `;

  const r =
    await sb
      .from("posts")
      .select(
        "*,profiles!posts_author_id_fkey(id,full_name,avatar_url,city)"
      )
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(50);

  if(r.error)
    throw r.error;

  const posts =
    r.data || [];

  v.innerHTML = `

    <div class="card composer">

      ${avatar(profile)}

      <button onclick="compose()">
        Quoi de neuf ?
      </button>

    </div>

    ${
      posts.length

      ? posts
          .map(postCard)
          .join("")

      : `
        <div class="card empty">

          <h2>
            Ton fil est vide
          </h2>

          <p class="muted">
            Aucune publication pour le moment.
          </p>

          <button
            class="primary"
            onclick="compose()"
          >
            Créer la première publication
          </button>

        </div>
      `
    }
  `;


  for(const p of posts){

    const [
      likes,
      comments
    ] = await Promise.all([

      sb
        .from("likes")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq("post_id",p.id),

      sb
        .from("comments")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq("post_id",p.id)

    ]);

    const meta =
      document.querySelector(
        `#meta-${p.id}`
      );

    if(meta){

      meta.textContent =
        `${likes.count || 0} J’aime · ${
          comments.count || 0
        } commentaire(s)`;

    }


    const mine =
      await sb
        .from("likes")
        .select("id")
        .eq("post_id",p.id)
        .eq("user_id",user.id)
        .maybeSingle();

    const likeButton =
      document.querySelector(
        `[data-like="${p.id}"]`
      );

    if(likeButton){

      likeButton.textContent =
        mine.data
          ? "💙 J’aime"
          : "❤️ J’aime";

    }

  }
}


/* =========================
   CARTE PUBLICATION
========================= */

function postCard(p){

  return `

    <article
      class="card post"
      id="post-${p.id}"
    >

      <div class="head">

        ${avatar(p.profiles)}

        <div>

          <b>
            ${esc(
              p.profiles?.full_name ||
              "Utilisateur"
            )}
          </b>

          <small>
            ${esc(
              p.profiles?.city ||
              "Guinée"
            )}
            ·
            ${fmt(p.created_at)}
          </small>

        </div>

      </div>


      ${
        p.content
          ? `<p>${esc(p.content)}</p>`
          : ""
      }


      ${
        p.image_url
          ? `
            <img
              class="media"
              src="${esc(p.image_url)}"
              alt=""
            >
          `
          : ""
      }


      ${
        p.video_url
          ? `
            <video
              class="media"
              src="${esc(p.video_url)}"
              controls
              playsinline
            ></video>
          `
          : ""
      }


      <small
        id="meta-${p.id}"
        class="muted"
      ></small>


      <div class="actions">

        <button
          data-like="${p.id}"
          onclick="toggleLike('${p.id}')"
        >
          ❤️ J’aime
        </button>

        <button
          onclick="showComments('${p.id}')"
        >
          💬 Commenter
        </button>

        <button
          onclick="sharePost('${p.id}')"
        >
          ↗️ Partager
        </button>

      </div>


      <div
        id="comments-${p.id}"
      ></div>

    </article>
  `;
}


/* =========================
   LIKE
========================= */

async function toggleLike(id){

  const r =
    await sb
      .from("likes")
      .select("id")
      .eq("post_id",id)
      .eq("user_id",user.id)
      .maybeSingle();

  if(r.data){

    await sb
      .from("likes")
      .delete()
      .eq("id",r.data.id);

  }else{

    const x =
      await sb
        .from("likes")
        .insert({
          post_id:id,
          user_id:user.id
        });

    if(x.error)
      throw x.error;

  }

  await home();
}


/* =========================
   COMMENTAIRES
========================= */

async function showComments(id){

  const box =
    document.getElementById(
      "comments-"+id
    );

  if(box.innerHTML){

    box.innerHTML = "";

    return;
  }

  const r =
    await sb
      .from("comments")
      .select(
        "*,profiles!comments_user_id_fkey(full_name,avatar_url)"
      )
      .eq("post_id",id)
      .order(
        "created_at",
        {ascending:true}
      );

  box.innerHTML = `

async function sharePost(id){

  const url =
    location.href.split("#")[0] +
    "#post-" +
    id;

  if(navigator.share){

    try{

      await navigator.share({
        title:"Guinée Web",
        text:
          "Regarde cette publication sur Guinée Web",
        url
      });

    }catch{}

  }else{

    await navigator.clipboard.writeText(url);

    alert("Lien copié.");

  }
}


/* =========================
   CRÉATION PUBLICATION
========================= */

function compose(){

  const v =
    document.getElementById("view");

  v.innerHTML = `

    <div class="card">

      <button
        class="link"
        onclick="go('home')"
      >
        ← Annuler
      </button>

      <h2>
        Créer une publication
      </h2>

      <form id="postForm">

        <textarea
          id="content"
          rows="5"
          maxlength="5000"
          placeholder="Quoi de neuf ?"
        ></textarea>

        <label>

          Photo ou vidéo

          <input
            id="media"
            type="file"
            accept="image/*,video/*"
          >

        </label>

        <button class="primary">
          Publier
        </button>

        <p
          id="msg"
          class="muted"
        ></p>

      </form>

    </div>
  `;


  document.getElementById(
    "postForm"
  ).onsubmit =
    async e => {

      e.preventDefault();

      msg("Publication...");

      try{

        let image_url = null;
        let video_url = null;

        const f =
          document.getElementById(
            "media"
          ).files[0];

        const text =
          document.getElementById(
            "content"
          ).value.trim();


        if(!text && !f){

          throw new Error(
            "Ajoute du texte ou un média."
          );

        }


        if(f){

          const bucket =
            f.type.startsWith("video/")
              ? "videos"
              : "media";

          const path =
            `${user.id}/${crypto.randomUUID()}-${f.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            )}`;


          const up =
            await sb
              .storage
              .from(bucket)
              .upload(
                path,
                f
              );

          if(up.error)
            throw up.error;


          const pub =
            sb
              .storage
              .from(bucket)
              .getPublicUrl(path)
              .data
              .publicUrl;


          if(
            f.type.startsWith("video/")
          )
            video_url = pub;
          else
            image_url = pub;

        }


        const r =
          await sb
            .from("posts")
            .insert({
              author_id:user.id,
              content:text,
              image_url,
              video_url
            });


        if(r.error)
          throw r.error;


        await go("home");

      }catch(e){

        msg(e);

      }

    };
}

/* =========================

========================= */

async function messages(){

  const v =
    document.getElementById("view");


  const people =
    await sb
      .from("profiles")
      .select(
        "id,full_name,avatar_url,city"
      )
      .neq(
        "id",
        user.id
      )
      .order(
        "full_name"
      )
      .limit(100);


  if(
    !selectedChat &&
    people.data?.[0]
  ){

    selectedChat =
      people.data[0].id;

  }


  let list = [];


  if(selectedChat){

    const r =
      await sb
        .from("messages")
        .select(
          "*,profiles!messages_sender_id_fkey(full_name)"
        )
        .or(
          `and(sender_id.eq.${user.id},receiver_id.eq.${selectedChat}),and(sender_id.eq.${selectedChat},receiver_id.eq.${user.id})`
        )
        .order(
          "created_at",
          {ascending:true}
        );

    list =
      r.data || [];

  }


  v.innerHTML = `

    <div class="card">

      <h2>
        💬 Messages
      </h2>

      <select
        id="chatUser"
        style="
          width:100%;
          padding:12px;
          border-radius:12px;
          border:1px solid var(--line)
        "
      >

        ${
          (people.data || [])
            .map(p => `

              <option
                value="${p.id}"
                ${
                  p.id === selectedChat
                    ? "selected"
                    : ""
                }
              >
                ${esc(
                  p.full_name ||
                  "Utilisateur"
                )}
              </option>

            `)
            .join("")
        }

      </select>

    </div>


    <div class="card">

      <div class="chat">

        ${
          list
            .map(m => `

              <div
                class="bubble ${
                  m.sender_id === user.id
                    ? "mine"
                    : ""
                }"
              >

                ${esc(m.content)}

                <br>

                <small>
                  ${fmt(m.created_at)}
                </small>

              </div>

            `)
            .join("")

          ||

          "<p class='muted'>Aucun message.</p>"
        }

      </div>


      <form
        id="messageForm"
        style="
          display:flex;
          margin-top:10px
        "
      >

        <input
          id="messageText"
          required
          maxlength="2000"
          placeholder="Écrire un message..."
        >

        <button class="primary">
          Envoyer
        </button>

      </form>

    </div>
  `;


  document.getElementById(
    "chatUser"
  ).onchange =
    e => {

      selectedChat =
        e.target.value;

      messages();

    };


  document.getElementById(
    "messageForm"
  ).onsubmit =
    async e => {

      e.preventDefault();

      const input =
        document.getElementById(
          "messageText"
        );

      const x =
        await sb
          .from("messages")
          .insert({
            sender_id:user.id,
            receiver_id:selectedChat,
            content:input.value.trim()
          });

      if(!x.error){

        input.value = "";

        messages();

      }

    };
}

        ${avatar(profile)}
      </div>

      <h2>
        ${esc(
          profile?.full_name ||

        )}
      </h2>

          profile?.city ||
          "Guinée"
        )}
      </p>

          <input
            id="pname"
            value="${esc(
              profile?.full_name ||
              ""
            )}"
            maxlength="100"
            required
          >

        </label>


        <label>

          Ville

          <input
            id="pcity"
            value="${esc(
              profile?.city ||
              ""
            )}"
            maxlength="100"
            required
          >

        </label>


        <label>

          Bio

          <textarea
            id="pbio"
            maxlength="500"
          >${esc(
            profile?.bio ||
            ""
          )}</textarea>

        </label>


        <label>

          Photo de profil

          <input
            id="avatarFile"
            type="file"
            accept="image/*"
          >

        </label>


        <button class="primary">
          Enregistrer
        </button>

      </form>


      <button
        class="danger wide"
        onclick="logout()"
      >
        Se déconnecter
      </button>

    </div>


    <h3>
      Mes publications
    </h3>


    ${
      (r.data || [])
        .map(
          p =>
            postCard({
              ...p,
              profiles:profile
            })
        )
        .join("")

      ||

      `
        <div class="card empty">
          Tu n'as encore rien publié.
        </div>
      `
    }

  `;


  document.getElementById(
    "profileForm"
  ).onsubmit =
    async e => {

      e.preventDefault();


      let avatar_url =
        profile.avatar_url;


      const f =
        document.getElementById(
          "avatarFile"
        ).files[0];


      if(f){

        const extension =
          f.name
            .split(".")
            .pop();


        const path =
          `${user.id}/avatar-${Date.now()}.${extension}`;


        const up =
          await sb
            .storage
            .from("avatars")
            .upload(
              path,
              f,
              {upsert:true}
            );


        if(up.error)
          throw up.error;


        avatar_url =
          sb
            .storage
            .from("avatars")
            .getPublicUrl(path)
            .data

        await sb
          .from("profiles")
          .update({
            full_name:
              document.getElementById(
                "pname"
              ).value.trim(),

            city:
              document.getElementById(
                "pcity"
              ).value.trim(),

            bio:
              document.getElementById(
                "pbio"
              ).value.trim(),

            avatar_url
          })
          .eq(
            "id",
            user.id
          );


      if(x.error)
        throw x.error;


      await loadProfile();

      shell();

      go("profile");

    };
}

/* =========================
   DÉMARRAGE
========================= */

async function start(){

  const s =
    await sb.auth.getSession();


  user =
    s.data.session?.user;


  if(!user){

    welcome();

    return;

  }


  await loadProfile();


  shell();


  await go("home");


  sb.auth.onAuthStateChange(
    async (_,session) => {

      user =
        session?.user ||
        null;


      if(!user){

        welcome();

        return;

      }


      await loadProfile();

      shell();

      go("home");

    }
  );


  /* =====================
     NOTIFICATIONS TEMPS RÉEL
  ===================== */

  sb
    .channel("gw-notifications")

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"notifications",
        filter:
          `user_id=eq.${user.id}`
      },
      () => {

        updateBadge();

        if(
          tab === "notifications"
        )
          notifications();

      }
    )

    .subscribe();


  /* =====================
     MESSAGES TEMPS RÉEL
  ===================== */

  sb
    .channel("gw-messages")

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages",
        filter:
          `receiver_id=eq.${user.id}`
      },
      () => {

        updateBadge();

        if(
          tab === "messages"
        )
          messages();

      }
    )

    .subscribe();

}


start();
