@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;font-family:'Nunito','Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif;background:#0D0D0D;color:#F5F0E8;-webkit-font-smoothing:antialiased}
:root{
  --r:#CE1126;--y:#FCD116;--g:#009A44;
  --rg:linear-gradient(135deg,#CE1126 0%,#FCD116 50%,#009A44 100%);
  --bg:#0D0D0D;--bg2:#141414;--card:#1A1A1A;--card2:#222;--card3:#2A2A2A;
  --txt:#F5F0E8;--txt2:#9A9080;--txt3:#7A7068;
  --border:#2A2520;--hover:#1E1C1A;
  --acc:#FCD116;--acc2:#CE1126;--acc3:#009A44;
  --top:56px;--bot:60px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
button,input,textarea,select{font-family:inherit;outline:none;border:none;background:none;color:inherit}
button{cursor:pointer}img,video{display:block;max-width:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(252,209,22,.4)}50%{box-shadow:0 0 24px rgba(252,209,22,.8)}}
@keyframes wave{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes stripes{0%{background-position:0 0}100%{background-position:60px 0}}

/* ─── AUTH ─── */
#auth{position:fixed;inset:0;z-index:9999;overflow-y:auto;display:flex;flex-direction:column;align-items:center;background:#0D0D0D}
#auth.hidden{display:none!important}
.auth-top{width:100%;max-width:480px;padding:calc(var(--sat) + 40px) 28px 30px;text-align:center;position:relative;overflow:hidden}
.auth-top::before{content:'';position:absolute;inset:0;background:var(--rg);opacity:.07;pointer-events:none}
.auth-top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--rg)}
.syli-mark{width:90px;height:90px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center}
.syli-mark-inner{width:80px;height:80px;border-radius:50%;background:var(--rg);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 0 4px rgba(252,209,22,.25),0 0 30px rgba(206,17,38,.3);animation:glow 2.5s infinite}
.auth-title{font-family:'Syne',sans-serif;font-size:42px;font-weight:900;letter-spacing:-2px;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-sub{font-size:13px;color:var(--txt2);margin-top:5px;line-height:1.5}
.auth-body{width:100%;max-width:480px;padding:0 24px 80px}
.auth-tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin-bottom:24px;border:1px solid var(--border)}
.auth-tab{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:800;color:var(--txt);transition:all .2s;text-align:center;cursor:pointer}
.auth-tab.on{background:var(--rg);color:#000;font-weight:900}
.auth-form{display:none;flex-direction:column;gap:14px}
.auth-form.on{display:flex}
.auth-h{font-family:'Syne',sans-serif;font-size:26px;font-weight:900;letter-spacing:-1px}
.auth-s{font-size:13px;color:var(--txt2);margin-top:-8px}
.field-g{display:flex;flex-direction:column;gap:6px}
.field-g label{font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px}
.field-i{padding:13px 15px;background:var(--card);border:1.5px solid var(--border);border-radius:11px;font-size:15px;color:var(--txt);transition:border-color .2s;width:100%;font-family:inherit}
.field-i:focus{border-color:var(--acc)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.city-sel{padding:13px 15px;background:var(--card);border:1.5px solid var(--border);border-radius:11px;font-size:15px;color:var(--txt);width:100%;font-family:inherit;appearance:none;cursor:pointer}
.city-sel:focus{border-color:var(--acc)}
.btn-guinea{padding:14px;background:var(--rg);color:#000;border-radius:11px;font-size:15px;font-weight:900;width:100%;transition:transform .1s,opacity .1s;letter-spacing:-.2px;position:relative;overflow:hidden}
.btn-guinea::after{content:'';position:absolute;top:-50%;left:-100%;width:60%;height:200%;background:rgba(255,255,255,.2);transform:skewX(-20deg);animation:none}
.btn-guinea:active{transform:scale(.97)}
.btn-guinea:hover::after{animation:wave 1s}
.err-box{background:rgba(206,17,38,.1);color:#FF8080;border:1px solid rgba(206,17,38,.3);border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;display:none}
.err-box.on{display:block}
.auth-link{text-align:center;font-size:13px;color:var(--txt2)}
.auth-link span{color:var(--acc);cursor:pointer;font-weight:800}
.pz{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border:2px dashed var(--border);border-radius:12px;background:var(--card);cursor:pointer;transition:all .2s}
.pz.has,.pz:active{border-color:var(--acc);background:rgba(252,209,22,.05)}
.pzc{width:86px;height:86px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;border:2px dashed var(--border)}
.pz.has .pzc{border-color:var(--acc);border-style:solid}
.saved-wrap{margin-bottom:14px}
.saved-lbl{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.saved-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;width:100%;text-align:left;margin-bottom:6px;transition:border-color .15s}
.saved-item:active{border-color:var(--acc)}
.sep{display:flex;align-items:center;gap:10px;color:var(--txt3);font-size:12px;margin:4px 0}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border)}

/* ─── APP SHELL ─── */
#app{position:fixed;inset:0;display:none;flex-direction:column}
#app.on{display:flex}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + var(--sat));padding-top:var(--sat);background:rgba(13,13,13,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:13px;padding-right:13px;gap:9px;z-index:500}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--rg);opacity:.6}
.tb-logo{display:flex;align-items:center;gap:7px;flex-shrink:0;cursor:pointer}
.tb-logo-mark{width:30px;height:30px;border-radius:50%;background:var(--rg);display:flex;align-items:center;justify-content:center;font-size:15px}
.tb-logo-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:900;letter-spacing:-1.5px;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tb-search-wrap{flex:1;position:relative;max-width:210px}
.tb-search{width:100%;padding:8px 12px 8px 34px;background:var(--card2);border:1px solid var(--border);border-radius:999px;font-size:13px;color:var(--txt)}
.tb-search:focus{border-color:var(--acc)}
.tb-search-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--txt3);pointer-events:none}
.srch-drop{position:absolute;top:calc(100% + 7px);left:0;right:0;background:var(--card2);border:1px solid var(--border);border-radius:13px;box-shadow:0 10px 40px rgba(0,0,0,.8);z-index:9999;max-height:370px;overflow-y:auto;min-width:270px;display:none}
.srch-drop.on{display:block}
.sd-hd{padding:7px 13px 4px;font-size:10px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;background:var(--card);position:sticky;top:0}
.sd-row{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.sd-row:active{background:rgba(252,209,22,.07)}
.sd-name{font-weight:800;font-size:13px}
.sd-meta{font-size:11px;color:var(--txt3);margin-top:1px}
.sd-post{padding:9px 13px;font-size:12px;color:var(--txt2);border-bottom:1px solid var(--border);cursor:pointer;line-height:1.4}
.sd-0{padding:16px;text-align:center;font-size:13px;color:var(--txt3)}
.tb-nav{flex:1;display:flex;justify-content:center}
.tbn{width:44px;height:var(--top);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--txt3);border-bottom:2.5px solid transparent;position:relative;transition:all .15s}
.tbn.on{color:var(--acc);border-bottom-color:var(--acc)}
.tb-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.tb-ic{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2);cursor:pointer;position:relative;transition:all .15s;flex-shrink:0}
.tb-ic:active{transform:scale(.9)}
.tb-ic.ma{background:rgba(252,209,22,.12);color:var(--acc);border-color:rgba(252,209,22,.3)}
.bdg{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--r);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg);animation:pop .2s;pointer-events:none}
.bdg.h{display:none}

/* ─── PAGES ─── */
.page-wrap{position:fixed;top:calc(var(--top) + var(--sat));bottom:calc(var(--bot) + var(--sab));left:0;right:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;display:none}
.page.on{display:block;animation:fadeIn .18s}
.botbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--bot) + var(--sab));padding-bottom:var(--sab);background:rgba(13,13,13,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;z-index:500}
.botbar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--rg);opacity:.5}
.bbn{flex:1;height:var(--bot);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--txt2);position:relative;transition:color .15s}
.bbn.on{color:var(--acc)}
.bbn.on .bbn-i{filter:drop-shadow(0 0 4px rgba(252,209,22,.6))}
.bbn-i{font-size:22px;line-height:1;transition:transform .15s}
.bbn:active .bbn-i{transform:scale(.85)}
.bbn-l{font-size:10px;font-weight:700}

/* ─── AVATAR ─── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* ─── GUINEA FLAG BAR (decorative) ─── */
.gflag{height:4px;display:flex;flex-shrink:0}
.gflag-r{flex:1;background:var(--r)}
.gflag-y{flex:1;background:var(--y)}
.gflag-g{flex:1;background:var(--g)}

/* ─── STORIES ─── */
.stories-bar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 12px 13px;display:flex;gap:12px;overflow-x:auto;flex-shrink:0}
.s-btn{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;width:66px;background:none;border:none;cursor:pointer;padding:0}
.s-ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:var(--rg)}
.s-ring.seen{background:var(--border)}
.s-ring.mine{background:linear-gradient(135deg,var(--acc),var(--y))}
.s-in{width:100%;height:100%;border-radius:50%;background:var(--bg);padding:2px;display:flex;align-items:center;justify-content:center}
.s-av{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;position:relative}
.s-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.s-cnt{position:absolute;bottom:-1px;right:-1px;width:17px;height:17px;border-radius:50%;background:var(--acc);color:#000;font-size:8px;font-weight:900;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.s-add-btn{width:62px;height:62px;border-radius:50%;background:var(--rg);display:flex;align-items:center;justify-content:center;font-size:28px;color:#000}
.s-nm{font-size:11px;font-weight:700;color:var(--txt);max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.s-nm.acc{color:var(--acc)}

/* ─── COMPOSER BAR ─── */
.cmp-bar{background:var(--card);border-bottom:1px solid var(--border);padding:12px}
.cmp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cmp-fake{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:11px 16px;font-size:14px;color:var(--txt3);text-align:left;cursor:pointer;transition:border-color .15s}
.cmp-fake:active{border-color:var(--acc)}
.cmp-dv{height:1px;background:var(--border);margin:0 -12px 10px}
.cmp-btns{display:flex}
.cmb{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 2px;border-radius:8px;font-size:11px;font-weight:800;color:var(--txt2);transition:background .15s;border:none;cursor:pointer}
.cmb:active{background:var(--hover)}

/* ─── FEED FILTERS ─── */
.ff-bar{display:flex;gap:7px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.ff-btn{padding:6px 14px;border-radius:999px;background:var(--card2);border:1.5px solid var(--card3);font-size:12px;font-weight:800;color:var(--txt);flex-shrink:0;transition:all .15s}
.ff-btn.on{background:var(--rg);color:#000;border-color:transparent}

/* ─── POST ─── */
.post{background:var(--card);border-bottom:1px solid var(--border);animation:fadeUp .22s ease}
.post-hd{display:flex;align-items:center;gap:10px;padding:12px 13px 0}
.post-inf{flex:1;min-width:0}
.post-nm{font-weight:900;font-size:14px;cursor:pointer;color:var(--txt)}
.post-mt{font-size:11px;color:var(--txt3);margin-top:1px;display:flex;align-items:center;gap:5px}
.post-city{background:rgba(0,154,68,.15);color:var(--g);border:1px solid rgba(0,154,68,.25);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800}
.more-btn{width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--txt3);display:flex;align-items:center;justify-content:center;transition:background .15s}
.more-btn:active{background:var(--hover)}
.post-txt{padding:10px 13px;font-size:15px;line-height:1.7;word-break:break-word;white-space:pre-wrap}
.post-txt .ht{color:var(--acc);cursor:pointer}
.post-txt .mn{color:var(--g);cursor:pointer}
.post-stats{display:flex;justify-content:space-between;align-items:center;padding:5px 13px;font-size:12px;color:var(--txt3);min-height:28px}
.post-dv{height:1px;background:var(--border)}
.post-acts{display:flex;padding:2px 6px;height:52px;align-items:center;flex-shrink:0}
.pact{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 2px;border-radius:8px;font-size:11px;font-weight:800;color:var(--txt2);cursor:pointer;transition:background .15s,color .15s;position:relative;min-width:0;border:none;height:40px;overflow:hidden}
.pact:active{background:var(--hover)}
.pact.lk{color:#1877F2 !important}
.lk .pai{color:#1877F2 !important}
.pact.lk span:not(.pai){color:#1877F2 !important}
.pact.sv{color:var(--g)}
.pai{font-size:18px;line-height:1;transition:transform .1s}
.pact:active .pai{transform:scale(1.4)}
.rp{position:absolute;bottom:calc(100% + 5px);left:-2px;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:7px 11px;display:flex;gap:8px;box-shadow:0 4px 28px rgba(0,0,0,.8);opacity:0;pointer-events:none;transform:scale(.7) translateY(8px);transform-origin:bottom left;transition:all .18s;z-index:50}
.rp.on{opacity:1;pointer-events:all;transform:scale(1) translateY(0)}
.re{font-size:27px;cursor:pointer;line-height:1;transition:transform .1s}
.re:active{transform:scale(1.6) translateY(-5px)}
/* Wontanara reaction label */
.react-labels{position:absolute;bottom:calc(100% + 38px);left:-2px;background:var(--card3);border:1px solid var(--border);border-radius:7px;padding:3px 8px;font-size:10px;font-weight:800;color:var(--acc);pointer-events:none;opacity:0;white-space:nowrap}
.re:hover + .react-labels{opacity:1}
.ca{border-top:1px solid var(--border);padding:10px 13px;display:none}
.ca.on{display:block}
.ci-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ci{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--txt)}
.ci:focus{border-color:var(--acc)}
.cs{width:32px;height:32px;border-radius:50%;background:var(--rg);color:#000;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.cm-item{display:flex;gap:8px;margin-bottom:9px}
.cm-bub{flex:1;background:var(--card2);border-radius:12px 12px 12px 4px;padding:8px 12px;font-size:13px;line-height:1.5;border:1px solid var(--border)}
.cm-auth{font-weight:900;font-size:12px;margin-bottom:2px}
.cm-foot{display:flex;gap:10px;margin-top:4px;font-size:11px;color:var(--txt3)}
.clf{cursor:pointer;font-weight:800;transition:color .15s}
.clf.on{color:var(--acc)}

/* ─── EMPTY STATE ─── */
.empty{padding:50px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.empty-i{font-size:62px;line-height:1}
.empty-t{font-family:'Syne',sans-serif;font-size:21px;font-weight:900;letter-spacing:-.5px}
.empty-s{font-size:14px;color:var(--txt2);line-height:1.65;max-width:280px}
.ec{padding:12px 28px;background:var(--rg);color:#000;border-radius:11px;font-size:15px;font-weight:900;cursor:pointer;transition:transform .1s;border:none}
.ec:active{transform:scale(.97)}

/* ─── INNER PAGE LAYOUT ─── */
.pin{max-width:700px;margin:0 auto;padding:14px}
.sh-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:900;letter-spacing:-.7px;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.count-chip{background:rgba(252,209,22,.12);color:var(--acc);border:1px solid rgba(252,209,22,.25);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.green-chip{background:rgba(0,154,68,.12);color:var(--g);border:1px solid rgba(0,154,68,.25);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.red-chip{background:rgba(206,17,38,.12);color:var(--r);border:1px solid rgba(206,17,38,.25);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.sf{position:relative;margin-bottom:13px}
.sf input{width:100%;padding:11px 14px 11px 40px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--txt);transition:border-color .2s;font-family:inherit}
.sf input:focus{border-color:var(--acc)}
.sf::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.sub-h{font-size:13px;font-weight:800;color:var(--txt2);margin-bottom:9px;text-transform:uppercase;letter-spacing:.5px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:14px}
.pc{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .1s}
.pc:active{border-color:var(--acc);transform:scale(.98)}
.pc-cov{height:68px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;overflow:hidden}
.pc-cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc-av{width:50px;height:50px;border-radius:50%;border:3px solid var(--bg);margin:-25px auto 0;position:relative;z-index:1;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.pc-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pc-body{padding:4px 10px 12px;text-align:center}
.pc-name{font-weight:900;font-size:13px;margin:7px 0 2px;color:var(--txt)}
.pc-meta{font-size:11px;color:var(--txt2);margin-bottom:8px;line-height:1.3}
.pc-btns{display:flex;gap:5px}
.pb{flex:1;padding:7px 4px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;border:none}
.pb.add{background:var(--rg);color:#000}
.pb.sk{background:var(--card2);color:var(--txt2);border:1px solid var(--border)}
.pb.rm{background:rgba(206,17,38,.12);color:var(--r);border:1px solid rgba(206,17,38,.25)}
.req-row{display:flex;align-items:center;gap:11px;background:var(--card);padding:11px;border-radius:12px;border:1px solid var(--border);margin-bottom:7px}
.req-inf{flex:1;min-width:0}
.req-nm{font-weight:900;font-size:14px}
.req-mt{font-size:12px;color:var(--txt2);margin-top:2px}
.req-btns{display:flex;gap:7px;flex-shrink:0}
.divline{height:1px;background:var(--border);margin:13px 0}

/* ─── NOTIFICATIONS ─── */
.nw{max-width:700px;margin:0 auto;padding:14px}
.nt-hd{font-family:'Syne',sans-serif;font-size:22px;font-weight:900;letter-spacing:-.7px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}
.mr-btn{font-size:13px;font-weight:800;color:var(--acc);padding:5px 10px;border-radius:7px;cursor:pointer;background:none;border:none}
.nt-sec{font-size:10px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;padding:3px 4px 7px}
.nt-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;cursor:pointer;margin-bottom:3px;transition:background .12s}
.nt-item:active{background:var(--hover)}
.nt-item.ur{background:rgba(252,209,22,.05);border-left:3px solid var(--acc)}
.nt-avw{position:relative;flex-shrink:0}
.nt-av{width:50px;height:50px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.nt-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.nt-bdg{position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--card3)}
.nt-body{flex:1;min-width:0}
.nt-txt{font-size:13px;line-height:1.4;color:var(--txt)}
.nt-time{font-size:11px;color:var(--txt3);margin-top:2px}
.nt-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0}

/* ─── PROFILE ─── */
.prof-top{background:rgba(13,13,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 13px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.prof-top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--rg);opacity:.5}
.bk-btn{width:32px;height:32px;border-radius:50%;background:var(--card2);font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--txt2);border:1px solid var(--border);cursor:pointer;flex-shrink:0}
.prof-topname{font-family:'Syne',sans-serif;font-size:17px;font-weight:900;flex:1;letter-spacing:-.5px}
.prof-cover{height:200px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card2),var(--card3));display:flex;align-items:center;justify-content:center;cursor:pointer}
.prof-cover img.ci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prof-cover-edit{position:absolute;bottom:10px;right:12px;padding:6px 13px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:12px;font-weight:800;cursor:pointer}
.prof-strip{background:var(--card);padding:0 15px 16px;border-bottom:1px solid var(--border);margin-bottom:7px}
