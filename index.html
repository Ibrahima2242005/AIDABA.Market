<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AIDABA — word</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:rgba(255,255,255,.78);
  --text:#111318;
  --muted:#70757f;
  --line:rgba(0,0,0,.09);
  --accent:#1877f2;
  --danger:#e53935;
  --shadow:0 8px 30px rgba(0,0,0,.08);
  --blur:blur(24px);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  background:none;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#app{
  min-height:100vh;
}

/* ================= AUTH ================= */

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}

.auth-card{
  width:min(430px,100%);
  padding:28px;
  border-radius:30px;
  background:var(--card);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:var(--shadow);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.logo span{
  color:var(--accent);
}

.auth-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:15px 16px;
  border-radius:17px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.7);
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:var(--accent);
}

.primary{
  width:100%;
  padding:15px;
  border-radius:17px;
  background:var(--accent);
  color:white;
  font-weight:700;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
}

.auth-switch button{
  color:var(--accent);
  font-weight:700;
}

/* ================= HEADER ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(255,255,255,.72);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:27px;
  font-weight:900;
  color:var(--accent);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-size:23px;
}

.icon-btn:active{
  transform:scale(.94);
  background:rgba(0,0,0,.07);
}

/* ================= MAIN ================= */

.page{
  width:min(720px,100%);
  margin:auto;
  padding-bottom:95px;
}

.create{
  margin:12px;
  padding:15px;
  border-radius:23px;
  background:var(--card);
  backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:var(--shadow);
}

.create-row{
  display:flex;
  gap:12px;
  align-items:center;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.create-input{
  flex:1;
  border:0;
  background:rgba(0,0,0,.045);
  padding:13px 16px;
  border-radius:18px;
  outline:none;
}

.create-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action-small{
  flex:1;
  padding:10px;
  border-radius:14px;
  background:rgba(0,0,0,.045);
}

/* ================= STORIES ================= */

.stories{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:4px 12px 14px;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:108px;
  height:180px;
  position:relative;
  border-radius:18px;
  overflow:hidden;
  background:#ddd;
  flex-shrink:0;
}

.story img,
.story video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story-name{
  position:absolute;
  bottom:9px;
  left:8px;
  right:8px;
  color:white;
  font-weight:700;
  font-size:13px;
  text-shadow:0 2px 6px #000;
}

.create-story{
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  border:1px solid var(--line);
}

.plus{
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:grid;
  place-items:center;
  font-size:27px;
  margin-bottom:55px;
}

/* ================= POST ================= */

.post{
  margin:10px 0;
  background:var(--card);
  backdrop-filter:var(--blur);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.post-head{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
}

.post-user{
  flex:1;
}

.post-user strong{
  display:block;
}

.post-user small{
  color:var(--muted);
}

.post-content{
  padding:0 14px 12px;
  line-height:1.45;
  white-space:pre-wrap;
}

.post-media{
  width:100%;
  max-height:680px;
  object-fit:contain;
  display:block;
  background:#000;
}

.post-video{
  cursor:pointer;
}

.post-stats{
  padding:10px 14px;
  color:var(--muted);
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

.post-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
}

.post-action{
  padding:13px 5px;
  font-weight:600;
  color:var(--text);
}

.post-action.active{
  color:var(--accent);
}

/* ================= COMMENTS ================= */

.comments{
  padding:12px 14px;
  border-top:1px solid var(--line);
}

.comment{
  display:flex;
  gap:9px;
  margin-bottom:12px;
}

.comment-body{
  background:rgba(0,0,0,.045);
  padding:9px 12px;
  border-radius:15px;
  flex:1;
}

.comment-form{
  display:flex;
  gap:8px;
}

.comment-form input{
  flex:1;
  border:0;
  background:rgba(0,0,0,.05);
  padding:12px;
  border-radius:17px;
  outline:none;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(255,255,255,.8);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  width:20%;
  height:60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:22px;
}

.nav-label{
  font-size:10px;
  color:var(--muted);
}

.nav-btn.active{
  color:var(--accent);
}

/* ================= SHORTS ================= */

.shorts{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.short{
  position:relative;
  height:100dvh;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.short video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.short-top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  color:white;
  display:flex;
  justify-content:space-between;
  z-index:3;
}

.short-title{
  font-size:27px;
  font-weight:800;
}

.short-side{
  position:absolute;
  right:13px;
  bottom:110px;
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:4;
}

.short-button{
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:27px;
}

.short-button span{
  font-size:12px;
  margin-top:2px;
}

.short-info{
  position:absolute;
  left:16px;
  right:85px;
  bottom:28px;
  color:white;
  z-index:4;
}

.short-info strong{
  display:block;
  margin-bottom:8px;
}

/* ================= PROFILE ================= */

.profile{
  padding-bottom:100px;
}

.cover{
  height:230px;
  background:
    linear-gradient(135deg,#008751 0 33%,#fcd116 33% 66%,#ce1126 66%);
  position:relative;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-main{
  padding:0 16px;
  margin-top:-48px;
  position:relative;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:5px solid var(--bg);
  object-fit:cover;
}

.profile-name{
  font-size:25px;
  font-weight:800;
  margin-top:8px;
}

.profile-bio{
  color:var(--muted);
  margin-top:5px;
}

.profile-tabs{
  display:flex;
  gap:8px;
  margin:18px 0;
}

.profile-tab{
  flex:1;
  padding:12px;
  border-radius:15px;
  background:rgba(0,0,0,.05);
}

/* ================= MENU ================= */

.menu-panel{
  position:fixed;
  inset:0;
  z-index:150;
  background:var(--bg);
  overflow:auto;
}

.menu-head{
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.menu-item{
  width:100%;
  padding:17px 22px;
  display:flex;
  gap:15px;
  align-items:center;
  text-align:left;
  border-bottom:1px solid var(--line);
}

.logout{
  color:var(--danger);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:flex-end;
}

.modal-card{
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:var(--bg);
  border-radius:28px 28px 0 0;
  padding:20px;
}

.modal-card h2{
  margin-bottom:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.modal-actions button{
  flex:1;
  padding:14px;
  border-radius:16px;
  background:rgba(0,0,0,.07);
}

.modal-actions .confirm{
  background:var(--accent);
  color:white;
}

/* ================= DARK ================= */

body.dark{
  --bg:#101114;
  --card:rgba(28,30,35,.82);
  --text:#f5f5f5;
  --muted:#a5a7ad;
  --line:rgba(255,255,255,.09);
}

body.dark .topbar,
body.dark .bottom-nav{
  background:rgba(20,21,25,.82);
}

body.dark .input{
  background:rgba(255,255,255,.07);
  color:white;
}

@media(min-width:800px){
  .bottom-nav{
    left:50%;
    transform:translateX(-50%);
    width:720px;
    border-radius:25px 25px 0 0;
  }

  .post{
    border-radius:20px;
    margin:14px 0;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://llmftxuasvysawaazedm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_fzGII8rJsleL-jGQb491Ag_0jMkE_46";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let currentUser = null;
let currentProfile = null;
let posts = [];
let stories = [];

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function escapeHTML(value=""){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function avatar(profile){
  return profile?.avatar_url ||
    "https://placehold.co/100x100/png?text=👤";
}

function formatDate(date){
  const d = new Date(date);
  return d.toLocaleDateString("fr-FR",{
    day:"numeric",
    month:"short",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function showModal(html){
  const old=document.querySelector(".modal");
  if(old) old.remove();

  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="modal" onclick="if(event.target===this)this.remove()">
      <div class="modal-card">${html}</div>
    </div>`
  );
}

function closeModal(){
  document.querySelector(".modal")?.remove();
}

/* =========================================================
   AUTH
========================================================= */

function renderLogin(){
  $("app").innerHTML=`
    <main class="auth">
      <section class="auth-card">
        <div class="logo">AIDA<span>BA</span></div>

        <p class="auth-subtitle">
          Connecte-toi à ton réseau.
        </p>

        <input id="loginEmail"
          class="input"
          type="email"
          placeholder="Adresse email">

        <input id="loginPassword"
          class="input"
          type="password"
          placeholder="Mot de passe">

        <button class="primary" onclick="login()">
          Se connecter
        </button>

        <div class="auth-switch">
          Pas encore de compte ?
          <button onclick="renderSignup()">
            Créer un compte
          </button>
        </div>
      </section>
    </main>
  `;
}

function renderSignup(){
  $("app").innerHTML=`
    <main class="auth">
      <section class="auth-card">
        <div class="logo">AIDA<span>BA</span></div>

        <p class="auth-subtitle">
          Crée ton compte gratuitement.
        </p>

        <input id="signupFirst"
          class="input"
          placeholder="Prénom">

        <input id="signupLast"
          class="input"
          placeholder="Nom">

        <input id="signupBirth"
          class="input"
          type="date">

        <input id="signupPhone"
          class="input"
          type="tel"
          placeholder="Téléphone">

        <input id="signupEmail"
          class="input"
          type="email"
          placeholder="Email">

        <input id="signupPassword"
          class="input"
          type="password"
          placeholder="Mot de passe">

        <input id="signupPassword2"
          class="input"
          type="password"
          placeholder="Confirmer le mot de passe">

        <button class="primary" onclick="signup()">
          Créer mon compte
        </button>

        <div class="auth-switch">
          J'ai déjà un compte.
          <button onclick="renderLogin()">
            Me connecter
          </button>
        </div>
      </section>
    </main>
  `;
}

async function login(){
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  await boot();
}

async function signup(){
  const first=$("signupFirst").value.trim();
  const last=$("signupLast").value.trim();
  const birth=$("signupBirth").value;
  const phone=$("signupPhone").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;
  const password2=$("signupPassword2").value;

  if(!first || !last || !email || !password){
    alert("Remplis les champs obligatoires.");
    return;
  }

  if(password!==password2){
    alert("Les mots de passe ne correspondent pas.");
    return;
  }

  const {error}=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      data:{
        first_name:first,
        last_name:last,
        phone,
        birth_date:birth
      }
    }
  });

  if(error){
    alert(error.message);
    return;
  }

  alert(
    "Compte créé. Vérifie ton email si la confirmation est activée."
  );

  await boot();
}

async function logout(){
  showModal(`
    <h2>Déconnexion</h2>
    <p>Voulez-vous vraiment vous déconnecter ?</p>

    <div class="modal-actions">
      <button onclick="closeModal()">Annuler</button>
      <button class="confirm"
        onclick="confirmLogout()">
        Oui, me déconnecter
      </button>
    </div>
  `);
}

async function confirmLogout(){
  await supabaseClient.auth.signOut();
  closeModal();
  currentUser=null;
  currentProfile=null;
  renderLogin();
}

/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){
  const {data,error}=await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .single();

  if(error){
    console.error(error);
    return;
  }

  currentProfile=data;
}

/* =========================================================
   FEED
========================================================= */

async function loadFeed(){
  const {data,error}=await supabaseClient
    .from("posts")
    .select(`
      *,
      profiles:user_id(
        id,
        first_name,
        last_name,
        username,
        avatar_url
      )
    `)
    .eq("visibility","public")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    console.error(error);
    return;
  }

  posts=data || [];
}

async function loadStories(){
  const {data,error}=await supabaseClient
    .from("stories")
    .select(`
      *,
      profiles:user_id(
        id,
        first_name,
        last_name,
        avatar_url
      )
    `)
    .gt("expires_at",new Date().toISOString())
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  stories=data || [];
}

/* =========================================================
   FEED UI
========================================================= */

async function renderHome(){
  await loadFeed();
  await loadStories();

  $("app").innerHTML=`
    <header class="topbar">
      <div class="brand">AIDABA</div>

      <div class="header-actions">
        <button class="icon-btn"
          onclick="openSearch()">⌕</button>

        <button class="icon-btn"
          onclick="openMenu()">☰</button>
      </div>
    </header>

    <main class="page">

      <section class="create">
        <div class="create-row">
          <img class="avatar"
            src="${avatar(currentProfile)}">

          <button class="create-input"
            onclick="openComposer()">
            Quoi de neuf ?
          </button>
        </div>

        <div class="create-actions">
          <button class="action-small"
            onclick="openComposer('image')">
            📷 Photo
          </button>

          <button class="action-small"
            onclick="openComposer('video')">
            🎬 Vidéo
          </button>

          <button class="action-small"
            onclick="openStoryComposer()">
            ✦ Story
          </button>
        </div>
      </section>

      <section class="stories">
        <div class="story create-story"
          onclick="openStoryComposer()">
          <div class="plus">+</div>
          <strong>Créer une story</strong>
        </div>

        ${renderStories()}
      </section>

      <section id="feed">
        ${posts.length
          ? posts.map(renderPost).join("")
          : emptyFeed()}
      </section>

    </main>

    ${bottomNav("home")}
  `;

  observeVideos();
}

function emptyFeed(){
  return `
    <div style="text-align:center;padding:60px 20px;color:var(--muted)">
      <h2>Bienvenue sur AIDABA</h2>
      <p>
        Ton fil d'actualité est encore vide.
        Publie ton premier contenu.
      </p>
    </div>
  `;
}

function renderStories(){
  const groups={};

  stories.forEach(s=>{
    if(!groups[s.user_id]) groups[s.user_id]=[];
    groups[s.user_id].push(s);
  });

  return Object.values(groups).map(group=>{
    const s=group[0];
    const p=s.profiles;

    return `
      <div class="story"
        onclick='openStories(${JSON.stringify(group).replaceAll("'","&#39;")})'>

        ${
          s.media_type==="video"
          ? `<video src="${escapeHTML(s.media_url)}"
                    muted></video>`
          : `<img src="${escapeHTML(s.media_url)}">`
        }

        <div class="story-name">
          ${escapeHTML(
            `${p?.first_name||""} ${p?.last_name||""}`
          )}
        </div>
      </div>
    `;
  }).join("");
}

function renderPost(post){
  const p=post.profiles || {};

  const media =
    post.media_type==="video"
    ? `
      <video
        class="post-media post-video"
        src="${escapeHTML(post.media_url)}"
        playsinline
        muted
        loop
        preload="metadata"
        data-video-post="${post.id}"
        onclick="toggleVideo(this)">
      </video>
    `
    : post.media_type==="image"
    ? `
      <img
        class="post-media"
        src="${escapeHTML(post.media_url)}"
        loading="lazy">
    `
    : "";

  return `
    <article class="post"
      data-post-id="${post.id}">

      <header class="post-head">

        <img class="avatar"
          src="${avatar(p)}">

        <div class="post-user">
          <strong>
            ${escapeHTML(
              `${p.first_name||""} ${p.last_name||""}`
            )}
          </strong>

          <small>${formatDate(post.created_at)}</small>
        </div>

        <button class="icon-btn">•••</button>
      </header>

      ${
        post.content

/* =========================================================
   AUTOPLAY VIDEO
========================================================= */

function observeVideos(){
  const videos=document.querySelectorAll(".post-video");

  if(!videos.length) return;

  const observer=new IntersectionObserver(
    entries=>{
      entries.forEach(entry=>{
        const video=entry.target;

        if(entry.isIntersecting && entry.intersectionRatio>=.65){
          video.play().catch(()=>{});
          registerView(
            video.dataset.videoPost
          );
        }else{
          video.pause();
          video.currentTime=video.currentTime;
        }
      });
    },
    {
      threshold:[0,.65,1]
    }
  );

  videos.forEach(video=>observer.observe(video));
}

function toggleVideo(video){
  if(video.paused){
    video.play().catch(()=>{});
  }else{
    video.pause();
  }
}

              onclick="toggleLike('${p.id}',this)">
              ♡
              <span>${p.likes_count||0}</span>

              onclick="toggleSave('${p.id}',this)">
              ♧
              <span>${p.saves_count||0}</span>
            </button>

              )}
            </strong>

            <div>
              ${escapeHTML(p.content||"")}
            </div>
          </div>

        </article>
      `).join("")}

    </section>
  `;

  document.body.insertAdjacentHTML("beforeend",html);

  const container=$("shortsFeed");

  const observer=new IntersectionObserver(
    entries=>{
      entries.forEach(entry=>{
        const video=entry.target.querySelector("video");

        if(entry.isIntersecting){
          document.querySelectorAll(".short video")
            .forEach(v=>{

  document.querySelectorAll(".short")

async function publishPost(){
  const text=$("postText").value.trim();
  const file=$("postFile").files[0];

  if(!text && !file){
    alert("Ajoute une photo, une vidéo ou une description.");
    return;
  }

  let media_url=null;
  let media_type=null;

  if(file){
    const ext=file.name.split(".").pop();
    const path=
      `${currentUser.id}/${crypto.randomUUID()}.${ext}`;

    const {error}=await supabaseClient
      .storage
      .from("posts")
      .upload(path,file,{
        upsert:false
      });

    if(error){
      alert(error.message);
      return;
    }

    const {data:urlData}=
      supabaseClient
      .storage
      .from("posts")
      .getPublicUrl(path);

    media_url=urlData.publicUrl;

    media_type=file.type.startsWith("video")
      ? "video"
      : "image";
  }

  const hashtags=
    [...text.matchAll(/#[\p{L}\p{N}_]+/gu)]
      .map(x=>x[0].toLowerCase());

  const {error}=await supabaseClient
    .from("posts")
    .insert({
      user_id:currentUser.id,
      content:text,
      media_url,
      media_type,
      hashtags
    });

  if(error){
    alert(error.message);
    return;
  }

  closeModal();
  await renderHome();
}

          )}
        </strong>
      </button>

      <button class="menu-item"
        onclick="openNotifications()">
        🔔
        Notifications
      </button>

      <button class="menu-item"
        onclick="openFriends()">
        👥
        Ami(e)s
      </button>

      <button class="menu-item"
        onclick="toggleDarkMode()">
        🌒
        Mode sombre
      </button>

      <button class="menu-item"
        onclick="editProfile()">
        ⚙
        Paramètres et confidentialité
      </button>

      <button class="menu-item logout"
        onclick="logout()">
        ⇥
        Déconnexion
      </button>

    </section>
    `
  );
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "aidaba_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );
}

/* =========================================================
   FRIENDS
========================================================= */

async function openFriends(){
  const {data}=await supabaseClient
    .from("profiles")
    .select("*")
    .neq("id",currentUser.id)
    .limit(100);

  showModal(`
    <h2>Personnes</h2>

    ${
      (data||[]).map(p=>`
        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          padding:12px 0;
          border-bottom:1px solid var(--line)
        ">

          <img class="avatar"
            src="${avatar(p)}">

          <div style="flex:1">
            <strong>
              ${escapeHTML(
                `${p.first_name||""} ${p.last_name||""}`
              )}
            </strong>
          </div>

          <button
            class="primary"
            style="width:auto;padding:9px 13px"
            onclick="sendFriendRequest('${p.id}')">
            Ajouter
          </button>

        </div>
      `).join("")
    }

    <button
      class="primary"
      style="margin-top:18px"
      onclick="closeModal()">
      Fermer
    </button>
  `);
}

async function sendFriendRequest(userId){
  const {data}=await supabaseClient
    .from("friendships")
    .select("id")
    .or(
      `and(requester_id.eq.${currentUser.id},addressee_id.eq.${userId}),and(requester_id.eq.${userId},addressee_id.eq.${currentUser.id})`
    )
    .maybeSingle();

  if(data){
    alert("Une relation existe déjà.");
    return;
  }

  const {data:friendship,error}=await supabaseClient
    .from("friendships")
    .insert({
      requester_id:currentUser.id,
      addressee_id:userId
    })
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  await supabaseClient
    .from("notifications")
    .insert({
      user_id:userId,
      actor_id:currentUser.id,
      type:"friend_request",
      friendship_id:friendship.id,
      message:`${currentProfile.first_name} ${currentProfile.last_name} vous a envoyé une demande d'ami.`
    });

  alert("Demande envoyée.");
}

/* =========================================================
   SEARCH
========================================================= */

async function openSearch(){
  showModal(`
    <h2>Rechercher</h2>

    <input id="searchInput"
      class="input"
      placeholder="Nom ou prénom..."
      oninput="searchUsers()">

    <div id="searchResults"></div>
  `);
}

async function searchUsers(){
  const q=$("searchInput").value.trim();

  if(q.length<2){
    $("searchResults").innerHTML="";
    return;
  }

  const {data}=await supabaseClient
    .from("profiles")
    .select("*")
    .or(
      `first_name.ilike.%${q}%,last_name.ilike.%${q}%,username.ilike.%${q}%`
    )
    .limit(20);

  $("searchResults").innerHTML=
    (data||[]).map(p=>`
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px 0;
        border-bottom:1px solid var(--line)
      ">
        <img class="avatar" src="${avatar(p)}">

        <strong>
          ${escapeHTML(
            `${p.first_name||""} ${p.last_name||""}`
          )}
        </strong>
      </div>
    `).join("");
}

/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  supabaseClient
    .channel("aidaba-posts")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      async()=>{
        await loadFeed();

        if(document.querySelector("#feed")){
          renderHome();
        }
      }
    )
    .subscribe();

  supabaseClient
    .channel("aidaba-notifications")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"notifications",
        filter:`user_id=eq.${currentUser.id}`
      },
      payload=>{
        console.log(
          "Nouvelle notification",
          payload.new
        );
      }
    )
    .subscribe();
}

/* =========================================================
   PUSH WEB
========================================================= */

async function enablePushNotifications(){

  if(!("Notification" in window)){
    return;
  }

  if(!("serviceWorker" in navigator)){
    return;
  }

  const permission=
    await Notification.requestPermission();

  if(permission!=="granted"){
    return;
  }

  const registration=
    await navigator.serviceWorker.register(
      "/sw.js"
    );

  /*
    Ici il faudra ajouter ta clé publique VAPID.
    Elle ne doit PAS être ta clé service_role.
  */

  console.log(
    "Service Worker enregistré",
    registration
  );
}

/* =========================================================
   BOOT
========================================================= */

async function boot(){

  const {
    data:{session}
  }=await supabaseClient.auth.getSession();

  if(!session){
    renderLogin();
    return;
  }

  currentUser=session.user;

  await loadProfile();

  if(localStorage.getItem("aidaba_dark")==="1"){
    document.body.classList.add("dark");
  }

  await renderHome();

  subscribeRealtime();

  /*
    Activation à faire lorsque ton Web Push est configuré.
  */
  // enablePushNotifications();
}

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{
    if(session){
      currentUser=session.user;
    }
  }
);

boot();

</script>
