<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIDABA Market — Ibrahima bah vous souhaite la bienvenue dans le marché Guinée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#16213E; --surface:#1F2F52; --surface-2:#28396266;
  --mango:#E8A33D; --terracotta:#C1443D; --cream:#F2EAD8;
  --verified:#3E8E7E; --line:#3A4B78;
  --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--ink); color:var(--cream); font-family:var(--font-body); min-height:100vh;}
h1,h2,h3{font-family:var(--font-display); font-weight:600;}
a{color:inherit;}
button{font-family:var(--font-body); cursor:pointer; border:none;}
input,select,textarea{font-family:var(--font-body);}

/* ---- HEADER ---- */
header{position:sticky; top:0; z-index:50; background:var(--ink); border-bottom:1px solid var(--line); padding:14px 16px;}
.header-row{display:flex; align-items:center; gap:10px;}
.logo{font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--mango); white-space:nowrap;}
.search-bar{flex:1; display:flex; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
.search-bar input{background:transparent; border:none; color:var(--cream); width:100%; outline:none; font-size:0.95rem;}
.icon-btn{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:var(--cream); font-size:1.1rem; position:relative;}
.badge{position:absolute; top:-6px; right:-6px; background:var(--terracotta); color:var(--cream); font-size:0.65rem; padding:1px 5px; border-radius:20px; font-weight:700;}
.tabs{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
.tab{padding:6px 14px; border-radius:20px; background:var(--surface); border:1px solid var(--line); font-size:0.85rem; white-space:nowrap; color:var(--cream); opacity:0.7;}
.tab.active{background:var(--mango); color:var(--ink); border-color:var(--mango); opacity:1; font-weight:600;}

/* ---- CATEGORY STRIP ---- */
.cat-strip{display:flex; gap:10px; padding:14px 16px; overflow-x:auto;}
.cat-chip{flex-shrink:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 16px; font-size:0.8rem; text-align:center; min-width:76px;}

/* ---- RECO RAILS (défilement horizontal) ---- */
.reco-rail{margin:0 0 18px;}
.reco-rail-title{font-size:0.95rem; font-weight:600; margin:0 16px 10px; display:flex; align-items:center; gap:6px;}
.reco-scroll{display:flex; gap:10px; overflow-x:auto; padding:0 16px 4px;}
.reco-card{flex-shrink:0; width:130px; background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.reco-card .card-stripe{height:4px;}
.reco-card .card-img{aspect-ratio:1; font-size:1.4rem;}
.reco-card .card-body{padding:8px 9px 10px;}
.reco-card .card-title{font-size:0.76rem; min-height:2em;}
.reco-card .card-price{font-size:0.85rem;}

/* ---- PRODUCT GRID (market stall style) ---- */
main{padding:16px; max-width:1100px; margin:0 auto;}
.section-title{font-size:1.15rem; margin:18px 0 12px; display:flex; align-items:center; justify-content:space-between;}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
.card{background:var(--surface); border-radius:8px; overflow:hidden; border:1px solid var(--line); display:flex; flex-direction:column;}
.card-stripe{height:5px; background:linear-gradient(90deg,var(--mango),var(--terracotta));}
.card-img{aspect-ratio:1; background:#0f1830; display:flex; align-items:center; justify-content:center; color:var(--line); font-size:1.8rem;}.card-img img{display:block;width:100%;height:100%;object-fit:cover;min-width:0;min-height:0;} .seller-product-mini img{display:block;width:100%;height:100%;object-fit:cover;}
.card-body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1;}
.card-title{font-size:0.88rem; font-weight:500; line-height:1.3; min-height:2.3em;}
.card-price{font-family:var(--font-display); font-weight:700; color:var(--mango); font-size:1rem;}
.card-wholesale{font-size:0.7rem; color:var(--verified);}
.card-seller{font-size:0.7rem; opacity:0.65; display:flex; align-items:center; gap:4px;}
.verified-dot{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:#3B82F6; color:white; font-size:9px; font-weight:900;}
.verified-dot::after{content:"✓";}

/* ---- BUTTONS ---- */
.btn{padding:11px 18px; border-radius:10px; font-weight:600; font-size:0.9rem;}
.btn-primary{background:var(--mango); color:var(--ink);}
.btn-secondary{background:var(--surface); color:var(--cream); border:1px solid var(--line);}
.btn-danger{background:var(--terracotta); color:var(--cream);}
.btn-full{width:100%;}
.btn-sm{padding:7px 12px; font-size:0.8rem; border-radius:8px;}

/* ---- MODAL / SHEET ---- */
.overlay{position:fixed; inset:0; background:rgba(10,15,30,0.7); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:640px){.overlay{align-items:center;}}
.sheet{background:var(--ink); border:1px solid var(--line); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px;}
@media(min-width:640px){.sheet{border-radius:18px;}}
.sheet-close{float:right; background:none; color:var(--cream); font-size:1.3rem; opacity:0.6;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.8rem; margin-bottom:6px; opacity:0.8;}
.field input,.field select,.field textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--cream); font-size:0.92rem;}
.field textarea{resize:vertical; min-height:70px;}
.row-split{display:flex; gap:10px;}
.row-split>*{flex:1;}
.qty-picker{display:flex; align-items:center; gap:12px;}
.qty-picker button{width:34px; height:34px; border-radius:8px; background:var(--surface); border:1px solid var(--line); color:var(--cream); font-size:1.1rem;}
.divider{height:1px; background:var(--line); margin:16px 0;}
.status-pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:600;}
.status-pending{background:#4a3a1a; color:var(--mango);}
.status-approved{background:#1a4a3d; color:var(--verified);}
.status-rejected{background:#4a1a1a; color:var(--terracotta);}
.empty-state{text-align:center; padding:40px 20px; opacity:0.6;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--verified); color:var(--ink); padding:10px 20px; border-radius:10px; font-weight:600; font-size:0.85rem; z-index:200;}
.cart-line{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
.cart-line-img{width:52px; height:52px; border-radius:6px; background:var(--surface); flex-shrink:0;}
.order-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;}
.hidden{display:none !important;}
footer.tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--ink); border-top:1px solid var(--line); display:flex; padding:8px 0 max(8px,env(safe-area-inset-bottom)); z-index:50;}
.tabbar button{flex:1; background:none; color:var(--cream); opacity:0.55; font-size:0.68rem; display:flex; flex-direction:column; align-items:center; gap:3px;}
.tabbar button.active{opacity:1; color:var(--mango);}
.tabbar .ic{font-size:1.25rem;}
.spacer-bottom{height:70px;}

/* ---- SPLASH ---- */
#splash{position:fixed; inset:0; background:var(--ink); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity 0.4s ease;}
#splash .splash-logo{font-family:var(--font-display); font-size:2.4rem; font-weight:700; color:var(--mango); letter-spacing:1px;}
#splash .splash-tag{font-size:0.8rem; opacity:0.6; letter-spacing:2px; text-transform:uppercase; margin-top:-12px;}
#splash .splash-ring{width:34px; height:34px; border:3px solid var(--surface); border-top-color:var(--mango); border-radius:50%; animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#splash.fade-out{opacity:0; pointer-events:none;}

/* ---- ROLE PICKER ---- */
.role-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
.role-card{background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:18px 12px; text-align:center; cursor:pointer;}
.role-card.selected{border-color:var(--mango); background:#2a3a5f;}
.role-card .role-ic{font-size:1.6rem; margin-bottom:8px; display:block;}
.role-card .role-label{font-weight:600; font-size:0.9rem;}
.role-card .role-sub{font-size:0.72rem; opacity:0.6; margin-top:2px;}
.loc-status{font-size:0.78rem; padding:8px 10px; border-radius:8px; background:var(--surface); border:1px solid var(--line); margin-bottom:12px;}
.loc-status.ok{color:var(--verified); border-color:var(--verified);}

.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--surface);border:1px solid var(--line)}
.product-images-preview{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.product-images-preview img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.product-gallery{margin-bottom:14px}.product-gallery-main{aspect-ratio:1/1;background:#0f1830;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.product-gallery-main img{width:100%;height:100%;object-fit:contain}.product-gallery-thumbs{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px}.product-gallery-thumb{width:58px;height:58px;flex:0 0 58px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);padding:0}.product-gallery-thumb.active{border-color:var(--mango)}.product-gallery-thumb img{width:100%;height:100%;object-fit:cover}.seller-mini-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.seller-mini-head img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--surface)}
.card-payment-note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;font-size:.78rem}.fee-row{display:flex;justify-content:space-between;font-size:.78rem;margin:5px 0}.fee-row.total{font-weight:800;font-size:.9rem;padding-top:7px;border-top:1px solid var(--line)}.payment-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;margin:10px 0;font-size:.78rem}.payment-box strong{display:block;margin-bottom:4px}.payment-status{font-weight:700}.payment-status.pending{color:var(--mango)}.payment-status.paid{color:var(--verified)}.payment-status.failed{color:var(--terracotta)}
.rating{color:var(--mango);letter-spacing:1px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat-box strong{display:block;font-size:1rem;color:var(--mango)}.stat-box span{font-size:.68rem;opacity:.65}
.notification-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.notification-item.unread{background:rgba(232,163,61,.06);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px}.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--terracotta);margin-top:6px;flex:none}.seller-head{display:flex;align-items:center;gap:10px}.verified-badge{font-size:.68rem;background:#1a4a3d;color:var(--verified);padding:3px 7px;border-radius:20px}

/* ---- COMPACT FACEBOOK/ALIEXPRESS STYLE SELLER PROFILE ---- */
.seller-profile{padding:0 0 4px;}
.seller-cover{height:92px;border-radius:14px;background:linear-gradient(135deg,#283962,#16213E 58%,#C1443D);position:relative;overflow:hidden;margin:-4px -2px 0;}
.seller-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(232,163,61,.25),transparent 55%);}
.seller-profile-head{display:flex;gap:11px;align-items:flex-end;margin-top:-32px;padding:0 8px;position:relative;z-index:2;}
.seller-profile-avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--surface);border:3px solid var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25);}
.seller-profile-main{min-width:0;padding-bottom:3px;}
.seller-profile-name{font-family:var(--font-body);font-size:1rem;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.seller-profile-sub{font-size:.68rem;opacity:.65;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px;}
.seller-profile-badge{font-size:.62rem;background:#1a4a3d;color:#65c7ae;padding:3px 7px;border-radius:20px;font-weight:700;}
.seller-profile-details{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0;}
.seller-detail{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 9px;min-width:0;}
.seller-detail strong{display:block;font-size:.7rem;opacity:.55;margin-bottom:2px;font-weight:500;}
.seller-detail span{font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seller-about{font-size:.78rem;line-height:1.45;opacity:.78;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0 12px;}
.seller-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 14px;}
.seller-stat{padding:8px 4px;text-align:center;border-right:1px solid var(--line);}
.seller-stat:last-child{border-right:0;}
.seller-stat strong{display:block;font-size:.86rem;color:var(--mango);}
.seller-stat span{display:block;font-size:.61rem;opacity:.55;margin-top:2px;}
.seller-rating-line{display:flex;align-items:center;gap:7px;font-size:.75rem;margin:0 0 12px;}
.seller-products-title{font-size:.9rem;font-weight:700;margin:8px 0 9px;}
.seller-products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.seller-product-mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;}
.seller-product-mini img,.seller-product-mini .mini-placeholder{width:100%;aspect-ratio:1;display:block;object-fit:cover;background:#0f1830;}
.seller-product-mini .mini-info{padding:6px 7px;}
.seller-product-mini .mini-title{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seller-product-mini .mini-price{font-size:.7rem;color:var(--mango);font-weight:700;margin-top:2px;}
.profile-compact-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;}
.profile-topline{display:flex;align-items:center;gap:10px;}
.profile-topline .avatar{width:58px;height:58px;}
.profile-name-line{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:5px;}
.profile-meta{font-size:.72rem;opacity:.62;margin-top:3px;line-height:1.4;}
.profile-actions{display:flex;gap:7px;margin-top:11px;}
.profile-actions .btn{flex:1;}
.profile-cover{height:118px;border-radius:14px 14px 8px 8px;background:var(--surface);overflow:hidden;position:relative;margin-bottom:-25px;}
.profile-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.45;font-size:.85rem;}
.profile-avatar-wrap{position:relative;width:72px;height:72px;flex:none;}
.profile-avatar-large{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--surface);border:3px solid var(--ink);display:block;}
.profile-avatar-fallback{width:72px;height:72px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.profile-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.profile-info-item{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px;}
.profile-info-item strong{display:block;font-size:.68rem;opacity:.55;margin-bottom:3px;font-weight:500;}
.profile-info-item span{font-size:.78rem;word-break:break-word;}
.profile-bio{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:9px;font-size:.8rem;line-height:1.45;opacity:.82;}
.verification-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px;}
.verification-countdown{font-weight:700;color:var(--mango);margin-top:6px;}
.photo-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verified);margin-right:4px;}



/* ---- ACCOUNT / SYSTEM SETTINGS ---- */
.account-hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.account-cover{height:110px;background:linear-gradient(135deg,var(--surface),var(--ink));position:relative}
.account-cover img{width:100%;height:100%;object-fit:cover;display:block}
.account-head{display:flex;gap:11px;align-items:flex-end;padding:0 12px 12px;margin-top:-30px;position:relative}
.account-avatar{width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:var(--surface);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden;flex:none}
.account-avatar img{width:100%;height:100%;object-fit:cover}
.account-name{font-size:1.02rem;font-weight:800}.account-sub{font-size:.72rem;opacity:.65;margin-top:3px}
.account-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}.account-stat{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center}.account-stat b{display:block;color:var(--mango);font-size:.9rem}.account-stat span{font-size:.6rem;opacity:.6}
.account-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.account-menu button{background:var(--surface);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:12px 10px;text-align:left;font-size:.78rem}.account-menu button strong{display:block;font-size:.82rem;margin-bottom:3px}.account-menu button small{opacity:.6}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row strong{font-size:.82rem}.setting-row small{display:block;opacity:.6;font-size:.68rem;margin-top:2px}
.switch{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;flex:none}.switch::after{content:"";position:absolute;width:19px;height:19px;top:3px;left:3px;border-radius:50%;background:var(--cream);transition:.2s}.switch.on{background:var(--mango)}.switch.on::after{left:22px;background:var(--ink)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-btn{padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--cream);font-size:.72rem}.theme-btn.active{border-color:var(--mango);box-shadow:0 0 0 1px var(--mango) inset}
.loyalty-card{background:linear-gradient(135deg,var(--surface),#3b3158);border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}.loyalty-points{font-family:var(--font-display);font-size:1.7rem;color:var(--mango)}
.wallet-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}.wallet-balance{font-family:var(--font-display);font-size:1.35rem;color:var(--mango)}
.profile-tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.profile-tabs button{white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--cream);padding:8px 11px;border-radius:20px;font-size:.72rem}.profile-tabs button.active{background:var(--mango);color:var(--ink);border-color:var(--mango)}
@media(max-width:420px){.account-stats{grid-template-columns:repeat(2,1fr)}.account-menu{grid-template-columns:1fr}}

/* ===== AIDABA GLASS / iOS-STYLE SYSTEM ===== */
:root{
  --ink:#071225;
  --surface:rgba(255,255,255,.075);
  --surface-2:rgba(255,255,255,.12);
  --mango:#E8A33D;
  --terracotta:#C1443D;
  --cream:#F6F8FC;
  --verified:#43C69A;
  --line:rgba(255,255,255,.13);
  --glass:rgba(255,255,255,.085);
  --glass-strong:rgba(255,255,255,.14);
  --blur:24px;
}
html{background:var(--ink);}
body{
  background:
    radial-gradient(900px 500px at -10% -10%, color-mix(in srgb,var(--mango) 14%,transparent), transparent 60%),
    radial-gradient(700px 500px at 110% 10%, rgba(75,135,255,.12), transparent 60%),
    linear-gradient(145deg,#061020,#101d38 52%,#071225);
  color:var(--cream);
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%,rgba(255,255,255,.018));
}

<script>
// ============================================================
// CONFIG — remplace par ton URL/clé Supabase du projet AIDABA
// ============================================================
const SUPABASE_URL = "https://bdzdaceiettpiosstxkp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3_HoxsdOo_ndX8mNZDSEVQ_6cS7cRG7";
// Ne mets JAMAIS les secrets Orange/MTN/carte dans cet index. Ils restent côté Supabase Edge Functions.
const MOBILE_MONEY_FUNCTION = "create-mobile-money-payment";
const CARD_PAYMENT_FUNCTION = "create-card-payment";
const PAYMENT_STATUS_FUNCTION = "get-payment-status";
const PLATFORM_FEE_PERCENT = 2;
const ORDER_RPC = 'create_marketplace_order';
const ORDER_STATUS_RPC = 'update_marketplace_order_status';
let sb = null;
function withTimeout(promise, ms, label){
  return Promise.race([promise, new Promise((_, reject)=>setTimeout(()=>reject(new Error(label+' a dépassé le délai.')), ms))]);
}
async function getSupabase(){
  if(window.supabase && typeof window.supabase.createClient === 'function'){
    if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return sb;
  }
  throw new Error("La bibliothèque Supabase n’est pas disponible.");
}

let state = {
  user: null, profile: null, seller: null, sellerApplication: null,
  mode: 'retail', category: null, search: '',
  categories: [], products: null, cart: [], // products: null = en cours de chargement
  view: 'home', notifications: [], unreadNotifications: 0, sellerStats: null, selectedSeller: null, favoriteIds: new Set(), notificationChannel: null, marketplaceChannel: null
};

// ---------- UTIL ----------
function fmtGNF(n){ return Number(n||0).toLocaleString('fr-FR') + ' GNF'; }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML =
  `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }

// ---------- AUTH ----------
async function initAuth(){
  const client = await getSupabase();
  const { data: { session }, error } = await withTimeout(client.auth.getSession(),8000,'La vérification de session');
  if(error) throw error;
  if(session){ state.user = session.user; await loadProfile(); }
  client.auth.onAuthStateChange(async (event, session)=>{
    if(event === 'SIGNED_OUT'){ if(state.notificationChannel){ try{ await sb.removeChannel(state.notificationChannel); }catch(e){} state.notificationChannel=null; } if(state.marketplaceChannel){ try{ await sb.removeChannel(state.marketplaceChannel); }catch(e){} state.marketplaceChannel=null; } state.user=null; state.profile=null; state.seller=null; state.notifications=[]; state.unreadNotifications=0; updateNotificationBadge(); render(); return; }
    if(session && (!state.user || state.user.id !== session.user.id)){ state.user = session.user; try{ await loadProfile(); subscribeToNotifications(); }catch(e){ console.error(e); } render(); }
  });
}

async function loadProfile(){
  if(!state.user) return;

  // Une demande de vendeur devient automatiquement éligible après 24 h.
  // La fonction SQL sécurisée ne peut agir que pour l'utilisateur connecté.
  try{
    await sb.rpc('activate_due_seller_application', { p_user_id: state.user.id });
  }catch(e){
    // Compatible avec une base qui n'a pas encore reçu la migration finale.
    console.warn('Vérification vendeur 24h:', e.message);
  }

  const { data: profile, error: pe } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  if(pe && pe.code !== 'PGRST116') throw pe;

  state.profile = profile || null;
  state.seller = null;
  state.sellerApplication = null;

  if(profile && profile.role === 'seller'){
    const { data: seller } = await sb.from('sellers').select('*').eq('id', state.user.id).maybeSingle();
    state.seller = seller || null;
    if(state.seller) state.sellerStats = await getSellerStats(state.user.id);
  }

  const { data: app } = await sb.from('seller_applications')
    .select('*').eq('user_id', state.user.id)
    .order('created_at',{ascending:false}).limit(1).maybeSingle();
  state.sellerApplication = app || null;

  await loadNotifications();
  await loadFavoriteIds();
}

// ---------- MARKETPLACE LIVE SYNC ----------
let marketplaceSyncTimer = null;

function startMarketplaceFallbackSync(){
  if(marketplaceSyncTimer) clearInterval(marketplaceSyncTimer);
  marketplaceSyncTimer = setInterval(async ()=>{
    if(document.hidden || !sb) return;
    try{
      if(state.view==='home') await loadProducts();
    }catch(e){ console.warn('Rafraîchissement marché:',e.message); }
  }, 12000);
}

function subscribeToMarketplaceRealtime(){
  if(!sb) return;
  // Le secours HTTP démarre immédiatement. Realtime vient ensuite accélérer
  // l'apparition des nouvelles publications sans dépendre du WebSocket.
  startMarketplaceFallbackSync();
  if(state.marketplaceChannel){ try{ sb.removeChannel(state.marketplaceChannel); }catch(e){} }
  state.marketplaceChannel = sb.channel('aidaba-marketplace-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'products'},payload=>{
      if(state.view==='home') syncPublicMarketplace();
      if(state.view==='sell' && state.profile?.role==='seller') renderSellerDashboard().catch(()=>{});
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'product_images'},payload=>{
      if(state.view==='home') syncPublicMarketplace();
      if(state.view==='sell' && state.profile?.role==='seller') renderSellerDashboard().catch(()=>{});
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){
        console.log('AIDABA Marketplace realtime connecté.');
        startMarketplaceFallbackSync();
      }
      if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        console.warn('Marketplace realtime indisponible — le rafraîchissement automatique reste actif.');
        startMarketplaceFallbackSync();
      }
    });
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && state.view==='home') syncPublicMarketplace();
});
window.addEventListener('online',()=>{
  subscribeToMarketplaceRealtime();
  if(state.view==='home') syncPublicMarketplace();
});

// ---------- NOTIFICATIONS / SELLER STATS ----------
async function loadNotifications(){
  if(!state.user){ state.notifications=[]; state.unreadNotifications=0; updateNotificationBadge(); return; }
  const {data,error}=await sb.from('notifications').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(30);
  if(error){ console.warn('Notifications:',error.message); return; }
  state.notifications=data||[];
  state.unreadNotifications=state.notifications.filter(n=>!n.is_read).length;
  updateNotificationBadge();
}
function subscribeToNotifications(){
  if(!state.user || !sb) return;
  if(state.notificationChannel){ try{ sb.removeChannel(state.notificationChannel); }catch(e){} }
  state.notificationChannel = sb.channel('aidaba-notifications-'+state.user.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+state.user.id},payload=>{
      const n=payload.new;
      if(!n) return;
      state.notifications=[n,...state.notifications].slice(0,30);
      state.unreadNotifications=state.notifications.filter(x=>!x.is_read).length;
      updateNotificationBadge();
      if(n.type==='new_order') toast('🔔 Nouvelle commande reçue !');
    })
    .subscribe((status)=>{ if(status==='CHANNEL_ERROR') console.warn('Notifications realtime indisponibles.'); });
}
function updateNotificationBadge(){
  const b=document.getElementById('notifBadge'); if(!b) return;
  b.textContent=state.unreadNotifications; b.classList.toggle('hidden',!state.unreadNotifications);
}
async function markNotificationsRead(){
  if(!state.user || !state.unreadNotifications) return;
  await sb.from('notifications').update({is_read:true}).eq('user_id',state.user.id).eq('is_read',false);
  state.notifications.forEach(n=>n.is_read=true); state.unreadNotifications=0; updateNotificationBadge();
}
function openNotifications(){
  if(!state.user){ openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><div class="empty-state">Connecte-toi pour recevoir les notifications de commandes.</div>`); return; }
  const list=state.notifications.map(n=>`<div class="notification-item ${n.is_read?'':'unread'}"><div class="notif-dot"></div><div><div style="font-size:.84rem;font-weight:600">${esc(n.title||'Notification')}</div><div style="font-size:.78rem;opacity:.72;margin-top:3px">${esc(n.message||'')}</div><div style="font-size:.65rem;opacity:.45;margin-top:4px">${new Date(n.created_at).toLocaleString('fr-FR')}</div></div></div>`).join('');
  openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><h2 style="margin-bottom:14px">Notifications</h2>${list||'<div class="empty-state">Aucune notification.</div>'}`);
  markNotificationsRead();
}
async function getSellerStats(sellerId){
  try{
    const [{data:orders},{data:reviews}]=await Promise.all([
      sb.from('orders').select('id,total_amount,status').eq('seller_id',sellerId),
      sb.from('seller_reviews').select('rating').eq('seller_id',sellerId)
    ]);
    const delivered=(orders||[]).filter(o=>o.status==='delivered');
    const sales=delivered.reduce((n,o)=>n+Number(o.total_amount||0),0);
    const ratings=(reviews||[]).map(r=>Number(r.rating));
    return {orders:(orders||[]).length,delivered:delivered.length,sales,rating:ratings.length?ratings.reduce((a,b)=>a+b,0)/ratings.length:0,reviews:ratings.length};
  }catch(e){ return {orders:0,delivered:0,sales:0,rating:0,reviews:0}; }
}
async function openSellerProfile(sellerId){
  if(!sellerId)return;
  const {data:seller,error:sellerError}=await sb.from('sellers').select('*').eq('id',sellerId).maybeSingle();
  if(sellerError||!seller){toast('Profil vendeur indisponible.');return;}
  const pr=await sb.from('products').select('*').eq('seller_id',sellerId).eq('is_active',true).order('created_at',{ascending:false}).limit(12);
  const products=await decorateProducts(pr.data||[]);
  const stats=await getSellerStats(sellerId);
  let reviews=[];
  try{
    const rr=await sb.from('seller_reviews').select('rating,comment,created_at,buyer_id').eq('seller_id',sellerId).order('created_at',{ascending:false}).limit(8);

  const name=esc(seller.business_name||'Vendeur'); const city=esc(seller.city||seller.location||'Guinée'); const type=esc(seller.business_type||seller.type||'Boutique');
  const phone=esc(seller.phone||seller.contact_phone||''); const description=esc(seller.description||seller.bio||seller.about||''); const avatar=seller.avatar_url||'';
  const rating=Math.max(0,Math.min(5,Math.round(stats.rating||0))); const stars='★'.repeat(rating)+'☆'.repeat(5-rating);
  const productHtml=products.map(p=>{const first=firstProductImage(p);return `<div class="seller-product-mini" onclick="openProduct('${esc(p.id)}')">${first?`<img src="${esc(first)}" alt="">`:'<div class="mini-placeholder">📦</div>'}<div class="mini-info"><div class="mini-title">${esc(p.title)}</div><div class="mini-price">${fmtGNF(p.price_retail||p.price_wholesale)}</div></div></div>`;}).join('');

  openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><div class="seller-profile-head">${avatar?`<img src="${esc(profileImageSrc(avatar))}" alt="">`:'<div class="seller-avatar-fallback">🏪</div>'}<div><h2>${name} <span class="verified-dot"></span></h2><div style="font-size:.75rem;opacity:.65;">${city} · ${type}</div><div style="margin-top:5px;color:var(--mango);">${stars} <span style="font-size:.7rem;opacity:.65;">(${stats.reviews})</span></div></div></div><div class="seller-stats"><div><strong>${stats.delivered}</strong><span>Livrées</span></div><div><strong>${products.length}</strong><span>Produits</span></div><div><strong>${fmtGNF(stats.sales)}</strong><span>Ventes</span></div></div>${phone?`<div class="seller-detail"><strong>☎️ Contact</strong><span>${phone}</span></div>`:''}${seller.rccm_number?`<div class="seller-detail"><strong>📄 RCCM</strong><span>${esc(seller.rccm_number)}</span></div>`:''}${description?`<div class="seller-about"><strong style="font-size:.72rem;display:block;margin-bottom:4px;">À propos de cette boutique</strong>${description}</div>`:''}<div class="seller-products-title">Produits de ${name}</div><div class="seller-products-grid">${productHtml||'<div class="empty-state" style="grid-column:1/-1;padding:20px 5px;">Aucun produit publié.</div>'}</div><div class="divider"></div><div class="seller-products-title">Avis clients</div>${reviewHtml||'<div class="empty-state" style="padding:18px 5px;">Aucun avis pour le moment.</div>'}</div>`);
}

async function doSignup(){
  const name = document.getElementById('authName').value.trim();
  const email = document.getElementById('authEmail').value.trim();
  const phone = document.getElementById('authPhone').value.trim();
  const pass = document.getElementById('authPass').value;
  if(!name || !email || !phone || pass.length < 6){ toast('Remplis tous les champs (mot de passe 6+ caractères)'); return; }
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if(error){ toast(error.message); return; }
  if(data.user){
    const pr=await sb.from('profiles').upsert({ id: data.user.id, full_name: name, phone, role: selectedRole }, { onConflict: 'id' });
    if(pr.error){ console.warn('Profil initial:',pr.error.message); }
  }
  if(!data.session){
    toast('Vérifie ta boîte email pour confirmer ton compte.');
    closeModal(); return;
  }
  toast('Compte créé ! Bienvenue sur AIDABA Market.');
  closeModal(); await loadProfile(); render(); renderRecommendations();
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ toast('Entre ton email et ton mot de passe'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ toast('Identifiants incorrects'); return; }
  toast('Connecté !'); closeModal(); await loadProfile(); render(); renderRecommendations();
}

function esc(v){

// ---------- IMAGE HELPERS (robustes) ----------
function firstProductImage(p){
  const arr=Array.isArray(p?.product_images)?p.product_images:[];
  const first=arr.slice().sort((a,b)=>(Number(a?.position??0)-Number(b?.position??0)))[0];
  return first?.url || p?.image_url || p?.thumbnail_url || '';
}
function imageHtml(url,alt='Produit'){
  const safeUrl=esc(url||'');
  const safeAlt=esc(alt||'Produit');
  if(!safeUrl) return '<div class="image-placeholder" aria-label="Image indisponible">🛍️</div>';
  return `<img loading="lazy" decoding="async" src="${safeUrl}" alt="${safeAlt}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'image-placeholder',textContent:'🛍️'}))">`;
}
async function attachProductImages(products){
  const list=Array.isArray(products)?products:[];
  if(!list.length) return list;
  const ids=[...new Set(list.map(p=>p?.id).filter(Boolean))];
  if(!ids.length) return list;
  const {data,error}=await sb.from('product_images').select('id,product_id,url,position,created_at').in('product_id',ids).order('position',{ascending:true});
  if(error){
    console.warn('Photos produits:',error.message);
    list.forEach(p=>{if(!Array.isArray(p.product_images))p.product_images=[];});
    return list;
  }
  const map={};
  (data||[]).forEach(im=>{(map[im.product_id]??=[]).push(im);});
  list.forEach(p=>{p.product_images=map[p.id]||[];});
  return list;
}

async function syncPublicMarketplace(){
  if(!sb) return;
  try{ await loadProducts(); }catch(e){ console.warn('Synchronisation publique du marché:',e.message); }
}

async function fetchSellersByIds(ids){
  const unique=[...new Set((ids||[]).filter(Boolean))];
  if(!unique.length) return {};
  const {data,error}=await sb.from('sellers').select('*').in('id',unique);
  if(error){ console.warn('Vendeurs:',error.message); return {}; }
  return Object.fromEntries((data||[]).map(x=>[x.id,x]));
}

async function decorateProducts(products){
  const list=Array.isArray(products)?products:[];
  const sellerMap=await fetchSellersByIds(list.map(p=>p.seller_id));
  list.forEach(p=>{p.sellers=sellerMap[p.seller_id]||null;});
  await attachProductImages(list);
  return list;
}

async function loadProducts(){
  // Ne dépend jamais d'une relation PostgREST products -> sellers.
  // On charge d'abord les produits, puis les vendeurs et les photos séparément.
  let query=sb.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false}).limit(200);
  if(state.category) query=query.eq('category_id',state.category);
  if(state.search){
    const q=state.search.replace(/[%_,]/g,' ').trim();
    if(q) query=query.or(`title.ilike.%${q}%,description.ilike.%${q}%`);
  }
  const {data,error}=await query;
  if(error){
    console.error('Produits:',error.message);
    state.products=[]; renderProductGrid(); return;
  }
  state.products=await decorateProducts(data||[]);
  renderProductGrid();
}

function renderProductGrid(){
  const grid=document.getElementById('productGrid');
  if(!grid)return;
  const title=document.getElementById('gridTitle');
  if(title) title.textContent=state.mode==='wholesale'?'Offres en gros (B2B)':'Produits à l’unité';
  if(state.products===null){
    grid.innerHTML=Array(6).fill('<div class="card skeleton-card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>').join('');
    return;
  }
  const list=state.mode==='wholesale'
    ? state.products.filter(p=>p.sellers?.is_wholesale && p.price_wholesale)
    : state.products.filter(p=>p.sellers?.is_retail!==false);
  if(!list.length){
    grid.innerHTML=`<div class="empty-state glass-empty" style="grid-column:1/-1;">
      <div class="empty-icon">🛍️</div><strong>Aucun produit trouvé</strong>
      <p>Les nouvelles publications des vendeurs vérifiés apparaîtront automatiquement ici.</p>
      <button class="btn btn-secondary btn-sm" onclick="state.category=null;state.search='';const s=document.getElementById('searchInput');if(s)s.value='';loadProducts()">Voir tout le marché</button>
    </div>`;
    return;
  }
  grid.innerHTML=list.map(productCard).join('');
}

function setMode(m){

  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===m));

  const active=state.favoriteIds.has(productId);

// ---------- RECOMMANDATIONS ----------
// Système simple à base de règles, pensé pour être fiable et compréhensible dès le lancement :
// 1) "Vu récemment" — historique de navigation de l'utilisateur connecté
// 2) "Populaire à [ville]" — produits les plus commandés dans la ville de l'utilisateur (ou Conakry par défaut)
// 3) "Parce que tu as regardé X" — autres produits de la même catégorie que la dernière vue
async function logProductView(productId){
  if(!state.user) return; // pas de suivi pour les invités (pas de compte = pas de reco personnalisée)
  try { await sb.from('product_views').insert({ user_id: state.user.id, product_id: productId }); }
  catch(e){ console.error('View log error', e); }
}

async function getRecentlyViewed(){
  if(!state.user) return [];
  const {data,error}=await sb.from('product_views').select('product_id,viewed_at').eq('user_id',state.user.id).order('viewed_at',{ascending:false}).limit(30);
  if(error||!data?.length) return [];
  const ids=[]; const seen=new Set();
  for(const row of data){ if(row.product_id&&!seen.has(row.product_id)){seen.add(row.product_id);ids.push(row.product_id);} if(ids.length>=8)break; }
  const {data:products}=await sb.from('products').select('*').in('id',ids).eq('is_active',true);
  const map=Object.fromEntries((products||[]).map(p=>[p.id,p]));
  const out=ids.map(id=>map[id]).filter(Boolean);
  await decorateProducts(out); return out;
}

async function getPopularProducts(){
  // Recommandations best-effort : si RLS bloque les commandes, le marché reste pleinement fonctionnel.
  const {data,error}=await sb.from('order_items').select('product_id,quantity,order_id').limit(500);
  if(error||!data?.length) return [];
  const orderIds=[...new Set(data.map(x=>x.order_id).filter(Boolean))];
  let orders=[];
  if(orderIds.length){ const r=await sb.from('orders').select('id,delivery_city').in('id',orderIds); orders=r.data||[]; }
  const city=state.profile?.city||'Conakry';
  const cityMap=Object.fromEntries(orders.map(o=>[o.id,o.delivery_city]));
  const counts={};
  data.forEach(row=>{ const weight=cityMap[row.order_id]===city?3:1; counts[row.product_id]=(counts[row.product_id]||0)+Number(row.quantity||0)*weight; });
  const topIds=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  if(!topIds.length)return [];
  const {data:products}=await sb.from('products').select('*').in('id',topIds).eq('is_active',true);
  const map=Object.fromEntries((products||[]).map(p=>[p.id,p]));
  const out=topIds.map(id=>map[id]).filter(Boolean); await decorateProducts(out); return out;
}

async function getSimilarProducts(){
  if(!state.user)return {title:null,items:[]};
  const {data:last}=await sb.from('product_views').select('product_id').eq('user_id',state.user.id).order('viewed_at',{ascending:false}).limit(1).maybeSingle();
  if(!last?.product_id)return {title:null,items:[]};
  const {data:base}=await sb.from('products').select('category_id,title').eq('id',last.product_id).maybeSingle();
  if(!base?.category_id)return {title:null,items:[]};
  const {data}=await sb.from('products').select('*').eq('category_id',base.category_id).eq('is_active',true).neq('id',last.product_id).limit(8);
  const items=await decorateProducts(data||[]); return {title:base.title,items};
}

function recoCardHtml(p){
  const img = firstProductImage(p);
  return `<div class="reco-card" onclick="openProduct('${p.id}')">
    <div class="card-stripe"></div>
    <div class="card-img">${imageHtml(img,p.title)}</div>
    <div class="card-body">
      <div class="card-title">${esc(p.title)}</div>
      <div class="card-price">${fmtGNF(p.price_retail)}</div>
    </div>
  </div>`;
}

async function renderRecommendations(){
  const root = document.getElementById('recoRoot');
  if(!root) return;
  root.innerHTML = ''; // vide pendant le chargement, pas de faux contenu

  const [recent, popular, similar] = await Promise.all([
    getRecentlyViewed().catch(()=>[]),
    getPopularProducts().catch(()=>[]),
    getSimilarProducts().catch(()=>({title:null, items:[]}))
  ]);
  await Promise.all([attachProductImages(recent), attachProductImages(popular), attachProductImages(similar.items||[])]);

  let html = '';
  if(recent.length){
    html += `<div class="reco-rail"><div class="reco-rail-title">🕓 Vu récemment</div><div class="reco-scroll">${recent.map(recoCardHtml).join('')}</div></div>`;
  }
  if(similar.items.length){
    html += `<div class="reco-rail"><div class="reco-rail-title">✨ Comme "${similar.title}"</div><div class="reco-scroll">${similar.items.map(recoCardHtml).join('')}</div></div>`;
  }
  if(popular.length){
    const city = state.profile?.city || 'Conakry';
    html += `<div class="reco-rail"><div class="reco-rail-title">🔥 Populaire à ${city}</div><div class="reco-scroll">${popular.map(recoCardHtml).join('')}</div></div>`;
  }
  root.innerHTML = html;
}

// ---------- PRODUCT DETAIL / ADD TO CART ----------
async function openProduct(id){
  let p = (state.products||[]).find(x=>x.id===id);
  if(!p){
    const {data,error}=await sb.from('products').select('*').eq('id',id).maybeSingle();
    if(error){toast('Impossible de charger ce produit.');return;}
    p=data;
    if(p) await decorateProducts([p]);
  }else if(!Array.isArray(p.product_images)){
    await attachProductImages([p]);
  }
  if(!p) return;
  if(!state.products) state.products=[];
  if(!state.products.some(x=>x.id===p.id)) state.products.push(p);
  logProductView(id);

  const imgs=(p.product_images||[]).slice().sort((a,b)=>(a.position??0)-(b.position??0)).filter(x=>x?.url);
  const price=state.mode==='wholesale'?p.price_wholesale:p.price_retail;
  const minQty=state.mode==='wholesale'?(p.wholesale_min_qty||1):1;
  const sellerName=esc(p.sellers?.business_name||'Vendeur');
  const sellerAvatar=p.sellers?.avatar_url||'';
  const galleryId='pg-'+id.replace(/[^a-zA-Z0-9_-]/g,'');
  const gallery=imgs.length ? `
    <div class="product-gallery">
      <div class="product-gallery-main" id="${galleryId}-main">${imageHtml(imgs[0].url,p.title)}</div>
      ${imgs.length>1?`<div class="product-gallery-thumbs">${imgs.map((im,i)=>`<button class="product-gallery-thumb ${i===0?'active':''}" onclick="selectProductImage('${galleryId}',${i})"><img src="${esc(im.url)}" alt="Photo ${i+1}"></button>`).join('')}</div>`:''}
      <div style="font-size:.68rem;opacity:.55;text-align:center;margin-top:2px;">${imgs.length} photo${imgs.length>1?'s':''} · ${imgs.length>1?'fais glisser les miniatures pour voir les autres':''}</div>
    </div>` : `<div class="product-gallery"><div class="product-gallery-main">📦</div></div>`;

  window.__productGallery=window.__productGallery||{};
  window.__productGallery[galleryId]=imgs;
  openModal(`
    <button class="sheet-close" onclick="closeModal()">✕</button>
    ${gallery}
    <h2 style="font-size:1.15rem;margin-bottom:6px;">${esc(p.title)}</h2>
    <div class="seller-mini-head" onclick="openSellerProfile('${p.seller_id}')" style="cursor:pointer">
      ${sellerAvatar?`<img src="${esc(sellerAvatar)}?v=${Date.now()}" alt="">`:'<div class="avatar" style="width:30px;height:30px">👤</div>'}
      <div><div style="font-size:.78rem;font-weight:600">${sellerName} <span class="verified-dot"></span></div><div style="font-size:.66rem;opacity:.6">Vendeur vérifié · voir la boutique</div></div>
    </div>
    <div class="card-price" style="font-size:1.3rem;margin-bottom:10px;">${fmtGNF(price)} ${state.mode==='wholesale'?'/ unité (gros)':''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;"><span class="status-pill status-approved">${p.condition==='used'?'Occasion':'Neuf'}</span><span class="status-pill status-pending">Stock : ${Number(p.stock||0)}</span></div>
    <p style="font-size:.88rem;opacity:.8;line-height:1.5;margin-bottom:14px;">${esc(p.description||'Pas de description.')}</p>
    <div class="field"><label>Quantité ${state.mode==='wholesale'?`(min. ${minQty})`:''}</label>
      <div class="qty-picker"><button onclick="stepQty(-1,${minQty})">−</button><span id="qtyVal">${minQty}</span><button onclick="stepQty(1,${minQty})">+</button></div>
    </div>
    <button class="btn btn-primary btn-full" onclick="addToCart('${p.id}', ${minQty})">Ajouter au panier</button>
    <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="startCheckoutFromProduct('${p.id}',${minQty})">Commander maintenant</button>
  `);
}
function selectProductImage(galleryId,index){
  const arr=window.__productGallery?.[galleryId]||[]; const im=arr[index];
  if(!im) return;
  const main=document.getElementById(galleryId+'-main');
  if(main) main.innerHTML=imageHtml(im.url,'Photo du produit');
  document.querySelectorAll('.product-gallery-thumb').forEach((b,i)=>b.classList.toggle('active',i===index));
}
function startCheckoutFromProduct(productId,minQty){
  const qty=parseInt(document.getElementById('qtyVal')?.textContent)||minQty;
  const p=(state.products||[]).find(x=>x.id===productId);
  if(!p)return;
  const existing=state.cart.find(l=>l.product.id===productId&&l.mode===state.mode);
  if(existing) existing.qty=qty; else state.cart.push({product:p,qty,mode:state.mode});
  updateCartBadge(); closeModal(); startCheckout();
}
function stepQty(delta, min){
  const el = document.getElementById('qtyVal');
  let v = parseInt(el.textContent) + delta;
  if(v < min) v = min;
  el.textContent = v;
}
function addToCart(productId, minQty){
  const qty = parseInt(document.getElementById('qtyVal').textContent) || minQty;
  const p = (state.products||[]).find(x=>x.id===productId);
  if(!p){ toast('Produit indisponible. Réessaie.'); return; }
  const existing = state.cart.find(l => l.product.id === productId && l.mode === state.mode);
  if(existing){ existing.qty += qty; } else { state.cart.push({ product: p, qty, mode: state.mode }); }
  updateCartBadge();
  toast('Ajouté au panier');
  closeModal();
}
function updateCartBadge(){
  const n = state.cart.reduce((s,l)=>s+l.qty,0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = n; badge.classList.toggle('hidden', n===0);
}

function captureLocation(){
  const statusEl = document.getElementById('locStatus');
  if(!navigator.geolocation){ statusEl.textContent = '📍 Géolocalisation non disponible sur cet appareil'; return; }
  statusEl.textContent = '📍 Récupération de ta position...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      checkoutCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      statusEl.textContent = '✓ Position enregistrée';
      statusEl.classList.add('ok');
    },
    err => { statusEl.textContent = '📍 Impossible de récupérer ta position — remplis l’adresse manuellement'; },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}
function checkoutFeeSummary(subtotal=cartTotal()){

  if(root) root.innerHTML=`<div class="fee-row"><span>Sous-total</span><strong>${fmtGNF(subtotal)}</strong></div><div class="fee-row"><span>Frais de service AIDABA (${PLATFORM_FEE_PERCENT} %)</span><strong>${fmtGNF(fee)}</strong></div><div class="fee-row total"><span>Total à payer</span><span style="color:var(--mango)">${fmtGNF(total)}</span></div>`;

    else help.innerHTML='<strong>💵 Paiement à la livraison</strong><span>Le paiement est effectué au moment de la réception de la commande.</span>';

async function invokePaymentFunction(functionName,body){
  if(!sb) return {ok:false,reason:'Supabase indisponible'};
  try{
    const {data,error}=await sb.functions.invoke(functionName,{body});
    if(error) return {ok:false,reason:error.message||'Service de paiement indisponible',data:null};
    if(data?.error) return {ok:false,reason:data.error,data};
    return {ok:true,data:data||{}};
  }catch(e){ return {ok:false,reason:e?.message||'Service de paiement indisponible',data:null}; }
}

async function requestMobileMoneyPayment(order,method,phone,total,platformFee){
  if(!order?.id) return {ok:false,reason:'Commande invalide'};
  if(!phone) return {ok:false,reason:'Numéro Mobile Money manquant'};
  return invokePaymentFunction(MOBILE_MONEY_FUNCTION,{
    order_id:order.id,
    provider:method,
    phone,
    amount:Number(total),
    currency:'GNF',
    platform_fee_percent:PLATFORM_FEE_PERCENT,
    platform_fee:Number(platformFee||0)
  });
}

async function requestCardPayment(order,total,platformFee){
  if(!order?.id) return {ok:false,reason:'Commande invalide'};
  return invokePaymentFunction(CARD_PAYMENT_FUNCTION,{
    order_id:order.id,
    amount:Number(total),
    currency:'GNF',
    platform_fee_percent:PLATFORM_FEE_PERCENT,
    platform_fee:Number(platformFee||0),
    success_url:window.location.href.split('#')[0]+'#payment-success',
    cancel_url:window.location.href.split('#')[0]+'#payment-cancelled'
  });
}


async function notifySellerNewOrder(order, sellerId, total, itemCount){
  if(!order||!sellerId||!sb)return;
  try{
    const existing=await sb.from('notifications').select('id').eq('user_id',sellerId).eq('order_id',order.id).eq('type','new_order').limit(1).maybeSingle();
    if(existing.data)return;
    const payload={user_id:sellerId,type:'new_order',title:'🛍️ Nouvelle commande à livrer',message:`Tu as reçu une nouvelle commande de ${fmtGNF(total)} avec ${itemCount} article(s). Ouvre Commandes pour voir les détails et préparer la livraison.`,order_id:order.id,is_read:false};
    const {error}=await sb.from('notifications').insert(payload);
    if(error)console.warn('[AIDABA] notification vendeur:',error.message);
  }catch(e){console.warn('[AIDABA] notification vendeur:',e.message);}
}

async function createOrderTransaction({sellerId,lines,name,city,address,phone,method,moneyPhone,ref,coords}){
  const items=lines.map(l=>({product_id:l.product.id,quantity:Number(l.qty||0),unit_price:Number(l.mode==='wholesale'?l.product.price_wholesale:l.product.price_retail)||0}));
  const subtotal=items.reduce((n,i)=>n+i.unit_price*i.quantity,0);
  const platformFee=Math.round(subtotal*PLATFORM_FEE_PERCENT/100);
  const total=subtotal+platformFee;
  const payload={
    p_seller_id:sellerId,
    p_buyer_id:state.user?.id||null,
    p_guest_name:state.user?null:name,
    p_guest_phone:state.user?null:phone,
    p_order_type:lines[0]?.mode||'retail',
    p_total_amount:total,
    p_delivery_address:address,
    p_delivery_city:city,
    p_latitude:coords?.lat||null,
    p_longitude:coords?.lng||null,
    p_payment_method:method,
    p_payment_reference:ref||null,
    p_customer_phone:(method==='orange_money'||method==='mtn_momo')?moneyPhone:null,
    p_items:items
  };
  try{
    const r=await sb.rpc(ORDER_RPC,payload);
    if(!r.error && r.data) return {ok:true,data:r.data,subtotal,platformFee,total};
    if(r.error && !['PGRST202','42883'].includes(String(r.error.code||''))) console.warn('RPC commande:',r.error.message);
  }catch(e){ console.warn('RPC commande indisponible:',e.message); }
  return {ok:false,subtotal,platformFee,total};
}

async function confirmOrder(){
  const btn=document.getElementById('ckConfirmBtn');
  if(btn){btn.disabled=true;btn.textContent='Traitement...';}
  try{
    const name=document.getElementById('ckName')?.value.trim()||state.profile?.full_name;
    const city=document.getElementById('ckCity')?.value.trim();
    const address=document.getElementById('ckAddress')?.value.trim();
    const phone=document.getElementById('ckPhone')?.value.trim();
    const method=document.getElementById('ckMethod')?.value;
    const moneyPhone=document.getElementById('ckMoneyPhone')?.value.trim()||null;
    const ref=document.getElementById('ckRef')?.value.trim()||null;
    if(!city||!address){toast('Renseigne la ville et l’adresse');return;}
    if(!phone){toast('Ton numéro de téléphone est requis');return;}
    if(!state.user&& !name){toast('Renseigne ton nom');return;}
    if(method!=='cash_on_delivery'&&!state.user){toast('Connecte-toi pour utiliser un paiement en ligne sécurisé.');return;}
    if((method==='orange_money'||method==='mtn_momo')&&!moneyPhone&&!ref){toast('Indique le numéro Mobile Money ou une référence de paiement.');return;}
    if(!state.cart.length){toast('Ton panier est vide.');return;}

    const bySeller={};
    state.cart.forEach(l=>{const sid=l.product?.seller_id;if(!sid)return;if(!bySeller[sid])bySeller[sid]=[];bySeller[sid].push(l);});
    const paymentRedirects=[];

    for(const sellerId of Object.keys(bySeller)){
      const lines=bySeller[sellerId];
      // Transaction SQL atomique si la fonction de production est installée.
      const tx=await createOrderTransaction({sellerId,lines,name,city,address,phone,method,moneyPhone,ref,coords:checkoutCoords});
      let order=null,payment=null,subtotal=tx.subtotal,platformFee=tx.platformFee,total=tx.total;

      if(tx.ok){
        const raw=Array.isArray(tx.data)?tx.data[0]:tx.data;
        const orderId=raw?.order_id||raw?.id;
        const paymentId=raw?.payment_id||null;
        if(!orderId){toast('Le serveur a créé une réponse invalide pour la commande.');return;}
        order={id:orderId,seller_id:sellerId,total_amount:Number(raw?.total_amount||total)};
        total=Number(raw?.total_amount||total);
        if(paymentId){const pr=await sb.from('payments').select('*').eq('id',paymentId).maybeSingle();payment=pr.data||null;}
        if(!payment){const pr=await sb.from('payments').select('*').eq('order_id',order.id).order('created_at',{ascending:false}).limit(1).maybeSingle();payment=pr.data||null;}
      }else{
        // Compatibilité avec une base ancienne : insertion contrôlée côté client.
        const productIds=lines.map(l=>l.product.id);
        const {data:latestProducts,error:stockError}=await sb.from('products').select('id,title,stock,is_active').in('id',productIds);
        if(stockError){toast('Impossible de vérifier le stock : '+stockError.message);return;}
        for(const line of lines){
          const latest=(latestProducts||[]).find(x=>x.id===line.product.id);
          if(!latest||latest.is_active===false){toast(`${line.product.title} n'est plus disponible.`);return;}
          if(Number(latest.stock)<Number(line.qty)){toast(`Stock insuffisant pour ${line.product.title}. Disponible : ${latest.stock}.`);return;}
        }
        const subtotalLocal=lines.reduce((n,l)=>n+(Number(l.mode==='wholesale'?l.product.price_wholesale:l.product.price_retail)||0)*Number(l.qty||0),0);
        subtotal=subtotalLocal; platformFee=Math.round(subtotalLocal*PLATFORM_FEE_PERCENT/100); total=subtotalLocal+platformFee;
        const r=await sb.from('orders').insert({buyer_id:state.user?state.user.id:null,guest_phone:state.user?null:phone,guest_name:state.user?null:name,seller_id:sellerId,order_type:lines[0].mode,total_amount:total,delivery_address:address,delivery_city:city,latitude:checkoutCoords?.lat||null,longitude:checkoutCoords?.lng||null}).select().single();
        if(r.error){toast('Erreur commande : '+r.error.message);return;} order=r.data;
        const items=lines.map(l=>({order_id:order.id,product_id:l.product.id,quantity:Number(l.qty),unit_price:Number(l.mode==='wholesale'?l.product.price_wholesale:l.product.price_retail)||0}));
        const ir=await sb.from('order_items').insert(items);
        if(ir.error){await sb.from('orders').delete().eq('id',order.id).eq('seller_id',sellerId);toast('Les articles n’ont pas pu être enregistrés : '+ir.error.message);return;}
        // Décrémentation conditionnelle en mode compatibilité. La fonction RPC reste recommandée pour éviter toute course.
        for(const line of lines){
          const before=(latestProducts||[]).find(x=>x.id===line.product.id);
          const ur=await sb.from('products').update({stock:Number(before.stock)-Number(line.qty)}).eq('id',line.product.id).eq('seller_id',sellerId).gte('stock',Number(line.qty));
          if(ur.error){console.warn('Stock non décrémenté:',ur.error.message);}
        }
        const pr=await sb.from('payments').insert({order_id:order.id,buyer_id:state.user?.id||null,seller_id:sellerId,method,amount:total,status:'pending',transaction_ref:ref,provider:method==='visa_card'?'card':method,customer_phone:(method==='orange_money'||method==='mtn_momo')?moneyPhone:null,metadata:{subtotal,platform_fee:platformFee,platform_fee_percent:PLATFORM_FEE_PERCENT,client_order_key:order.id}}).select().single();
        if(pr.error){await sb.from('order_items').delete().eq('order_id',order.id);await sb.from('orders').delete().eq('id',order.id);toast('Paiement non enregistré : '+pr.error.message);return;}
        payment=pr.data;
      }

      // Notification client-side de secours. En production, le trigger SQL fait foi et évite les notifications perdues.
      await notifySellerNewOrder(order,sellerId,total,lines.reduce((n,l)=>n+Number(l.qty||0),0));

      if(method==='mtn_momo'||method==='orange_money'){
        if(ref){toast('Référence enregistrée. Le paiement sera vérifié côté serveur.');}
        else if(method==='orange_money'){
          toast('Orange Money nécessite sa propre Edge Function de paiement. Le paiement n’a pas été envoyé à MTN.');
          return;
        } else {
          const pm=await requestMobileMoneyPayment(order,method,moneyPhone,total,platformFee);
          if(!pm.ok){toast(`${method==='mtn_momo'?'MTN Mobile Money':'Orange Money'} : ${pm.reason}`);return;}
          if(pm.data?.checkout_url)paymentRedirects.push(pm.data.checkout_url);
          if(pm.data?.external_id&&payment?.id){await sb.from('payments').update({external_id:String(pm.data.external_id),checkout_url:pm.data.checkout_url||null,customer_phone:moneyPhone}).eq('id',payment.id);}
          toast('Demande de paiement envoyée. Confirme-la sur ton téléphone.');
        }
      }else if(method==='visa_card'){
        const card=await requestCardPayment(order,total,platformFee);
        if(!card.ok){toast('Paiement par carte : '+card.reason);return;}
        const url=card.data?.checkout_url||card.data?.payment_url||card.data?.url;
        if(!url){toast('Le prestataire de carte n’a pas fourni de page de paiement.');return;}
        if(payment?.id)await sb.from('payments').update({checkout_url:url}).eq('id',payment.id);
        paymentRedirects.push(url);
      }
    }

    state.cart=[];updateCartBadge();checkoutCoords=null;closeModal();
    if(paymentRedirects.length){window.location.assign(paymentRedirects[0]);return;}
    toast(method==='cash_on_delivery'?'Commande confirmée ! Le vendeur va t’appeler.':'Commande créée. Le paiement est en cours de confirmation.');
    if(state.user)showView('orders');else showView('home');
  }catch(e){
    console.error('AIDABA confirmOrder:',e);
    toast('Une erreur inattendue a interrompu la commande. Réessaie.');
  }finally{
    if(btn&&document.getElementById('modalRoot')?.innerHTML){btn.disabled=false;onPaymentMethodChange();}
  }
}

function orderStatusLabel(status){

  if(status==='shipped') return 'En livraison';
  if(status==='delivered') return 'Livrée';
  if(status==='cancelled') return 'Annulée';
  return 'En attente';
}
function orderStatusClass(status){
  if(status==='delivered'||status==='confirmed') return 'approved';
  if(status==='cancelled') return 'rejected';

}
function formatOrderDate(value){
  if(!value) return 'Date inconnue';
  try{return new Date(value).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});}catch(e){return value;}
}

async function updateOrderStatus(orderId,newStatus){

async function loadOrderItems(orderIds){
  if(!orderIds?.length)return [];
  const {data,error}=await sb.from('order_items').select('*').in('order_id',orderIds);
  if(error){console.warn('Articles commandes:',error.message);return [];} 
  const productIds=[...new Set((data||[]).map(i=>i.product_id).filter(Boolean))];
  let products=[];
  if(productIds.length){const r=await sb.from('products').select('id,title').in('id',productIds);products=r.data||[];}
  const pmap=Object.fromEntries(products.map(p=>[p.id,p]));
  return (data||[]).map(i=>({...i,products:pmap[i.product_id]||null}));
}

async function openOrderDetails(orderId){
  if(!state.user||!orderId)return;
  const {data:order,error}=await sb.from('orders').select('*').eq('id',orderId).maybeSingle();
  if(error||!order){toast('Détails de la commande indisponibles.');return;}
  const isSeller=state.profile?.role==='seller'&&order.seller_id===state.user.id; const isBuyer=order.buyer_id===state.user.id;
  if(!isSeller&&!isBuyer){toast('Cette commande ne t’appartient pas.');return;}

function sellerVerificationRemaining(due){
  if(!due) return '';
  const ms=Math.max(0,new Date(due).getTime()-Date.now());
  if(ms<=0) return 'Vérification des 24 h terminée — activation en cours…';
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return `${h} h ${m} min restantes`;
}

function previewProductImages(input){
  const files=[...input.files].slice(0,3); input.value='';
  // rebuild DataTransfer so max 5 is enforced without losing selected files
  const dt=new DataTransfer(); files.forEach(f=>dt.items.add(f)); input.files=dt.files;
  document.getElementById('pImagesPreview').innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('');
}
async function submitProduct(){
  if(!state.user || state.profile?.role!=='seller'){toast('Seul un vendeur vérifié peut publier.');return;}
  const title=document.getElementById('pTitle').value.trim(); const rawCategory=document.getElementById('pCategory')?.value?.trim()||''; const category_id=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(rawCategory)?rawCategory:null;
  const description=document.getElementById('pDesc').value.trim(); const condition=document.getElementById('pCondition').value;
  const price_retail=parseFloat(document.getElementById('pPriceRetail').value)||null; const price_wholesale=parseFloat(document.getElementById('pPriceWholesale').value)||null;
  const wholesale_min_qty=parseInt(document.getElementById('pMinQty').value)||1; const stock=parseInt(document.getElementById('pStock').value)||0;
  const files=[...(document.getElementById('pImages').files||[])];
  if(!title || (!price_retail && !price_wholesale)){toast('Titre + au moins un prix requis');return;}
  if(files.length<1 || files.length>3){toast('Choisis entre 1 et 3 photos.');return;}
  if(files.some(f=>!f.type.startsWith('image/'))){toast('Seules les images sont autorisées.');return;}
  if(files.some(f=>f.size>8*1024*1024)){toast('Chaque photo doit faire 8 Mo maximum.');return;}
  const {data:product,error}=await sb.from('products').insert({seller_id:state.user.id,category_id,title,description,condition,price_retail,price_wholesale,wholesale_min_qty,stock,is_active:true}).select().single();
  if(error){toast('Erreur produit: '+error.message);return;}
  let uploaded=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${state.user.id}/${product.id}/${i+1}-${crypto.randomUUID()}.${ext}`;
    const up=await sb.storage.from('product-images').upload(path,f,{contentType:f.type,upsert:false,cacheControl:'31536000'});
    if(up.error){
      console.error('Upload photo:',up.error.message);
      continue;
    }
    const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);
    const publicUrl=urlData?.publicUrl;
    if(!publicUrl){ console.error('URL publique introuvable'); continue; }
    const ins=await sb.from('product_images').insert({product_id:product.id,url:publicUrl,position:i});
    if(ins.error){
      console.error('Enregistrement photo:',ins.error.message);
      // L'upload existe, mais sans ligne product_images l'image ne peut pas être affichée.
      continue;
    }
    uploaded++;
  }
  if(uploaded===0){
    try{ await sb.from('products').delete().eq('id',product.id).eq('seller_id',state.user.id); }catch(e){}
    toast('Publication annulée : aucune photo n’a pu être enregistrée. Vérifie le bucket product-images et ses politiques.');
  }else if(uploaded<files.length){
    toast(`Produit publié avec ${uploaded}/${files.length} photo(s).`);
  }else{
    toast('Produit publié avec ses photos !');
  }
  closeModal();
  await renderSellerDashboard();
  await loadProducts();
}
