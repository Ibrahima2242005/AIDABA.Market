<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Guinée Web 🇬🇳</title>

  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Guinée Web - Le réseau social guinéen" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --green: #009460;
      --yellow: #f5c400;
      --red: #ce1126;
      --blue: #1877f2;
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(
          135deg,
          rgba(206,17,38,.08),
          rgba(245,196,0,.08),
          rgba(0,148,96,.08)
        );
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,.10);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 900;
      background:
        linear-gradient(
          135deg,
          var(--red) 0 33%,
          var(--yellow) 33% 66%,
          var(--green) 66%
        );
    }

    .auth-title {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      background: #f1f3f5;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 11px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      background: #fff;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,148,96,.10);
    }

    .primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-weight: 800;
    }

    .primary:disabled {
      opacity: .5;
    }

    .secondary {
      padding: 10px 14px;
      border-radius: 10px;
      background: #eef1f4;
      font-weight: 700;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffd0d0;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .success {
      background: #edfdf3;
      color: #067647;
      border: 1px solid #b7ebc6;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 64px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 900;
      font-size: 20px;
      flex: 1;
    }

    .mini-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: 900;
      background:
        linear-gradient(
          135deg,
          var(--red) 0 33%,
          var(--yellow) 33% 66%,
          var(--green) 66%
        );
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f1f3f5;
      font-size: 18px;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -2px;
      right: -1px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 20px;
      background: var(--red);
      color: white;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .layout {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px minmax(0, 640px) 280px;
      gap: 20px;
      padding: 20px;
    }

    .sidebar {
      position: sticky;
      top: 84px;
      height: fit-content;
    }

    .side-card {
      background: white;
      border-radius: 18px;
      padding: 12px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      width: 100%;
      padding: 13px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      background: transparent;
      text-align: left;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .nav-btn.active {
      background: #e9f7f1;
      color: var(--green);
    }

    .content {
      min-width: 0;
    }

    .rightbar {
      position: sticky;
      top: 84px;
      height: fit-content;
    }

    .widget {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .widget h3 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    /* =========================
       EMPTY FEED
    ========================= */

    .empty {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .empty h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 7px;
    }

    /* =========================
       CREATE POST
    ========================= */

    .composer {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .avatar-placeholder {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .composer textarea {
      width: 100%;
      min-height: 70px;
      border: 0;
      outline: 0;
      resize: vertical;
      background: #f5f6f7;
      border-radius: 14px;
      padding: 12px;
    }

    .composer-bottom {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    /* =========================
       POSTS
    ========================= */

    .post {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .post-head {
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 10px;
    }

    .post-user {
      flex: 1;
    }

    .post-user strong {
      display: block;
      font-size: 14px;
    }

    .post-user span {
      color: var(--muted);
      font-size: 12px;
    }

    .post-body {
      padding: 0 14px 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-image {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      display: block;
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      border-top: 1px solid var(--border);
    }

    .post-action {
      padding: 12px 5px;
      background: white;
      font-weight: 700;
      color: var(--muted);
    }

    .post-action.liked {
      color: var(--red);
    }

    .comments {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }

    .comment {
      display: flex;
      gap: 8px;
      margin-bottom: 9px;
    }

    .comment-bubble {
      background: #f1f3f5;
      border-radius: 13px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .comment-input {
      display: flex;
      gap: 8px;
    }

    .comment-input input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px 12px;
      outline: none;
    }

    /* =========================
       FRIENDS
    ========================= */

    .section-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .person-info {
      flex: 1;
    }

    .person-info strong {
      display: block;
    }

    .person-info span {
      font-size: 12px;
      color: var(--muted);
    }

    .small-btn {
      padding: 8px 11px;
      border-radius: 9px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      font-size: 12px;
    }

    /* =========================
       MESSAGES
    ========================= */

    .chat-list {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .chat-item:last-child {
      border-bottom: 0;
    }

    .chat-item-info {
      flex: 1;
    }

    .chat-item-info strong {
      display: block;
    }

    .chat-item-info span {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .chat-head {
      padding: 13px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-messages {
      height: 430px;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bubble {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 15px;
      background: #eef1f4;
      align-self: flex-start;
    }

    .bubble.mine {
      align-self: flex-end;
      background: #dff5eb;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .chat-form input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 11px 14px;
      outline: none;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-card {
      background: white;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .cover {
      height: 170px;
      background:
        linear-gradient(
          90deg,
          var(--red),
          var(--yellow),
          var(--green)
        );
    }

    .profile-info {
      padding: 0 18px 20px;
      margin-top: -45px;
      position: relative;
    }

    .profile-big-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      background: #ddd;
    }

    .profile-info h2 {
      margin-top: 10px;
      font-size: 23px;
    }

    .profile-info p {
      color: var(--muted);
      margin-top: 4px;
    }

    .profile-actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }

    /* =========================
       SHORTS
    ========================= */

    .short-card {
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
      min-height: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .short-card video {
      width: 100%;
      height: 650px;
      object-fit: cover;
      display: block;
    }

    .short-overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      color: white;
    }

    .short-actions {
      position: absolute;
      right: 12px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .short-action {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0,0,0,.5);
      color: white;
      font-size: 18px;
    }

    /* =========================
       NOTIFICATIONS
    ========================= */

    .notification {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 9px;
    }

    /* =========================
       MOBILE
    ========================= */

    .bottom-nav {
      display: none;
    }

    @media(max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        max-width: 700px;
        padding: 12px 10px 85px;
      }

      .sidebar,
      .rightbar {
        display: none;
      }

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 66px;
        background: rgba(255,255,255,.97);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        z-index: 100;
        display: grid;
        grid-template-columns: repeat(5,1fr);
      }

      .bottom-nav button {
        background: transparent;
        color: var(--muted);
        font-size: 20px;
      }

      .bottom-nav button.active {
        color: var(--green);
      }

      .bottom-nav small {
        display: block;
        font-size: 9px;
        margin-top: 2px;
      }

      .topbar {
        height: 58px;
      }

      .brand {
        font-size: 17px;
      }

      .short-card {
        min-height: calc(100vh - 100px);
        border-radius: 14px;
      }

      .short-card video {
        height: calc(100vh - 100px);
      }
    }

    @media(min-width: 901px) {
      .mobile-only {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- ============================================================
     AUTHENTIFICATION
============================================================ -->

<section id="authScreen">

  <div class="auth-box">

    <div class="logo">GN</div>

    <div class="auth-title">Guinée Web</div>

    <div class="auth-subtitle">
      Le réseau social guinéen 🇬🇳
    </div>

    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="showAuth('login')">
        Connexion
      </button>

      <button id="registerTab" class="tab" onclick="showAuth('register')">
        Inscription
      </button>
    </div>

    <div id="authMessage"></div>

    <!-- LOGIN -->

    <form id="loginForm">

      <div class="field">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="exemple@email.com"
          required
        />
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Votre mot de passe"
          required
        />
      </div>

      <button class="primary" type="submit">
        Se connecter
      </button>

    </form>

    <!-- REGISTER -->

    <form id="registerForm" class="hidden">

      <div class="field">
        <label>Nom complet</label>
        <input
          id="registerName"
          type="text"
          placeholder="Votre nom"
          required
        />
      </div>

      <div class="field">
        <label>Ville</label>
        <select id="registerCity">
          <option value="">Choisir une ville</option>
          <option>Conakry</option>
          <option>Kindia</option>
          <option>Boké</option>
          <option>Labé</option>
          <option>Mamou</option>
          <option>Faranah</option>
          <option>Kankan</option>
          <option>N'Zérékoré</option>
          <option>Autre</option>
        </select>
      </div>

      <div class="field">
        <label>Email</label>
        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          placeholder="exemple@email.com"
          required
        />
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Minimum 6 caractères"
          required
        />
      </div>

      <button class="primary" type="submit">
        Créer mon compte
      </button>

    </form>

  </div>

</section>


<!-- ============================================================
     APPLICATION
============================================================ -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="brand">
      <div class="mini-logo">GN</div>
      <span>Guinée Web</span>
    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="navigate('notifications')"
        title="Notifications"
      >
        🔔
        <span id="notificationBadge" class="badge hidden">0</span>
      </button>

      <button
        class="icon-btn"
        onclick="navigate('profile')"
        title="Profil"
      >
        👤
      </button>

    </div>

  </header>


  <div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="side-card">

        <button class="nav-btn active" data-page="home" onclick="navigate('home')">
          🏠 Accueil
        </button>

        <button class="nav-btn" data-page="shorts" onclick="navigate('shorts')">
          🎬 Shorts
        </button>

        <button class="nav-btn" data-page="friends" onclick="navigate('friends')">
          👥 Amis
        </button>

        <button class="nav-btn" data-page="messages" onclick="navigate('messages')">
          💬 Messages
        </button>

        <button class="nav-btn" data-page="notifications" onclick="navigate('notifications')">
          🔔 Notifications
        </button>

        <button class="nav-btn" data-page="profile" onclick="navigate('profile')">
          👤 Profil
        </button>

        <hr style="border:0;border-top:1px solid var(--border);margin:10px 0">

        <button class="nav-btn" onclick="logout()">
          🚪 Déconnexion
        </button>

      </div>

    </aside>


    <!-- CONTENT -->

    <main id="content" class="content"></main>


    <!-- RIGHT -->

    <aside class="rightbar">

      <div class="widget">

        <h3>🇬🇳 Guinée Web</h3>

        <p style="font-size:13px;color:var(--muted);line-height:1.5">
          Connecte-toi avec les utilisateurs de Guinée et partage
          tes moments avec ta communauté.
        </p>

      </div>

      <div class="widget">

        <h3>Votre compte</h3>

        <div id="currentUserWidget"></div>

      </div>

    </aside>

  </div>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <button data-page="home" onclick="navigate('home')">
      🏠
      <small>Accueil</small>
    </button>

    <button data-page="shorts" onclick="navigate('shorts')">
      🎬
      <small>Shorts</small>
    </button>

    <button data-page="friends" onclick="navigate('friends')">
      👥
      <small>Amis</small>
    </button>

    <button data-page="messages" onclick="navigate('messages')">
      💬
      <small>Messages</small>
    </button>

    <button data-page="profile" onclick="navigate('profile')">
      👤
      <small>Profil</small>
    </button>

  </nav>

</section>


<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
  "https://llmftxuasvysawaazedm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fzGII8rJsleL-jGQb491Ag_0jMkE_46";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


/* ============================================================
   STATE
============================================================ */

let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let selectedChatUser = null;
let realtimeChannels = [];


/* ============================================================
   UTILITAIRES
============================================================ */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatDate(date) {

  if (!date) return "";

  const d = new Date(date);

  return d.toLocaleString("fr-FR", {
    day: "2-digit",
    month: "short",
    hour: "2-digit",
    minute: "2-digit"
  });
}


function initials(name) {

  if (!name) return "GN";

  return name
    .split(" ")
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}


function avatarHTML(profile, large = false) {

  const size = large ? "profile-big-avatar" : "avatar";

  if (profile?.avatar_url) {

    return `
      <img
        class="${size}"
        src="${escapeHTML(profile.avatar_url)}"
        alt=""
      >
    `;

  }

  return `
    <div
      class="${large ? "profile-big-avatar" : "avatar-placeholder"}"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:900;
      "
    >
      ${escapeHTML(initials(profile?.full_name))}
    </div>
  `;
}


function showMessage(text, type = "error") {

  const box = document.getElementById("authMessage");

  if (!box) return;

  box.innerHTML = `
    <div class="${type}">
      ${escapeHTML(text)}
    </div>
  `;
}


function clearMessage() {

  const box = document.getElementById("authMessage");

  if (box) {
    box.innerHTML = "";
  }
}


/* ============================================================
   AUTH UI
============================================================ */

function showAuth(type) {

  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");

  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");

  clearMessage();

  if (type === "login") {

    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  } else {

    loginForm.classList.add("hidden");
    registerForm.classList.remove("hidden");

    loginTab.classList.remove("active");
    registerTab.classList.add("active");

  }
}


/* ============================================================
   AUTH
============================================================ */

document
  .getElementById("loginForm")
  .addEventListener("submit", async e => {

    e.preventDefault();

    clearMessage();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const { error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(error.message);

      return;
    }

    await initializeApp();

  });


document
  .getElementById("registerForm")
  .addEventListener("submit", async e => {

    e.preventDefault();

    clearMessage();

    const name =
      document.getElementById("registerName").value.trim();

    const city =
      document.getElementById("registerCity").value;

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    if (!name) {

      showMessage("Veuillez entrer votre nom.");

      return;
    }

    const { data, error } =
      await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name,
            city: city
          }
        }
      });

    if (error) {

      showMessage(error.message);

      return;
    }

    /*
      Création du profil.

      Si la table profiles existe avec ces colonnes,
      le profil sera enregistré.
    */

    if (data.user) {

      await db
        .from("profiles")
        .upsert({
          id: data.user.id,
          full_name: name,
          city: city || null
        });

    }

    if (!data.session) {

      showMessage(
        "Compte créé. Vérifie ton email pour confirmer ton compte.",
        "success"
      );

      return;
    }

    await initializeApp();

  });


async function logout() {

  await db.auth.signOut();

  currentUser = null;
  currentProfile = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authScreen")
    .classList.remove("hidden");

  showAuth("login");
}


/* ============================================================
   INITIALISATION
============================================================ */

async function initializeApp() {

  const {
    data: {
      user
    }
  } = await db.auth.getUser();

  if (!user) {

    document
      .getElementById("app")
      .classList.add("hidden");

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

    return;
  }

  currentUser = user;

  await loadCurrentProfile();

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  updateUserWidget();

  await loadNotificationsCount();

  navigate("home");

  setupRealtime();

}


/* ============================================================
   PROFILE
============================================================ */

async function loadCurrentProfile() {

  const { data } =
    await db
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  currentProfile = data;

  if (!currentProfile) {

    const metadata =
      currentUser.user_metadata || {};

    const profile = {
      id: currentUser.id,
      full_name:
        metadata.full_name ||
        currentUser.email?.split("@")[0] ||
        "Utilisateur",
      city:
        metadata.city || null
    };

    const { data: created } =
      await db
        .from("profiles")
        .upsert(profile)
        .select()
        .maybeSingle();

    currentProfile = created || profile;
  }
}


function updateUserWidget() {

  const box =
    document.getElementById("currentUserWidget");

  if (!box) return;

  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:9px">
      ${avatarHTML(currentProfile)}
      <div>
        <strong>
          ${escapeHTML(
            currentProfile?.full_name || "Utilisateur"
          )}
        </strong>

        <div style="font-size:12px;color:var(--muted)">
          ${escapeHTML(
            currentProfile?.city || "Guinée"
          )}
        </div>
      </div>
    </div>
  `;
}


/* ============================================================
   NAVIGATION
============================================================ */

async function navigate(page) {

  currentPage = page;

  document
    .querySelectorAll(".nav-btn, .bottom-nav button")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );

    });

  const content =
    document.getElementById("content");

  content.innerHTML = `
    <div class="empty">
      <div class="empty-icon">⏳</div>
      Chargement...
    </div>
  `;

  try {

    if (page === "home") {
      await renderHome();
    }

    else if (page === "shorts") {
      await renderShorts();
    }

    else if (page === "friends") {
      await renderFriends();
    }

    else if (page === "messages") {
      await renderMessages();
    }

    else if (page === "notifications") {
      await renderNotifications();
    }

    else if (page === "profile") {
      await renderProfile();
    }

  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>

        <h2>Impossible de charger cette page</h2>

        <p>
          ${escapeHTML(error.message)}
        </p>
      </div>
    `;
  }
}

   HOME / FEED
============================================================ */

async function renderHome() {

  const content =
    document.getElementById("content");

  let posts = [];

  const result =
    await db
      .from("posts")
      .select(`
        *,
        profiles (
          id,
          full_name,
          city,
          avatar_url
        )
      `)
      .order("created_at", {
        ascending: false
      })
      .limit(50);

  if (result.error) {

    console.error(result.error);

    posts = [];

  } else {

    posts = result.data || [];

  }

  content.innerHTML = `

    <div class="composer">

      <div class="composer-row">

        ${avatarHTML(currentProfile)}

        <textarea
          id="postText"
          placeholder="Quoi de neuf en Guinée ?"
        ></textarea>

      </div>

      <div class="composer-bottom">

        <button
          class="primary"
          style="width:auto;padding:10px 18px"
          onclick="createPost()"
        >
          Publier
        </button>

      </div>

    </div>

    <div id="feed"></div>
  `;

  const feed =
    document.getElementById("feed");

  if (!posts.length) {

    feed.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🇬🇳
        </div>

        <h2>
          Bienvenue sur Guinée Web
        </h2>

        <p>
          Il n'y a encore aucune publication.
          <br>
          Sois le premier à publier quelque chose.
        </p>

      </div>
    `;

    return;
  }

  for (const post of posts) {

    feed.insertAdjacentHTML(
      "beforeend",
      await postHTML(post)
    );

  }
}


async function createPost() {

  const textarea =
    document.getElementById("postText");

  const content =
    textarea.value.trim();

  if (!content) return;

  const { error } =
    await db
      .from("posts")
      .insert({
        user_id: currentUser.id,
        content
      });

  if (error) {

    alert(error.message);

    return;
  }

  textarea.value = "";

  await renderHome();
}


/* ============================================================
   POST HTML
============================================================ */

async function postHTML(post) {

  let liked = false;
  let likesCount = 0;
  let comments = [];

  try {

    const likeResult =
      await db
        .from("likes")
        .select("id", {
          count: "exact"
        })
        .eq("post_id", post.id);

    likesCount =
      likeResult.count || 0;

    if (currentUser) {

      const mine =
        await db
          .from("likes")
          .select("id")
          .eq("post_id", post.id)
          .eq("user_id", currentUser.id)
          .maybeSingle();

      liked = !!mine.data;
    }

  } catch (_) {}

  try {

    const commentResult =
      await db
        .from("comments")
        .select(`
          *,
          profiles (
            full_name,
            avatar_url
          )
        `)
        .eq("post_id", post.id)
        .order("created_at", {
          ascending: true
        })
        .limit(20);

    comments =
      commentResult.data || [];

  } catch (_) {}

  return `

    <article class="post">

      <div class="post-head">

        ${avatarHTML(post.profiles)}

        <div class="post-user">

          <strong>
            ${escapeHTML(
              post.profiles?.full_name ||
              "Utilisateur"
            )}
          </strong>

          <span>
            ${escapeHTML(
              post.profiles?.city || ""
            )}
            ${post.created_at
              ? " · " + formatDate(post.created_at)
              : ""}
          </span>

        </div>

      </div>

      <div class="post-body">
        ${escapeHTML(post.content || "")}
      </div>

      ${
        post.image_url
          ? `
            <img
              class="post-image"
              src="${escapeHTML(post.image_url)}"
              alt=""
            >
          `
          : ""
      }

      <div class="post-actions">

        <button
          class="post-action ${liked ? "liked" : ""}"
          onclick="toggleLike('${post.id}', ${liked})"
        >
          ❤️ ${likesCount}
        </button>

        <button
          class="post-action"
          onclick="focusComment('${post.id}')"
        >
          💬 ${comments.length}
        </button>

        <button
          class="post-action"
          onclick="sharePost('${post.id}')"
        >
          ↗️ Partager
        </button>

      </div>

      <div class="comments">

        ${
          comments.map(comment => `

            <div class="comment">

              ${avatarHTML(comment.profiles)}

              <div class="comment-bubble">

                <strong>
                  ${escapeHTML(
                    comment.profiles?.full_name ||
                    "Utilisateur"
                  )}
                </strong>

                <br>

                ${escapeHTML(comment.content)}

              </div>

            </div>

          `).join("")
        }

        <div class="comment-input">

          <input
            id="comment-${post.id}"
            placeholder="Écrire un commentaire..."
          >

          <button
            class="secondary"
            onclick="addComment('${post.id}')"
          >
            Envoyer
          </button>

        </div>

      </div>

    </article>
  `;
}


/* ============================================================
   LIKES
============================================================ */

async function toggleLike(postId, liked) {

  if (!currentUser) return;

  if (liked) {

    await db
      .from("likes")
      .delete()
      .eq("post_id", postId)
      .eq("user_id", currentUser.id);

  } else {

    await db
      .from("likes")
      .insert({
        post_id: postId,
        user_id: currentUser.id
      });

  }

  await renderHome();
}


/* ============================================================
   COMMENTS
============================================================ */

function focusComment(postId) {

  const input =
    document.getElementById(
      `comment-${postId}`
    );

  if (input) {

    input.focus();

    input.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }
}


async function addComment(postId) {

  const input =
    document.getElementById(
      `comment-${postId}`
    );

  const content =
    input.value.trim();

  if (!content) return;

  const { error } =
    await db
      .from("comments")
      .insert({
        post_id: postId,
        user_id: currentUser.id,
        content
      });

  if (error) {

    alert(error.message);

    return;
  }

  await renderHome();
}


/* ============================================================
   SHARE
============================================================ */

async function sharePost(postId) {

  const url =
    `${location.origin}${location.pathname}#post-${postId}`;

  if (navigator.share) {

    await navigator.share({
      title: "Guinée Web",
      text: "Regarde cette publication sur Guinée Web 🇬🇳",
      url
    });

  } else {

    await navigator.clipboard.writeText(url);

    alert("Lien copié.");
  }
}

/* ============================================================
   AMIS
============================================================ */

async function renderFriends() {

  const content =
    document.getElementById("content");

  const { data: users } =
    await db
      .from("profiles")
      .select("*")
      .neq("id", currentUser.id)
      .order("full_name")
      .limit(50);

  let friendships = [];

  try {

    const result =
      await db
        .from("friendships")
        .select("*")
        .or(
          `requester_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
        );

    friendships =
      result.data || [];

  } catch (_) {}

  const friendshipMap =
    new Map();

  friendships.forEach(f => {

    const other =
      f.requester_id === currentUser.id
        ? f.receiver_id
        : f.requester_id;

    friendshipMap.set(
      other,
      f.status
    );

  });

  content.innerHTML = `

    <div class="section-title">
      👥 Amis
    </div>

    <div style="margin-bottom:15px">

      <input
        id="friendSearch"
        placeholder="Rechercher un utilisateur..."
        style="
          width:100%;
          padding:13px;
          border:1px solid var(--border);
          border-radius:12px;
          outline:0;
        "
        oninput="filterFriends()"
      >

    </div>

    <div id="friendsList"></div>
  `;

  const list =
    document.getElementById("friendsList");

  (users || []).forEach(user => {

    const status =
      friendshipMap.get(user.id);

    let action = "";

    if (status === "accepted") {

      action = `
        <button
          class="small-btn"
          onclick="openChat('${user.id}')"
        >
          Message
        </button>
      `;

    } else if (status === "pending") {

      action = `
        <button
          class="secondary"
          disabled
        >
          En attente
        </button>
      `;

    } else {

      action = `
        <button
          class="small-btn"
          onclick="sendFriendRequest('${user.id}')"
        >
          Ajouter
        </button>
      `;
    }

    list.insertAdjacentHTML(
      "beforeend",
      `
      <div
        class="person"
        data-name="${escapeHTML(
          (user.full_name || "").toLowerCase()
        )}"
      >

        ${avatarHTML(user)}

        <div class="person-info">

          <strong>
            ${escapeHTML(
              user.full_name || "Utilisateur"
            )}
          </strong>

          <span>
            ${escapeHTML(user.city || "Guinée")}
          </span>

        </div>

        ${action}

      </div>
      `
    );

  });

  if (!users?.length) {

    list.innerHTML = `
      <div class="empty">
        Aucun autre utilisateur pour le moment.
      </div>
    `;
  }
}


function filterFriends() {

  const value =
    document
      .getElementById("friendSearch")
      .value
      .toLowerCase();

  document
    .querySelectorAll(".person")
    .forEach(item => {

      item.style.display =
        item.dataset.name.includes(value)
          ? "flex"
          : "none";

    });
}


async function sendFriendRequest(userId) {

  const { error } =
    await db
      .from("friendships")
      .insert({
        requester_id: currentUser.id,
        receiver_id: userId,
        status: "pending"
      });

  if (error) {

    alert(error.message);

    return;
  }

  await createNotification(
    userId,
    "friend_request",
    "Vous avez reçu une demande d'ami."
  );

  await renderFriends();
}


/* ============================================================
   MESSAGES
============================================================ */

async function renderMessages() {

  if (selectedChatUser) {

    await renderChat();

    return;
  }

  const content =
    document.getElementById("content");

  let conversations = [];

  try {

    const result =
      await db
        .from("messages")
        .select(`
          *,
          sender:profiles!messages_sender_id_fkey (
            id,
            full_name,
            avatar_url
          ),
          receiver:profiles!messages_receiver_id_fkey (
            id,
            full_name,
            avatar_url
          )
        `)
        .or(
          `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
        )
        .order("created_at", {
          ascending: false
        });

    conversations =
      result.data || [];

  } catch (error) {

    console.error(error);
  }

  const people = new Map();

  conversations.forEach(message => {

    const other =
      message.sender_id === currentUser.id
        ? message.receiver
        : message.sender;

    if (other && !people.has(other.id)) {

      people.set(other.id, {
        ...other,
        last: message
      });

    }

  });

  content.innerHTML = `

    <div class="section-title">
      💬 Messages
    </div>

    <div class="chat-list">

      ${
        Array.from(people.values())
          .map(person => `

            <div
              class="chat-item"
              onclick="openChat('${person.id}')"
            >

              ${avatarHTML(person)}

              <div class="chat-item-info">

                <strong>
                  ${escapeHTML(
                    person.full_name
                  )}
                </strong>

                <span>
                  ${escapeHTML(
                    person.last?.content || ""
                  )}
                </span>

              </div>

            </div>

          `)
          .join("")
      }

    </div>

    ${
      people.size === 0
        ? `
          <div class="empty" style="margin-top:15px">

            <div class="empty-icon">
              💬
            </div>

            <h2>
              Aucun message
            </h2>

            <p>
              Tes conversations apparaîtront ici.
            </p>

          </div>
        `
        : ""
    }
  `;
}


async function openChat(userId) {

  selectedChatUser = userId;

  await renderMessages();
}


async function renderChat() {

  const content =
    document.getElementById("content");

  const { data: other } =
    await db
      .from("profiles")
      .select("*")
      .eq("id", selectedChatUser)
      .maybeSingle();

  const { data: messages } =
    await db
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedChatUser}),and(sender_id.eq.${selectedChatUser},receiver_id.eq.${currentUser.id})`
      )
      .order("created_at", {
        ascending: true
      });

  content.innerHTML = `

    <div class="chat-box">

      <div class="chat-head">

        <button
          class="secondary"
          onclick="selectedChatUser=null;renderMessages()"
        >
          ←
        </button>

        ${avatarHTML(other)}

        <strong>
          ${escapeHTML(
            other?.full_name || "Utilisateur"
          )}
        </strong>

      </div>

      <div
        id="chatMessages"
        class="chat-messages"
      >

        ${
          (messages || [])
            .map(message => `

              <div
                class="bubble ${
                  message.sender_id === currentUser.id
                    ? "mine"
                    : ""
                }"
              >
                ${escapeHTML(
                  message.content
                )}
              </div>

            `)
            .join("")
        }

      </div>

      <form
        class="chat-form"
        onsubmit="sendMessage(event)"
      >

        <input
          id="messageInput"
          placeholder="Écrire un message..."
          autocomplete="off"
          required
        >

        <button
          class="primary"
          style="width:auto;padding:10px 17px"
        >
          Envoyer
        </button>

      </form>

    </div>
  `;

  const box =
    document.getElementById("chatMessages");

  if (box) {

    box.scrollTop =
      box.scrollHeight;
  }
}


async function sendMessage(event) {

  event.preventDefault();

  const input =
    document.getElementById("messageInput");

  const content =
    input.value.trim();

  if (!content) return;

  const { error } =
    await db
      .from("messages")
      .insert({
        sender_id: currentUser.id,
        receiver_id: selectedChatUser,
        content
      });

  if (error) {

    alert(error.message);

    return;
  }

  await createNotification(
    selectedChatUser,
    "message",
    "Vous avez reçu un nouveau message."
  );

  input.value = "";

  await renderChat();
}


/* ============================================================
   NOTIFICATIONS
============================================================ */

async function createNotification(
  userId,
  type,
  content
) {

  if (!userId || userId === currentUser.id) {
    return;
  }

  try {

    await db
      .from("notifications")
      .insert({
        user_id: userId,
        type,
        content,
        read: false
      });

  } catch (error) {

    console.log(
      "Notification non créée:",
      error.message
    );
  }
}


async function loadNotificationsCount() {

  try {

    const result =
      await db
        .from("notifications")
        .select("id", {
          count: "exact"
        })
        .eq("user_id", currentUser.id)
        .eq("read", false);

    const count =
      result.count || 0;

    const badge =
      document.getElementById(
        "notificationBadge"
      );

    if (!badge) return;

    if (count > 0) {

      badge.textContent =
        count > 99
          ? "99+"
          : count;

      badge.classList.remove("hidden");

    } else {

      badge.classList.add("hidden");
    }

  } catch (_) {}
}


async function renderNotifications() {

  const content =
    document.getElementById("content");

  let notifications = [];

  try {

    const result =
      await db
        .from("notifications")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {
          ascending: false
        })
        .limit(50);

    notifications =
      result.data || [];

  } catch (_) {}

  content.innerHTML = `

    <div class="section-title">
      🔔 Notifications
    </div>

    ${
      notifications.length
        ? notifications.map(n => `

          <div class="notification">

            <div style="font-size:22px">
              🔔
            </div>

            <div style="flex:1">

              <div>
                ${escapeHTML(
                  n.content || "Notification"
                )}
              </div>

              <small style="color:var(--muted)">
                ${formatDate(n.created_at)}
              </small>

            </div>

          </div>

        `).join("")
        : `
          <div class="empty">

            <div class="empty-icon">
              🔔
            </div>

            <h2>
              Aucune notification
            </h2>

            <p>
              Tes nouvelles notifications
              apparaîtront ici.
            </p>

          </div>
        `
    }
  `;

  try {

    await db
      .from("notifications")
      .update({
        read: true
      })
      .eq("user_id", currentUser.id)
      .eq("read", false);

  } catch (_) {}

  await loadNotificationsCount();
}


/* ============================================================
   PROFIL
============================================================ */

async function renderProfile() {

  await loadCurrentProfile();

  const content =
    document.getElementById("content");

  let posts = [];

  try {

    const result =
      await db
        .from("posts")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {
          ascending: false
        });

    posts =
      result.data || [];

  } catch (_) {}

  content.innerHTML = `

    <div class="profile-card">

      <div class="cover"></div>

      <div class="profile-info">

        ${avatarHTML(currentProfile, true)}

        <h2>
          ${escapeHTML(
            currentProfile?.full_name ||
            "Utilisateur"
          )}
        </h2>

        <p>
          📍 ${escapeHTML(
            currentProfile?.city ||
            "Guinée"
          )}
        </p>

        <p>
          ${escapeHTML(
            currentProfile?.bio || ""
          )}
        </p>

        <div class="profile-actions">

          <button
            class="secondary"
            onclick="editProfile()"
          >
            ✏️ Modifier le profil
          </button>

          <button
            class="secondary"
            onclick="logout()"
          >
            🚪 Déconnexion
          </button>

        </div>

      </div>

    </div>

    <div style="margin-top:18px">

      <div class="section-title">
        Publications
      </div>

      <div id="profilePosts"></div>

    </div>
  `;

  const box =
    document.getElementById("profilePosts");

  if (!posts.length) {

    box.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          📝
        </div>

        <h2>
          Aucune publication
        </h2>

        <p>
          Tu n'as encore rien publié.
        </p>

      </div>
    `;

    return;
  }

  for (const post of posts) {

    box.insertAdjacentHTML(
      "beforeend",
      `
        <article class="post">

          <div class="post-head">

            ${avatarHTML(currentProfile)}

            <div class="post-user">

              <strong>
                ${escapeHTML(
                  currentProfile.full_name
                )}
              </strong>

              <span>
                ${formatDate(post.created_at)}
              </span>

            </div>

          </div>

          <div class="post-body">
            ${escapeHTML(post.content)}
          </div>

        </article>
      `
    );
  }
}


async function editProfile() {

  const name =
    prompt(
      "Nom complet:",
      currentProfile?.full_name || ""
    );

  if (name === null) return;

  const city =
    prompt(
      "Ville:",
      currentProfile?.city || ""
    );

  if (city === null) return;

  const bio =
    prompt(
      "Bio:",
      currentProfile?.bio || ""
    );

  if (bio === null) return;

  const { error } =
    await db
      .from("profiles")
      .update({
        full_name: name,
        city,
        bio
      })
      .eq("id", currentUser.id);

  if (error) {

    alert(error.message);

    return;
  }

  await loadCurrentProfile();

  updateUserWidget();

  await renderProfile();
}


/* ============================================================
   REALTIME
============================================================ */

function setupRealtime() {

  realtimeChannels.forEach(channel => {

    db.removeChannel(channel);

  });

  realtimeChannels = [];

  /*
    Nouvelles notifications
  */

  try {

    const notificationChannel =
      db
        .channel(
          "guinee-web-notifications"
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "notifications",
            filter:
              `user_id=eq.${currentUser.id}`
          },
          async () => {

            await loadNotificationsCount();

            if (currentPage === "notifications") {

              await renderNotifications();

            }

          }
        )
        .subscribe();

    realtimeChannels.push(
      notificationChannel
    );

  } catch (_) {}

  /*
    Messages
  */

  try {

    const messageChannel =
      db
        .channel(
          "guinee-web-messages"
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          async payload => {

            const message =
              payload.new;

            if (
              message.sender_id === currentUser.id ||
              message.receiver_id === currentUser.id
            ) {

              if (
                currentPage === "messages" &&
                selectedChatUser &&
                (
                  message.sender_id === selectedChatUser ||
                  message.receiver_id === selectedChatUser
                )
              ) {

                await renderChat();

              }

            }

          }
        )
        .subscribe();

    realtimeChannels.push(
      messageChannel
    );

  } catch (_) {}

}


/* ============================================================
   SESSION AUTOMATIQUE
============================================================ */

db.auth.onAuthStateChange(
  async (event, session) => {

    if (session?.user) {

      currentUser =
        session.user;

    } else {

      currentUser = null;

    }
  }
);


/* ============================================================
   DÉMARRAGE
============================================================ */

(async function start() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();

  if (session?.user) {

    currentUser =
      session.user;

    await initializeApp();

  } else {

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

  }

})();
</script>
