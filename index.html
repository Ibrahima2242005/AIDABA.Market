<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Guinée Web 🇬🇳</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    :root{
      --green:#009b63;
      --green2:#007d50;
      --red:#e31b23;
      --yellow:#f5d000;
      --blue:#1877f2;
      --bg:#f2f4f7;
      --card:#fff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
    }

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer;border:0}
    img,video{max-width:100%}
    .hidden{display:none!important}

    /* AUTH */
    #authScreen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:linear-gradient(
        135deg,
        rgba(227,27,35,.12),
        rgba(245,208,0,.12),
        rgba(0,155,99,.12)
      );
    }

    .auth-card{
      width:100%;
      max-width:430px;
      background:#fff;
      padding:30px;
      border-radius:28px;
      box-shadow:0 15px 50px rgba(0,0,0,.12);
    }

    .logo{
      width:66px;
      height:66px;
      display:grid;
      place-items:center;
      border-radius:20px;
      color:white;
      font-weight:900;
      font-size:22px;
      background:linear-gradient(
        135deg,
        var(--red) 0 33%,
        var(--yellow) 33% 66%,
        var(--green) 66%
      );
    }

    .auth-card h1{margin:14px 0 5px;font-size:30px}
    .muted{color:var(--muted)}

    .tabs{
      display:flex;
      gap:7px;
      background:#f1f3f5;
      padding:5px;
      border-radius:14px;
      margin:22px 0;
    }

    .tabs button{
      flex:1;
      padding:11px;
      border-radius:10px;
      background:transparent;
    }

    .tabs button.active{
      background:#fff;
      font-weight:800;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .field{margin-bottom:14px}
    .field label{
      display:block;
      margin-bottom:7px;
      font-size:14px;
      font-weight:700;
    }

    .field input,
    .field textarea,
    .field select,
    .search{
      width:100%;
      padding:13px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      outline:none;
      background:#fff;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus{
      border-color:var(--green);
    }

    .primary{
      width:100%;
      padding:14px;
      border-radius:14px;
      background:var(--green);
      color:#fff;
      font-weight:800;
    }

    .primary:hover{background:var(--green2)}

    .error,.success{
      padding:12px;
      border-radius:12px;
      margin:12px 0;
      font-size:14px;
    }

    .error{background:#fff1f2;color:#b91c1c}
    .success{background:#ecfdf5;color:#047857}

    /* APP */
    #app{min-height:100vh;padding-bottom:82px}

    header{
      height:68px;
      position:sticky;
      top:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:9px;
      font-weight:900;
    }

    .brand .logo{
      width:42px;
      height:42px;
      border-radius:13px;
      font-size:14px;
    }

    .header-actions{display:flex;gap:7px}

    .icon-btn{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#f1f3f5;
      font-size:19px;
    }

    main{
      width:100%;
      max-width:760px;
      margin:auto;
      padding:18px;
    }

    .page-title{
      margin:8px 0 18px;
      font-size:30px;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      padding:17px;
      margin-bottom:16px;
    }

    /* AVATAR */
    .avatar{
      width:48px;
      height:48px;
      min-width:48px;
      border-radius:50%;
      object-fit:cover;
      background:#e5e7eb;
      display:grid;
      place-items:center;
      font-weight:800;
      color:#374151;
    }

    /* CREATE */
    .create-box{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .fake-input{
      flex:1;
      padding:14px 17px;
      background:#f3f4f6;
      border-radius:18px;
      color:#6b7280;
      cursor:pointer;
    }

    .quick-actions{
      display:flex;
      gap:8px;
      margin-top:12px;
      border-top:1px solid var(--border);
      padding-top:12px;
    }

    .quick-actions button{
      flex:1;
      background:#f3f4f6;
      border-radius:12px;
      padding:10px;
      font-weight:700;
    }

    /* POST */
    .post-head{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .post-author{flex:1}
    .post-author strong{display:block}
    .post-author small{color:var(--muted)}

    .post-text{
      white-space:pre-wrap;
      line-height:1.5;
      margin:15px 0;
    }

    .post-media{
      border-radius:18px;
      overflow:hidden;
      background:#111;
      margin:10px 0;
    }

    .post-media img,
    .post-media video{
      display:block;
      width:100%;
      max-height:560px;
      object-fit:cover;
    }

    .post-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:5px;
      border-top:1px solid var(--border);
      padding-top:9px;
    }

    .post-actions button{
      background:transparent;
      padding:10px 5px;
      border-radius:10px;
      color:#4b5563;
    }

    .post-actions button:hover{background:#f3f4f6}
    .post-actions .liked{color:var(--green);font-weight:800}

    /* COMMENTS */
    .comments{
      border-top:1px solid var(--border);
      margin-top:10px;
      padding-top:10px;
    }

    .comment-row{
      display:flex;
      gap:8px;
      margin-bottom:8px;
    }

    .comment-bubble{
      flex:1;
      background:#f3f4f6;
      padding:8px 11px;
      border-radius:15px;
    }

    .comment-form{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .comment-form input{
      flex:1;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
    }

    .comment-form button{
      background:var(--green);
      color:#fff;
      border-radius:12px;
      padding:0 14px;
    }

    /* EMPTY */
    .empty{
      text-align:center;
      padding:55px 20px;
      color:var(--muted);
    }

    .empty-icon{font-size:55px}
    .empty h2{color:var(--text)}

    /* SHORTS */
    .short{
      background:#000;
      border-radius:20px;
      overflow:hidden;
      position:relative;
      margin-bottom:15px;
    }

    .short video{
      width:100%;
      height:min(75vh,700px);
      display:block;
      object-fit:cover;
    }

    .short-info{
      position:absolute;
      left:15px;
      right:75px;
      bottom:15px;
      color:#fff;
      text-shadow:0 1px 4px #000;
    }

    .short-actions{
      position:absolute;
      right:10px;
      bottom:15px;
    }

    .short-actions button{
      width:48px;
      height:48px;
      border-radius:50%;
      background:rgba(0,0,0,.55);
      color:#fff;
      font-size:20px;
    }

    /* FRIENDS */
    .user-row{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid var(--border);
    }

    .user-row:last-child{border-bottom:0}
    .user-info{flex:1}
    .user-info strong{display:block}
    .user-info small{color:var(--muted)}

    .friend-btn{
      background:var(--blue);
      color:#fff;
      padding:9px 13px;
      border-radius:11px;
      font-weight:700;
    }

    /* PROFILE */
    .cover{
      height:200px;
      background:linear-gradient(120deg,var(--red),var(--yellow),var(--green));
    }

    .profile-avatar-wrap{
      position:relative;
      width:110px;
      margin:-55px 0 0 20px;
    }

    .profile-avatar{
      width:110px;
      height:110px;
      border:5px solid #fff;
      border-radius:50%;
      object-fit:cover;
      background:#ddd;
    }

    .camera{
      position:absolute;
      right:0;
      bottom:0;
      width:36px;
      height:36px;
      border-radius:50%;
      background:var(--green);
      color:#fff;
      display:grid;
      place-items:center;
      border:3px solid #fff;
      cursor:pointer;
    }

    .profile-content{padding:10px 20px 20px}
    .profile-content h1{font-size:30px;margin:5px 0}
    .profile-meta{color:var(--muted);margin-bottom:15px}

    .profile-buttons{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .profile-buttons button{
      padding:11px 15px;
      border-radius:12px;
      background:#eef1f4;
      font-weight:800;
    }

    /* MESSAGES */
    .message{
      display:flex;
      margin-bottom:9px;
    }

    .message.mine{justify-content:flex-end}

    .message-bubble{
      max-width:78%;
      background:#eef1f4;
      padding:10px 14px;
      border-radius:17px;
    }

    .message.mine .message-bubble{
      background:var(--green);
      color:#fff;
    }

    .message-compose{
      display:flex;
      gap:8px;
      margin-top:15px;
    }

    .message-compose input{
      flex:1;
      border:1px solid var(--border);
      border-radius:13px;
      padding:12px;
    }

    .message-compose button{
      background:var(--green);
      color:#fff;
      border-radius:13px;
      padding:0 15px;
    }

    /* BOTTOM NAV */
    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:72px;
      z-index:50;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      background:rgba(255,255,255,.98);
      border-top:1px solid var(--border);
    }

    .bottom-nav button{
      background:transparent;
      color:#6b7280;
      font-size:12px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
    }

    .bottom-nav span:first-child{font-size:23px}
    .bottom-nav .active{color:var(--green);font-weight:800}

    /* MODAL */
    .modal{
      position:fixed;
      inset:0;
      z-index:100;
      background:rgba(0,0,0,.58);
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .modal-box{
      width:100%;
      max-width:650px;
      max-height:94vh;
      overflow:auto;
      background:#fff;
      border-radius:25px 25px 0 0;
      padding:20px;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:15px;
    }

    .close{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#f1f3f5;
    }

    /* MEDIA PICKER */
    .media-preview{
      border-radius:16px;
      overflow:hidden;
      margin-top:12px;
      background:#111;
    }

    .media-preview img,
    .media-preview video{
      width:100%;
      max-height:400px;
      object-fit:cover;
      display:block;
    }

    .visibility{
      display:flex;
      gap:8px;
    }

    .visibility button{
      flex:1;
      padding:11px;
      border-radius:12px;
      background:#f1f3f5;
    }

    .visibility button.active{
      background:#e6f7f0;
      color:var(--green2);
      font-weight:800;
      border:1px solid var(--green);
    }

    .publish-modal-btn{
      width:100%;
      margin-top:15px;
      padding:14px;
      border-radius:14px;
      background:var(--green);
      color:#fff;
      font-weight:800;
    }

    @media(min-width:800px){
      .modal{
        align-items:center;
        padding:20px;
      }

      .modal-box{border-radius:25px}
    }
  </style>
</head>

<body>

<!-- AUTH -->
<section id="authScreen">

  <div class="auth-card">

    <div class="logo">GN</div>

    <h1>Guinée Web 🇬🇳</h1>
    <p class="muted">Le réseau social guinéen.</p>

    <div class="tabs">
      <button id="loginTab" class="active">Connexion</button>
      <button id="signupTab">Inscription</button>
    </div>

    <div id="authMessage"></div>

    <form id="authForm">

      <div id="nameField" class="field hidden">
        <label>Nom complet</label>
        <input id="fullName" type="text" placeholder="Ex. Ibrahim Bah">
      </div>

      <div id="cityField" class="field hidden">
        <label>Ville</label>
        <input id="city" type="text" placeholder="Ex. Conakry">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required placeholder="ton@email.com">
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input id="password" type="password" minlength="6" required placeholder="Minimum 6 caractères">
      </div>

      <button class="primary" id="authButton">
        Se connecter
      </button>

    </form>
  </div>

</section>

<!-- APP -->
<section id="app" class="hidden">

  <header>

    <div class="brand">
      <div class="logo">GN</div>
      <span>Guinée Web 🇬🇳</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="showNotifications()">🔔</button>
      <button class="icon-btn" onclick="logout()">↪</button>
    </div>

  </header>

  <main id="page"></main>

  <nav class="bottom-nav">

    <button onclick="navigate('home')" data-page="home">
      <span>🏠</span>
      <span>Accueil</span>
    </button>

    <button onclick="navigate('shorts')" data-page="shorts">
      <span>🎬</span>
      <span>Shorts</span>
    </button>

    <button onclick="navigate('friends')" data-page="friends">
      <span>👥</span>
      <span>Amis</span>
    </button>

    <button onclick="navigate('messages')" data-page="messages">
      <span>💬</span>
      <span>Messages</span>
    </button>

    <button onclick="navigate('profile')" data-page="profile">
      <span>👤</span>
      <span>Profil</span>
    </button>

  </nav>

</section>

<!-- MODAL -->
<div id="modal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">Guinée Web</h2>
      <button class="close" onclick="closeModal()">✕</button>
    </div>

    <div id="modalContent"></div>

  </div>

</div>

<script>
/* ==========================================================
   SUPABASE
   ========================================================== */

const SUPABASE_URL =
  "https://bdzdaceiettpiosstxkp.supabase.co";

const SUPABASE_ANON_KEY =
  
"sb_publishable_3_HoxsdOo_ndX8mNZDSEVQ_6cS7cRG7";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

/* ==========================================================
   STATE
   ========================================================== */

let currentUser = null;
let currentProfile = null;
let currentPage = "home";

let selectedPostFile = null;
let selectedShortFile = null;
let selectedVisibility = "public";
let selectedConversationUser = null;

let authMode = "login";

/* ==========================================================
   HELPERS
   ========================================================== */

function escapeHTML(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name="Utilisateur"){
  return name
    .trim()
    .split(/\s+/)
    .map(x => x[0])
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function avatarHTML(profile,className="avatar"){

  if(profile && profile.avatar_url){
    return `
      <img
        class="${className}"
        src="${escapeHTML(profile.avatar_url)}"
        alt="Photo de profil"
      >
    `;
  }

  return `
    <div class="${className}">
      ${escapeHTML(initials(profile?.full_name || "Utilisateur"))}
    </div>
  `;
}

function openModal(title,content){

  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalContent").innerHTML = content;

  document.getElementById("modal")
    .classList.remove("hidden");
}

function closeModal(){

  document.getElementById("modal")
    .classList.add("hidden");

  selectedPostFile = null;
}

function authMessage(message,type="error"){

  document.getElementById("authMessage").innerHTML =
    `<div class="${type}">${escapeHTML(message)}</div>`;
}

function debounce(fn,delay){

  let timer;

  return (...args)=>{

    clearTimeout(timer);

    timer = setTimeout(
      ()=>fn(...args),
      delay
    );
  };
}

/* ==========================================================
   AUTH TABS
   ========================================================== */

document.getElementById("loginTab").onclick = ()=>{

  authMode = "login";

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");

  document.getElementById("nameField")
    .classList.add("hidden");

  document.getElementById("cityField")
    .classList.add("hidden");

  document.getElementById("authButton")
    .textContent = "Se connecter";
};

document.getElementById("signupTab").onclick = ()=>{

  authMode = "signup";

  document.getElementById("signupTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("nameField")
    .classList.remove("hidden");

  document.getElementById("cityField")
    .classList.remove("hidden");

  document.getElementById("authButton")
    .textContent = "Créer mon compte";
};

/* ==========================================================
   AUTH
   ========================================================== */

document.getElementById("authForm").onsubmit =
async event =>{

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try{

    if(authMode === "login"){

      const {data,error} =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      currentUser = data.user;

      await ensureProfile();

      openApplication();

    }else{

      const fullName =
        document.getElementById("fullName")
          .value.trim();

      const city =
        document.getElementById("city")
          .value.trim();

      if(!fullName || !city){

        authMessage(
          "Remplis ton nom complet et ta ville."
        );

        return;
      }

      const {data,error} =
        await supabaseClient.auth.signUp({

          email,
          password,

          options:{
            data:{
              full_name:fullName,
              city:city
            }
          }

        });

      if(error) throw error;

      if(data.session){

        currentUser = data.user;

        await createProfile(
          fullName,
          city
        );

        await ensureProfile();

        openApplication();

      }else{

        authMessage(
          "Compte créé. Vérifie ton email puis connecte-toi.",
          "success"
        );
      }
    }

  }catch(error){

    console.error(error);

    authMessage(
      error.message || "Une erreur est survenue."
    );
  }
};

/* ==========================================================
   PROFILE DATABASE
   ========================================================== */

async function createProfile(fullName,city){

  if(!currentUser) return;

  const {error} =
    await supabaseClient
      .from("profiles")
      .upsert({
        id:currentUser.id,
        full_name:fullName,
        city:city
      });

  if(error){
    console.error("Création profil:",error);
  }
}

async function ensureProfile(){

  if(!currentUser) return;

  let {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data){

    await createProfile(
      currentUser.user_metadata?.full_name ||
      "Utilisateur",

      currentUser.user_metadata?.city ||
      ""
    );

    const result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    data = result.data;
  }

  currentProfile = data;
}

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(!error){
    currentProfile = data;
  }
}

/* ==========================================================
   APP
   ========================================================== */

function openApplication(){

  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  navigate("home");
}

async function checkSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser = data.session.user;

    await ensureProfile();

    openApplication();

  }else{

    document.getElementById("authScreen")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");
  }
}

supabaseClient.auth.onAuthStateChange(
async(event,session)=>{

  if(session){

    currentUser = session.user;

    await ensureProfile();

    document.getElementById("authScreen")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

  }else{

    currentUser = null;
    currentProfile = null;

    document.getElementById("authScreen")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");
  }
});

async function logout(){

  await supabaseClient.auth.signOut();
}

/* ==========================================================
   NAVIGATION
   ========================================================== */

function navigate(page){

  currentPage = page;

  document.querySelectorAll(
    ".bottom-nav button"
  ).forEach(button=>{

    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  if(page === "home") loadHome();
  if(page === "shorts") loadShorts();
  if(page === "friends") loadFriends();
  if(page === "messages") loadMessages();
  if(page === "profile") loadProfilePage();
}

function showPublishPreview(){

  const url =
    URL.createObjectURL(selectedPostFile);

  if(selectedPostFile.type.startsWith("image/")){

    container.innerHTML = `
      <div class="media-preview">
        <img src="${url}" alt="Aperçu">

    `;

  }else if(selectedPostFile.type.startsWith("video/")){

    container.innerHTML = `

        <video src="${url}" controls></video>
      </div>
    `;
  }
}

/* ==========================================================
   STORAGE
   ========================================================== */

async function uploadFile(file,bucket,prefix){

  if(!file || !currentUser) return null;

  const extension =
    file.name.split(".").pop();

  const path =
    `${currentUser.id}/${prefix}-${Date.now()}.${extension}`;

  const {error} =
    await supabaseClient.storage
      .from(bucket)
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );

  if(error) throw error;

  const {data} =
    supabaseClient.storage
      .from(bucket)
      .getPublicUrl(path);

  return data.publicUrl;
}

/* ==========================================================
   PUBLISH POST
   ========================================================== */

async function publishPost(){

  if(!currentUser){

    alert("Connectez-vous pour publier.");
    return;
  }

  const text =
    document.getElementById("publishText")
      ?.value.trim() || "";

  if(!text && !selectedPostFile){

    alert(
      "Ajoutez un texte, une photo ou une vidéo."
    );

    return;
  }

  try{

    let mediaUrl = null;
    let mediaType = null;

    if(selectedPostFile){

      mediaUrl =
        await uploadFile(
          selectedPostFile,
          "posts",
          "post"
        );

      mediaType =
        selectedPostFile.type.startsWith("video/")
          ? "video"
          : "image";
    }

    const {error} =
      await supabaseClient
        .from("posts")
        .insert({
          user_id:currentUser.id,
          content:text,
          media_url:mediaUrl,
          media_type:mediaType,
          visibility:selectedVisibility
        });

    if(error) throw error;

    closeModal();

    selectedPostFile = null;

    if(currentPage === "home"){
      await loadHome();
    }

    if(currentPage === "profile"){
      await loadProfilePage();
    }

  }catch(error){

    console.error(error);

    alert(
      "Publication impossible : " +
      error.message
    );
  }
}

/* ==========================================================
   FEED
   ========================================================== */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  if(!feed) return;

  /*
    Publications publiques.
    Les publications "friends" nécessitent une
    relation acceptée dans friendships.
  */

  const {data,error} =
    await supabaseClient
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          full_name,
          city,
          avatar_url
        )
      `)
      .order("created_at",{ascending:false});

  if(error){

    feed.innerHTML = `
      <div class="card error">
        Impossible de charger le fil.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }

  const visiblePosts =
    (data || []).filter(post=>{

      if(post.visibility !== "friends"){
        return true;
      }

      return post.user_id === currentUser.id;
    });

  if(!visiblePosts.length){

    feed.innerHTML = `
      <div class="card empty">

        <div class="empty-icon">🇬🇳</div>

        <h2>Bienvenue sur Guinée Web</h2>

        <p>
          Aucune publication pour le moment.
        </p>

        <p>
          Sois le premier à partager quelque chose.
        </p>

      </div>
    `;

    return;
  }

  feed.innerHTML = "";

  for(const post of visiblePosts){

    feed.insertAdjacentHTML(
      "beforeend",
      await renderPost(post)
    );
  }
}

/* ==========================================================
   RENDER POST
   ========================================================== */

async function renderPost(post){

  let liked = false;

  if(currentUser){

    const {data} =
      await supabaseClient
        .from("likes")
        .select("id")
        .eq("post_id",post.id)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    liked = !!data;
  }

  const {count} =
    await supabaseClient
      .from("likes")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

  let media = "";

  if(post.media_url){

    if(post.media_type === "video"){

      media = `
        <div class="post-media">
          <video
            src="${escapeHTML(post.media_url)}"
            controls
            playsinline
          ></video>
        </div>
      `;

    }else{

      media = `
        <div class="post-media">
          <img
            src="${escapeHTML(post.media_url)}"
            alt="Publication"
          >
        </div>
      `;
    }
  }

  return `

    <article
      class="card"
      id="post-${escapeHTML(post.id)}"
    >

      <div class="post-head">

        ${avatarHTML(post.profiles)}

        <div class="post-author">

          <strong>
            ${escapeHTML(
              post.profiles?.full_name ||
              "Utilisateur"
            )}
          </strong>

          <small>
            📍
            ${escapeHTML(
              post.profiles?.city ||
              "Guinée"
            )}

            ·

            ${
              post.visibility === "friends"
                ? "👥 Amis"
                : "🌍 Public"
            }
          </small>

        </div>

      </div>

      ${
        post.content
          ? `
            <div class="post-text">
              ${escapeHTML(post.content)}
            </div>
          `
          : ""
      }

      ${media}

      <div class="post-actions">

        <button
          class="${liked ? "liked" : ""}"
          onclick="toggleLike('${post.id}')"
        >
          ${liked ? "💚" : "🤍"}
          J'aime ${count || 0}
        </button>

        <button
          onclick="toggleComments('${post.id}')"
        >
          💬 Commenter
        </button>

        <button
          onclick="sharePost('${post.id}')"
        >
          ↗ Partager
        </button>

      </div>

      <div
        id="comments-${post.id}"
        class="comments hidden"
      ></div>

    </article>
  `;
}

async function toggleLike(postId){

  if(!currentUser){

    alert("Connectez-vous pour aimer.");
    return;
  }

  const {data:existing} =
    await supabaseClient
      .from("likes")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing){

    await supabaseClient
      .from("likes")
      .delete()
      .eq("id",existing.id);

  }else{

    const {error} =
      await supabaseClient
        .from("likes")
        .insert({
          post_id:postId,
          user_id:currentUser.id
        });

    if(error){

      alert(error.message);
      return;
    }
  }

  await loadFeed();
}

async function toggleComments(postId){

    document.getElementById(
      `comments-${postId}`

  if(!box) return;

  box.classList.toggle("hidden");

  if(!box.classList.contains("hidden")){

    await loadComments(postId,box);
  }
}

async function loadComments(postId,box){

  const {data,error} =
    await supabaseClient
      .from("comments")
      .select(`
        *,
        profiles:user_id(
          full_name,
          avatar_url
        )
      `)
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

  if(error){

    box.innerHTML =
      `<div class="error">${escapeHTML(error.message)}</div>`;

    return;
  }

  box.innerHTML = `

    <div>

      ${
        (data || []).map(comment=>`

          <div class="comment-row">

            ${avatarHTML(comment.profiles)}

            <div class="comment-bubble">

              <strong>
                ${escapeHTML(
                  comment.profiles?.full_name ||
                  "Utilisateur"
                )}
              </strong>

              <br>

              ${escapeHTML(comment.content)}

            </div>

          </div>

        `).join("")
      }

    </div>

    <form
      class="comment-form"
      onsubmit="addComment(event,'${postId}')"
    >

      <input
        id="comment-${postId}"
        placeholder="Écrire un commentaire..."
        required
      >

      <button>
        Envoyer
      </button>

  `;
}

async function addComment(event,postId){

  event.preventDefault();

  if(!currentUser){

    alert("Connectez-vous pour commenter.");
    return;
  }

  const input =
    document.getElementById(
      `comment-${postId}`
    );

  const content =
    input.value.trim();

  if(!content) return;

  const {error} =
    await supabaseClient
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        content
      });

  if(error){

    alert(error.message);
    return;
  }

  const box =
    document.getElementById(
      `comments-${postId}`
    );

  await loadComments(postId,box);
}

async function sharePost(postId){

  const url =
    `${location.origin}${location.pathname}#post-${postId}`;

  try{

    if(navigator.share){

      await navigator.share({
        title:"Guinée Web 🇬🇳",
        text:"Regarde cette publication sur Guinée Web",
        url
      });

    }else{

      await navigator.clipboard.writeText(url);

      alert("Lien copié.");
    }

  }catch(error){
    console.log(error);
  }
}

async function searchUsers(){

  const list =
    document.getElementById("usersList");

  if(!list) return;

  const value =
    document.getElementById("userSearch")
      .value.trim();

  let query =
    supabaseClient
      .from("profiles")
      .select("*")
      .neq("id",currentUser.id)
      .limit(30);

  if(value){

    query =
      query.ilike(
        "full_name",
        `%${value}%`
      );
  }

  const {data,error} =
    await query;

  if(error){

    list.innerHTML =
      `<div class="error">${escapeHTML(error.message)}</div>`;

    return;
  }

  if(!data?.length){

    list.innerHTML =
      `<div class="empty">Aucun utilisateur trouvé.</div>`;

    return;
  }

  list.innerHTML =
    data.map(user=>`

      <div class="user-row">

        ${avatarHTML(user)}

        <div class="user-info">

          <strong>
            ${escapeHTML(user.full_name || "Utilisateur")}
          </strong>

          <small>
            📍 ${escapeHTML(user.city || "Guinée")}
          </small>

        </div>

        <button
          class="friend-btn"
          onclick="addFriend('${user.id}')"
        >
          Ajouter
        </button>

      </div>

    `).join("");
}

async function addFriend(userId){

  const {data:existing} =
    await supabaseClient
      .from("friendships")
      .select("id")
      .or(
        `and(user_id.eq.${currentUser.id},friend_id.eq.${userId}),and(user_id.eq.${userId},friend_id.eq.${currentUser.id})`
      )
      .maybeSingle();

  if(existing){

    alert("Une relation existe déjà.");
    return;
  }

  const {error} =
    await supabaseClient
      .from("friendships")
      .insert({
        user_id:currentUser.id,
        friend_id:userId,
        status:"pending"
      });

  if(error){

    alert(error.message);
    return;
  }

  alert("Demande envoyée.");
}

    document.getElementById("messageInput");

  const content =
    input.value.trim();

  if(!content) return;

  const {error} =
    await supabaseClient
      .from("messages")
      .insert({
        sender_id:currentUser.id,
        receiver_id:selectedConversationUser,
        content
      });

  if(error){

    alert(error.message);
    return;
  }

  input.value = "";

  await loadConversation();
}

/* ==========================================================
   PROFILE PAGE
   ========================================================== */

  await loadProfile();

  const page =
    document.getElementById("page");

  page.innerHTML = `

    <div
      class="card"
      style="padding:0;overflow:hidden"
    >

      <div class="cover"></div>

      <div class="profile-avatar-wrap">

        ${
          currentProfile?.avatar_url

          ? `
            <img
              id="profileAvatar"
              class="profile-avatar"
              src="${escapeHTML(
                currentProfile.avatar_url
              )}"
            >
          `

          : `
            <div
              id="profileAvatar"
              class="profile-avatar"
              style="
                display:grid;
                place-items:center;
                font-size:28px;
                font-weight:900;
              "
            >
              ${escapeHTML(
                initials(
                  currentProfile?.full_name
                )
              )}
            </div>
          `
        }

        <label class="camera">

          📷

          <input
            id="avatarInput"
            type="file"
            accept="image/*"
            hidden
          >

        </label>

      </div>

      <div class="profile-content">

        <h1>
          ${escapeHTML(
            currentProfile?.full_name ||
            "Utilisateur"
          )}
        </h1>

        <div class="profile-meta">

          📍
          ${escapeHTML(
            currentProfile?.city ||
            "Guinée"
          )}

        </div>

        ${
          currentProfile?.bio
          ? `
            <p>
              ${escapeHTML(currentProfile.bio)}
            </p>
          `
          : ""
        }

        <div class="profile-buttons">

          <button onclick="editProfile()">
            ✏️ Modifier le profil
          </button>

          <button onclick="openPublishModal()">
            ＋ Publier
          </button>

        </div>

      </div>

    </div>

    <h1 class="page-title">
      Mes publications
    </h1>

    <div id="myPosts">
      <div class="card empty">
        Chargement...
      </div>
    </div>
  `;

  document.getElementById("avatarInput")

/* ==========================================================
   AVATAR
   ========================================================== */

async function uploadAvatar(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    alert("Choisissez une image.");
    return;
  }

  try{

    const url =
      await uploadFile(
        file,
        "avatars",
        "avatar"
      );

    const {error} =
      await supabaseClient
        .from("profiles")
        .update({
          avatar_url:url
        })
        .eq("id",currentUser.id);

    if(error) throw error;

    await loadProfile();
    await loadProfilePage();

  }catch(error){

    alert(
      "Photo impossible : " +
      error.message
    );
  }
}

/* ==========================================================
   EDIT PROFILE
   ========================================================== */

function editProfile(){

  openModal(
    "Modifier mon profil",
    `

      <form onsubmit="saveProfile(event)">

        <div class="field">

          <label>Nom complet</label>

          <input
            id="editName"
            value="${escapeHTML(
              currentProfile?.full_name || ""
            )}"
            required
          >

        </div>

        <div class="field">

          <label>Ville</label>

          <input
            id="editCity"
            value="${escapeHTML(
              currentProfile?.city || ""
            )}"
            required
          >

        </div>

        <div class="field">

          <label>Biographie</label>

          <textarea
            id="editBio"
            rows="4"
          >${escapeHTML(
            currentProfile?.bio || ""
          )}</textarea>

        </div>

        <button class="primary">
          Enregistrer
        </button>

      </form>
    `
  );
}

async function saveProfile(event){

  event.preventDefault();

  const full_name =
    document.getElementById("editName")
      .value.trim();

  const city =
    document.getElementById("editCity")
      .value.trim();

  const bio =
    document.getElementById("editBio")
      .value.trim();

  const {error} =
    await supabaseClient
      .from("profiles")
      .update({
        full_name,
        city,
        bio
      })
      .eq("id",currentUser.id);

  if(error){

    alert(error.message);
    return;
  }

  closeModal();

  await loadProfile();
  await loadProfilePage();
}

/* ==========================================================
   MY POSTS
   ========================================================== */

async function loadMyPosts(){

  const container =
    document.getElementById("myPosts");

  const {data,error} =
    await supabaseClient
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          full_name,
          city,
          avatar_url
        )
      `)
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

  if(error){

    container.innerHTML =
      `<div class="card error">${escapeHTML(error.message)}</div>`;

    return;
  }

  if(!data?.length){

    container.innerHTML = `
      <div class="card empty">

        <div class="empty-icon">📝</div>

        <h2>Aucune publication</h2>

        <p>
          Tes publications apparaîtront ici.
        </p>

      </div>
    `;

    return;
  }

  container.innerHTML = "";

  for(const post of data){

    container.insertAdjacentHTML(
      "beforeend",
      await renderPost(post)
    );
  }
}

/* ==========================================================
   NOTIFICATIONS
   ========================================================== */

async function showNotifications(){

  const {data,error} =
    await supabaseClient
      .from("notifications")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false})
      .limit(30);

  if(error){

    openModal(
      "Notifications",
      `<div class="error">${escapeHTML(error.message)}</div>`
    );

    return;
  }

  openModal(
    "Notifications",

    data?.length

      ? data.map(n=>`

          <div class="card">

            🔔

            ${escapeHTML(
              n.message ||
              "Nouvelle notification"
            )}

          </div>

        `).join("")

      : `

        <div class="empty">

          <div class="empty-icon">
            🔔
          </div>

          <h2>Aucune notification</h2>

          <p>
            Tu n'as aucune notification.
          </p>

        </div>
      `
  );
}
