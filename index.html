    <div class="setting-row"><div><strong>📱 Automatique</strong><small>Suit le réglage du système</small></div><button class="switch ${theme==='system'?'on':''}" onclick="setAppTheme('system');openAccountSettings()"></button></div>
    <div class="divider"></div><strong style="font-size:.82rem">Couleur principale</strong><div class="theme-grid" style="margin-top:9px">${['mango','blue','green','red','violet'].map(c=>`<button class="theme-btn ${color===c?'active':''}" onclick="setAppColor('${c}');openAccountSettings()">${c==='mango'?'🟠 Or':c==='blue'?'🔵 Bleu':c==='green'?'🟢 Vert':c==='red'?'🔴 Rouge':'🟣 Violet'}</button>`).join('')}</div>
    <div class="divider"></div><div class="setting-row"><div><strong>🔔 Notifications</strong><small>Alertes de commandes et activité</small></div><button class="btn btn-secondary btn-sm" onclick="openNotifications()">Gérer</button></div>
    <div class="setting-row"><div><strong>🔐 Sécurité</strong><small>Mot de passe et session</small></div><button class="btn btn-secondary btn-sm" onclick="openSecuritySettings()">Ouvrir</button></div>`);
}
function setAppTheme(v){localStorage.setItem('aidaba_theme',v);applyAppTheme();toast('Thème mis à jour');}
function setAppColor(v){localStorage.setItem('aidaba_color',v);applyAppTheme();toast('Couleur mise à jour');}
function openSecuritySettings(){openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><h2>Sécurité du compte</h2><div class="setting-row"><div><strong>✉️ Email</strong><small>${esc(state.user?.email||'')}</small></div></div><div class="setting-row"><div><strong>🔑 Mot de passe</strong><small>Un email de réinitialisation peut être envoyé.</small></div><button class="btn btn-secondary btn-sm" onclick="sendPasswordReset()">Réinitialiser</button></div><div class="setting-row"><div><strong>🚪 Sessions</strong><small>Fermer la session sur cet appareil.</small></div><button class="btn btn-danger btn-sm" onclick="doLogout()">Déconnexion</button></div>`)}
async function sendPasswordReset(){const email=state.user?.email;if(!email)return;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?'Impossible d’envoyer l’email.':'Email de réinitialisation envoyé.');}
async function openFavorites(){
  if(!state.user){showAuthSheet('login');return;} const main=document.querySelector('main');
  const {data,error}=await sb.from('favorites').select('product_id').eq('user_id',state.user.id).limit(100);
  if(error){toast('Les favoris nécessitent la table favorites dans Supabase.');return;}
  const ids=(data||[]).map(x=>x.product_id).filter(Boolean); let products=[];
  if(ids.length){ const r=await sb.from('products').select('*').in('id',ids).eq('is_active',true); products=await decorateProducts(r.data||[]); }
  main.innerHTML=`<div class="section-title">❤️ Mes favoris</div><div class="grid">${products.length?products.map(productCard).join(''):'<div class="empty-state" style="grid-column:1/-1">Aucun favori pour le moment.</div>'}</div><div class="spacer-bottom"></div>`;
}
function openLoyalty(){openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><h2>⭐ Fidélité AIDABA</h2><div class="loyalty-card"><div style="font-size:.7rem;opacity:.65">MES POINTS</div><div class="loyalty-points">0 points</div><div style="font-size:.72rem;opacity:.7">Les points pourront être crédités automatiquement après les commandes validées.</div></div><div class="setting-row"><div><strong>🎁 Récompenses</strong><small>Réductions et avantages fidélité</small></div></div><div class="setting-row"><div><strong>📈 Historique</strong><small>Gagne des points avec tes achats et activités éligibles.</small></div></div>`)}
async function openWallet(){
  let total=0,paid=0; if(state.user){try{const {data}=await sb.from('payments').select('amount,status').eq('buyer_id',state.user.id);(data||[]).forEach(x=>{total+=Number(x.amount||0);if(x.status==='success'||x.status==='paid')paid+=Number(x.amount||0)})}catch(e){}}
  openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><h2>💳 Portefeuille</h2><div class="wallet-card"><div style="font-size:.7rem;opacity:.65">SOLDE AIDABA</div><div class="wallet-balance">0 GNF</div><div style="font-size:.7rem;opacity:.6">Le portefeuille sert à afficher les opérations AIDABA ; les fonds réels restent gérés par les prestataires de paiement.</div></div><div class="setting-row"><div><strong>📊 Paiements enregistrés</strong><small>${fmtGNF(total)} au total · ${fmtGNF(paid)} payés</small></div></div><div class="setting-row"><div><strong>🏦 Moyens</strong><small>Orange Money · MTN Mobile Money · Carte</small></div></div>`);
}
function openCommunities(){openModal(`<button class="sheet-close" onclick="closeModal()">✕</button><h2>👥 Mes communautés</h2><div class="empty-state" style="padding:28px 10px"><div style="font-size:2rem">👥</div><p>Les communautés permettent de regrouper acheteurs, vendeurs et marques autour de centres d'intérêt.</p><button class="btn btn-primary" onclick="toast('Fonction communauté à activer côté Supabase')">Créer une communauté</button></div>`)}

function openEditProfile(){
  const p=state.profile||{};
  openModal(`
    <button class="sheet-close" onclick="closeModal()">✕</button>
    <h2 style="margin-bottom:14px;">Modifier mon profil</h2>
    <div class="field"><label>Nom complet</label><input id="epName" maxlength="100" value="${esc(p.full_name||'')}"></div>
    <div class="field"><label>Téléphone</label><input id="epPhone" maxlength="30" value="${esc(p.phone||'')}"></div>
    <div class="field"><label>Ville</label><input id="epCity" maxlength="100" value="${esc(p.city||'')}"></div>
    <div class="field"><label>Adresse</label><textarea id="epAddress" maxlength="300">${esc(p.address||'')}</textarea></div>
    <div class="field"><label>À propos de moi</label><textarea id="epBio" maxlength="1000" placeholder="Quelques mots sur toi...">${esc(p.bio||'')}</textarea></div>
    <div class="field"><label>Email du compte</label><input value="${esc(state.user.email||'')}" disabled></div>
    <button class="btn btn-primary btn-full" onclick="saveProfile()">Enregistrer les modifications</button>
  `);
}

async function saveProfile(){
  if(!state.user)return;
  const full_name=document.getElementById('epName').value.trim();
  const phone=document.getElementById('epPhone').value.trim();
  const city=document.getElementById('epCity').value.trim();
  const address=document.getElementById('epAddress').value.trim();
  const bio=document.getElementById('epBio').value.trim();
  if(!full_name){toast('Le nom complet est requis.');return;}

  const {error}=await sb.from('profiles').update({full_name,phone,city,address,bio}).eq('id',state.user.id);
  if(error){toast('Profil non enregistré : '+error.message);return;}
  state.profile={...(state.profile||{}),full_name,phone,city,address,bio};
  closeModal();
  renderAccountView();
  toast('Profil mis à jour !');
}

async function uploadProfileAsset(input,type){
  const file=input.files?.[0];
  if(!file||!state.user)return;
  if(!file.type.startsWith('image/')){toast('Choisis une image.');return;}
  if(file.size>6*1024*1024){toast('Image trop lourde (6 Mo maximum).');return;}

  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${state.user.id}/${type}-${Date.now()}.${ext}`;

  const up=await sb.storage.from('profile-images').upload(path,file,{
    contentType:file.type,upsert:false,cacheControl:'31536000'
  });
  if(up.error){toast('Photo impossible à envoyer : '+up.error.message);return;}

  const {data:u}=sb.storage.from('profile-images').getPublicUrl(path);
  const url=u?.publicUrl;
  if(!url){toast('URL de la photo introuvable.');return;}

  const column=type==='avatar'?'avatar_url':'cover_url';
  const {error}=await sb.from('profiles').update({[column]:url}).eq('id',state.user.id);
  if(error){toast('Photo envoyée mais profil non mis à jour : '+error.message);return;}

  state.profile={...(state.profile||{}),[column]:url};
  renderAccountView();
  toast(type==='avatar'?'Photo de profil mise à jour !':'Photo de couverture mise à jour !');
}

async function updateProfilePhoto(input){ return uploadProfileAsset(input,'avatar'); }
async function updateProfileCover(input){ return uploadProfileAsset(input,'cover'); }

// ---------- VIEW ROUTING ----------
function showView(v){
  state.view = v;
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  const main = document.querySelector('main');
  const catStrip = document.getElementById('catStrip');
  if(v === 'home'){
    catStrip.style.display = 'flex';
    main.innerHTML = `<div id="recoRoot"></div><div class="section-title"><span id="gridTitle">Produits</span><button class="btn btn-secondary btn-sm" onclick="loadProducts()" style="float:right;margin-top:-4px;">↻ Actualiser</button></div><div class="grid" id="productGrid"></div><div class="spacer-bottom"></div>`;
    renderProductGrid();
    renderRecommendations();
  } else {
    catStrip.style.display = 'none';
    if(v === 'orders') renderOrdersView();
    if(v === 'sell') renderSellView();
    if(v === 'account') renderAccountView();
  }
}

function render(){ showView(state.view || 'home'); }

// ---------- SEARCH ----------
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ state.search = e.target.value.trim(); loadProducts(); }, 350);
});

// ---------- INIT ----------
// L'écran de chargement disparaît après un délai FIXE de 2,5s, indépendamment
// du réseau — l'appli ne reste jamais bloquée même si Supabase est lent ou injoignable.
// Les données (produits, catégories) continuent de charger en parallèle et
// s'affichent dès qu'elles arrivent, avec un état "chargement" dans la grille en attendant.
function hideSplash(){
  const splash = document.getElementById('splash');
  if(!splash) return;
  splash.classList.add('fade-out');
  setTimeout(() => splash.remove(), 450);
}
applyAppTheme();

(async function init(){
  // Le splash ne dépend plus d'une requête réseau et ne peut donc pas rester bloqué.
  const splashTimer = setTimeout(hideSplash, 3500);
  try{
    await getSupabase();

    // Le marché est partagé entre tous les appareils.
    // On s'abonne AVANT l'authentification afin qu'une erreur de profil
    // ne puisse pas empêcher la synchronisation des produits.
    subscribeToMarketplaceRealtime();
  }catch(e){
    console.error('Supabase:', e);
    hideSplash();
    toast('Impossible de charger Supabase. Vérifie ta connexion Internet.');
    state.products = [];
    renderProductGrid();
    return;
  }

  try{ await initAuth(); }
  catch(e){ console.error('Auth error:', e); }

  // Réabonnement après l'authentification + relecture immédiate.
  try{
    subscribeToMarketplaceRealtime();
    await loadProducts();
  }catch(e){ console.error('Marketplace sync:', e); }

  try{ await withTimeout(loadCategories(),8000,'Le chargement des catégories'); }
  catch(e){ console.error('Categories error:',e); state.categories=[]; renderCategoryStrip(); }

  try{ await withTimeout(loadProducts(),10000,'Le chargement des produits'); }
  catch(e){ console.error('Products error:',e); state.products=[]; renderProductGrid(); toast('Impossible de charger les produits.'); }

  try{ await withTimeout(renderRecommendations(),10000,'Les recommandations'); }
  catch(e){ console.error('Recommendations error:',e); }

  clearTimeout(splashTimer);
  hideSplash();
})();

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && sb){
    if(state.view==='home') loadProducts().catch(()=>{});
    if(state.user) loadNotifications().catch(()=>{});
  }
});

window.addEventListener('error', e => {
  console.error('Erreur JavaScript:', e.error || e.message);
  hideSplash();
});
window.addEventListener('unhandledrejection', e => console.error('Promesse non gérée:', e.reason));
</script>
