<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b63ce">
  <title>Guinée Actualité 🇬🇳</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --blue:#0b63ce;
      --blue2:#0751aa;
      --bg:#f3f6fa;
      --card:#fff;
      --text:#172033;
      --muted:#687386;
      --line:#e4e8ef;
      --danger:#d92d20;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
    }

    button,input,textarea,select{font:inherit}

    button{
      cursor:pointer;
      border:0;
      transition:background 0.2s
    }

    img,video{
      max-width:100%
    }

    .hidden{
      display:none!important
    }

    .center{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px
    }

    .welcome{
      min-height:100vh;
      display:grid;
      place-content:center;
      text-align:center;
      padding:24px;
      max-width:620px;
      margin:auto
    }

    .logo{
      width:76px;
      height:76px;
      border-radius:24px;
      background:var(--blue);
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:28px;
      margin:0 auto 16px
    }

    .logo.sm{
      width:52px;
      height:52px;
      border-radius:16px;
      font-size:19px
    }

    h1,h2,h3{
      margin:0 0 10px
    }

    .muted,small{
      color:var(--muted)
    }

    .tag{
      font-size:19px
    }

    .features{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      margin:24px 0
    }

    .features span{
      background:#eaf2ff;
      padding:9px 12px;
      border-radius:999px
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      box-shadow:0 3px 14px #0b1f3a0b;
      margin-bottom:12px
    }

    .auth{
      width:min(440px,100%)
    }

    form{
      display:grid;
      gap:12px
    }

    label{
      display:grid;
      gap:6px;
      font-weight:650;
      text-align:left
    }

    input,textarea,select{
      width:100%;
      border:1px solid #ccd4df;
      border-radius:12px;
      padding:12px;
      background:#fff;
      outline:none;
      font-size:14px
    }

    input:focus,
    textarea:focus,
    select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px #0b63ce18
    }

    .primary,
    .secondary,
    .danger,
    .link{
      padding:11px 15px;
      border-radius:12px;
      font-weight:750
    }

    .primary{
      background:var(--blue);
      color:#fff
    }

    .primary:hover{
      background:var(--blue2)
    }

    .primary:disabled{
      opacity:0.6;
      cursor:not-allowed
    }

    .secondary{
      background:#eaf2ff;
      color:var(--blue)
    }

    .secondary:hover{
      background:#d4e4ff
    }

    .danger{
      background:#fff0ee;
      color:var(--danger)
    }

    .link{
      background:transparent;
      color:var(--blue);
      padding:6px
    }

    .link:hover{
      text-decoration:underline
    }

    .wide{
      width:100%;
      margin-top:8px
    }

    .small{
      padding:8px 11px;
      font-size:14px
    }

    .shell{
      min-height:100vh;
      padding-bottom:78px
    }

    .top{
      position:sticky;
      top:0;
      z-index:10;
      background:#ffffffee;
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px max(14px,calc((100vw - 900px)/2));
    }

    .brand{
      background:transparent;
      font-weight:900;
      font-size:20px;
      color:var(--blue)
    }

    .brand span{
      color:var(--text)
    }

    .top-right{
      display:flex;
      gap:8px;
      align-items:center
    }

    .icon{
      background:#eef3f9;
      border-radius:12px;
      padding:9px;
      position:relative;
      cursor:pointer
    }

    .icon:hover{
      background:#dce9fb
    }

    .badge{
      position:absolute;
      right:-3px;
      top:-5px;
      background:#e5484d;
      color:#fff;
      font-size:10px;
      border-radius:99px;
      padding:2px 5px;
      font-weight:bold
    }

    main{
      width:min(900px,100%);
      margin:0 auto;
      padding:14px
    }

    .composer{
      display:flex;
      gap:10px;
      align-items:flex-start;
      margin-bottom:16px
    }

    .composer textarea{
      flex:1
    }

    .composer button{
      background:var(--blue);
      color:#fff;
      padding:12px 20px;
      border-radius:12px;
      font-weight:600;
      align-self:flex-end;
      white-space:nowrap
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#dce9fb;
      color:var(--blue);
      display:grid;
      place-items:center;
      font-weight:850;
      overflow:hidden;
      flex:0 0 auto;
      font-size:18px
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .avatar.sm{
      width:34px;
      height:34px
    }

    .avatar.lg{
      width:92px;
      height:92px;
      font-size:30px;
      margin:auto
    }

    .head,
    .person,
    .row{
      display:flex;
      align-items:center;
      gap:10px
    }

    .head>div:nth-child(2),
    .person>div{
      display:grid
    }

    .head small{
      display:block;
      font-size:12px
    }

    .post{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-bottom:12px
    }

    .post p{
      white-space:pre-wrap;
      line-height:1.5;
      margin:8px 0 0
    }

    .media{
      display:block;
      width:100%;
      max-height:560px;
      object-fit:cover;
      border-radius:12px;
      margin-top:10px;
      background:#111
    }

    .actions{
      display:flex;
      gap:6px;
      border-top:1px solid var(--line);
      margin-top:12px;
      padding-top:10px;
      flex-wrap:wrap
    }

    .actions button{
      background:#f4f6f9;
      padding:6px 10px;
      border-radius:8px;
      font-size:13px;
      color:var(--muted)
    }

    .actions button:hover{
      background:#e8ecf1
    }

    .title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:8px 0 12px
    }

    .empty{
      text-align:center;
      padding:35px 18px;
      color:var(--muted)
    }

    .error{
      background:#fff0ee;
      border:1px solid #ffdbce;
      padding:12px;
      border-radius:12px;
      color:var(--danger)
    }

    .success{
      background:#ecfdf5;
      border:1px solid #d1fae5;
      padding:12px;
      border-radius:12px;
      color:#065f46
    }

    .people{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:10px
    }

    .person{
      padding:12px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      display:flex;
      align-items:center;
      gap:10px
    }

    .person button{
      margin-left:auto
    }

    .tabs{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#fff;
      border-top:1px solid var(--line);
      z-index:20;
      display:flex;
      justify-content:center
    }

    .tabs button{
      background:transparent;
      color:var(--muted);
      padding:9px 10px;
      min-width:68px;
      font-size:12px
    }

    .tabs button.active{
      color:var(--blue);
      font-weight:800
    }

    .tabs small{
      display:block;
      font-size:11px;
      margin-top:2px
    }

    .spinner{
      display:inline-block;
      width:20px;
      height:20px;
      border:3px solid #eee;
      border-top-color:var(--blue);
      border-radius:50%;
      animation:spin 0.8s linear infinite
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    @media(min-width:760px){
      .tabs{
        position:sticky;
        bottom:0;
        width:min(900px,100%);
        margin:auto;
        border:1px solid var(--line);
        border-radius:16px 16px 0 0
      }

      .shell{
        padding-bottom:0
      }
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

const SUPABASE_URL = "https://llmftxuasvysawaazedm.supabase.co";
const SUPABASE_KEY = "sb_publishable_fzGII8rJsleL-jGQb491Ag_0jMkE_46";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");

let user = null;
let profile = null;
let tab = "home";

/* ========================= UTILITAIRES ========================= */

const esc = s =>
  String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));

const initials = p => (p?.full_name || "U").trim().charAt(0).toUpperCase();

const avatar = p =>
  p?.avatar_url
    ? `<div class="avatar"><img src="${esc(p.avatar_url)}" alt=""></div>`
    : `<div class="avatar">${esc(initials(p))}</div>`;

const fmt = d => new Date(d).toLocaleString("fr-FR", {
  dateStyle:"short", timeStyle:"short"
});

const msg = (e, type = "error") => {
  const el = document.getElementById("msg");
  if(el){
    el.className = type;
    el.textContent = e?.message || String(e);
  }
};

/* ========================= INITIALISATION ========================= */

async function init(){
  try{
    const { data, error } = await sb.auth.getSession();
    if(error) throw error;

    if(data.session){
      user = data.session.user;
      await loadProfile();
      shell();
      await go("home");
    }else{
      welcome();
    }
  }catch(e){
    console.error("Erreur d'initialisation:", e);
    welcome();
  }

  // Écouter les changements de session
  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === "SIGNED_OUT"){
      user = null;
      profile = null;
      welcome();
    }else if(event === "SIGNED_IN" && session){
      user = session.user;
      await loadProfile();
      shell();
      await go("home");
    }
  });
}

/* ========================= PAGE D'ACCUEIL ========================= */

function welcome(){
  app.innerHTML = `
    <section class="welcome">
      <div class="logo">GA</div>
      <h1>Guinée Actualité 🇬🇳</h1>
      <p class="tag">Actualités 100% guinéennes</p>
      <p class="muted">
        Partagez les nouvelles de votre région. Aucun contenu de démonstration,
        juste l'actualité véritable de la Guinée.
      </p>
      <div class="features">
        <span>📰 Actualités</span>
        <span>👥 Amis</span>
        <span>💬 Messages</span>
        <span>🔔 Notifications</span>
      </div>
      <button class="primary wide" onclick="auth('signup')">
        Créer un compte
      </button>
      <button class="secondary wide" onclick="auth('login')">
        Se connecter
      </button>
    </section>
  `;
}

/* ========================= AUTHENTIFICATION ========================= */

function auth(mode){
  app.innerHTML = `
    <section class="center">
      <div class="card auth">
        <div class="logo sm">GA</div>
        <h2>${mode === "login" ? "Se connecter" : "Créer mon compte"}</h2>
        <form id="authForm">
          ${
            mode === "signup"
              ? `
                <label>
                  Nom complet
                  <input id="name" required maxlength="100">
                </label>
                <label>
                  Ville
                  <input id="city" required placeholder="Conakry">
                </label>
              `
              : ""
          }
          <label>
            Email
            <input id="email" type="email" required>
          </label>
          <label>
            Mot de passe
            <input id="pass" type="password" minlength="6" required>
          </label>
          <button type="submit" class="primary wide">
            ${mode === "login" ? "Se connecter" : "Créer le compte"}
          </button>
        </form>
        <p id="msg" class="muted"></p>
        <button class="link" onclick="auth('${
          mode === "login" ? "signup" : "login"
        }')">
          ${mode === "login" ? "Créer un compte" : "J'ai déjà un compte"}
        </button>
        <button class="link" onclick="welcome()">← Retour</button>
      </div>
    </section>
  `;

  document.getElementById("authForm").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try{
      msg("Patiente...", "muted");

      if(mode === "login"){
        const { error } = await sb.auth.signInWithPassword({
          email: document.getElementById("email").value,
          password: document.getElementById("pass").value
        });
        if(error) throw error;
      }else{
        const { error } = await sb.auth.signUp({
          email: document.getElementById("email").value,
          password: document.getElementById("pass").value,
          options:{
            data:{
              full_name: document.getElementById("name").value,
              city: document.getElementById("city").value
            }
          }
        });
        if(error) throw error;
        msg("Compte créé! Vérifie ton email pour confirmer.", "success");
        setTimeout(() => auth("login"), 2000);
      }
    }catch(e){
      msg(e, "error");
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };
}

/* ========================= PROFIL ========================= */

async function loadProfile(){
  try{
    const { data, error } = await sb
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if(error) throw error;

    profile = data || {
      id: user.id,
      full_name: user.email?.split("@")[0] || "Utilisateur",
      city: "Guinée",
      avatar_url: null
    };
  }catch(e){
    console.error("Erreur chargement profil:", e);
    profile = {
      id: user.id,
      full_name: user.email?.split("@")[0] || "Utilisateur",
      city: "Guinée"
    };
  }
}

async function profilePage(){
  const v = document.getElementById("view");
  v.innerHTML = `
    <div class="card">
      <div style="text-align:center;padding:20px">
        ${avatar({...profile, full_name: profile?.full_name?.charAt(0)})}
        <h2>${esc(profile?.full_name || "Utilisateur")}</h2>
        <p class="muted">${esc(profile?.city || "Guinée")}</p>
        <p class="muted">Email: ${esc(user?.email || "")}</p>
        <button class="primary wide" onclick="logout()" style="margin-top:20px">
          Se déconnecter
        </button>
      </div>
    </div>
  `;
}

async function logout(){
  try{
    await sb.auth.signOut();
  }catch(e){
    console.error("Erreur déconnexion:", e);
  }
}

/* ========================= NOTIFICATIONS ========================= */

async function counts(){
  try{
    const { count } = await sb
      .from("notifications")
      .select("id", { count: "exact", head: true })
      .eq("user_id", user.id)
      .eq("read", false);
    return count || 0;
  }catch(e){
    console.error("Erreur notifications:", e);
    return 0;
  }
}

async function updateBadge(){
  try{
    const c = await counts();
    const badge = document.getElementById("badge");
    if(badge){
      if(c > 0){
        badge.textContent = c;
        badge.classList.remove("hidden");
      }else{
        badge.classList.add("hidden");
      }
    }
  }catch(e){
    console.error("Erreur badge:", e);
  }
}

async function notifications(){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty">Pas de notifications pour le moment</div>`;
}

/* ========================= POSTS (Actualités) ========================= */

async function home(){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty"><div class="spinner"></div></div>`;

  try{
    const { data: posts, error } = await sb
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(20);

    if(error) throw error;

    if(!posts || posts.length === 0){
      v.innerHTML = `
        <div class="composer">
          <textarea placeholder="Qu'est-ce qui se passe en Guinée?" rows="3"></textarea>
          <button onclick="alert('Partager un post - à implémenter')">Partager</button>
        </div>
        <div class="empty">Aucune actualité pour le moment. Sois le premier à partager!</div>
      `;
      return;
    }

    v.innerHTML = `
      <div class="composer">
        <textarea placeholder="Qu'est-ce qui se passe en Guinée?" rows="3"></textarea>
        <button onclick="alert('Partager un post - à implémenter')">Partager</button>
      </div>
      ${posts.map(post => `
        <div class="post">
          <div class="head">
            <div class="avatar sm">
              ${post.author_name?.charAt(0).toUpperCase() || "U"}
            </div>
            <div>
              <strong>${esc(post.author_name || "Anonyme")}</strong>
              <small>${fmt(post.created_at)}</small>
            </div>
          </div>
          <p>${esc(post.content)}</p>
          ${post.image_url ? `<img src="${esc(post.image_url)}" class="media">` : ""}
          <div class="actions">
            <button>👍 ${post.likes || 0}</button>
            <button>💬 ${post.comments || 0}</button>
            <button>↗️ Partager</button>
          </div>
        </div>
      `).join("")}
    `;
  }catch(e){
    v.innerHTML = `<div class="error">Erreur: ${esc(e.message)}</div>`;
  }
}

async function shorts(){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty">📹 Shorts (vidéos courtes) - à implémenter</div>`;
}

/* ========================= AMIS ========================= */

async function friends(){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty">👥 Gérer les amis - à implémenter</div>`;
}

/* ========================= MESSAGES ========================= */

async function messages(){
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty">💬 Messages - à implémenter</div>`;
}

/* ========================= INTERFACE PRINCIPALE ========================= */

function shell(){
  app.innerHTML = `
    <div class="shell">
      <header class="top">
        <button class="brand" onclick="go('home')">
          🇬🇳 <span>Guinée Actualité</span>
        </button>
        <div class="top-right">
          <button class="icon" onclick="go('notifications')">
            🔔
            <span id="badge" class="badge hidden"></span>
          </button>
          ${avatar(profile)}
        </div>
      </header>

      <main id="view"></main>

      <nav class="tabs">
        <button id="tab-home" onclick="go('home')">
          📰
          <small>Actualités</small>
        </button>
        <button id="tab-friends" onclick="go('friends')">
          👥
          <small>Amis</small>
        </button>
        <button id="tab-messages" onclick="go('messages')">
          💬
          <small>Messages</small>
        </button>
        <button id="tab-profile" onclick="go('profile')">
          👤
          <small>Profil</small>
        </button>
      </nav>
    </div>
  `;

  updateBadge();
}

/* ========================= NAVIGATION ========================= */

async function go(t){
  tab = t;

  document.querySelectorAll(".tabs button").forEach(b => 
    b.classList.remove("active")
  );

  document.getElementById("tab-" + t)?.classList.add("active");

  const v = document.getElementById("view");
  if(!v) return;

  try{
    if(t === "home") await home();
    else if(t === "shorts") await shorts();
    else if(t === "friends") await friends();
    else if(t === "messages") await messages();
    else if(t === "profile") await profilePage();
    else if(t === "notifications") await notifications();
  }catch(e){
    v.innerHTML = `<div class="error">Erreur: ${esc(e.message)}</div>`;
  }
}

// Démarrer l'application
init();

</script>

</body>
</html>
