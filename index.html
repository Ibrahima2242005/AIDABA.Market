<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#f5f7fb">

<title>Guinée Sociale 🇬🇳</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#1877f2;
  --blue2:#0866ff;
  --bg:#f2f4f8;
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.88);
  --border:rgba(255,255,255,.65);
  --line:rgba(0,0,0,.08);
  --text:#101114;
  --muted:#68707c;
  --danger:#e5484d;
  --green:#20b26b;
  --shadow:0 10px 35px rgba(20,30,50,.10);
  --nav:64px;
  --bottom:72px;
  --radius:22px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Plus Jakarta Sans",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(24,119,242,.10),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(120,80,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:calc(var(--bottom) + 15px);
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img,
video{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* =========================================================
   GLASS
========================================================= */

.glass{
  background:var(--glass);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
}

/* =========================================================
   AUTH
========================================================= */

#auth-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 10%,rgba(24,119,242,.30),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(100,60,255,.25),transparent 30%),
    #08090b;
}

.auth-card{
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:30px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
  backdrop-filter:blur(30px);
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.brand-logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
  color:var(--blue);
}

.brand p{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.auth-tabs{
  display:flex;
  gap:5px;
  padding:4px;
  border-radius:16px;
  background:#edf0f5;
  margin-bottom:20px;
}

.auth-tab{
  flex:1;
  border:0;
  background:transparent;
  padding:11px;
  border-radius:12px;
  font-weight:700;
  color:var(--muted);
}

.auth-tab.active{
  background:white;
  color:var(--text);
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:7px;
  letter-spacing:.5px;
}

.field input{
  width:100%;
  border:1px solid var(--line);
  background:rgba(245,247,250,.9);
  padding:14px 15px;
  border-radius:15px;
  outline:none;
}

.field input:focus,
.comment-input:focus,
.search-input:focus,
.post-textarea:focus{
  border-color:rgba(24,119,242,.5);
  box-shadow:0 0 0 4px rgba(24,119,242,.08);
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#1877f2,#0866ff);
  color:white;
  padding:14px;
  font-weight:800;
  box-shadow:0 8px 22px rgba(24,119,242,.25);
}

/* =========================================================
   APP
========================================================= */

#app{
  display:none;
}

.navbar{
  height:var(--nav);
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(255,255,255,.72);
  border-bottom:1px solid rgba(0,0,0,.06);
  backdrop-filter:blur(28px) saturate(170%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
}

.nav-brand{
  color:var(--blue);
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.nav-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:50%;
  background:rgba(245,247,250,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:
    calc(var(--nav) + 14px)
    12px
    calc(var(--bottom) + 20px);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  font-size:22px;
  font-weight:900;
  margin:5px 3px 15px;
}

/* =========================================================
   STORIES
========================================================= */

.stories-wrap{
  overflow-x:auto;
  scrollbar-width:none;
  display:flex;
  gap:10px;
  padding:4px 1px 14px;
}

.stories-wrap::-webkit-scrollbar{
  display:none;
}

.story-card{
  flex:0 0 112px;
  height:170px;
  border-radius:19px;
  overflow:hidden;
  position:relative;
  background:#dfe4ec;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  cursor:pointer;
}

.story-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 40%,
    rgba(0,0,0,.72)
  );
}

.story-user{
  position:absolute;
  z-index:2;
  left:9px;
  right:8px;
  bottom:9px;
  color:white;
  font-size:12px;
  font-weight:800;
}

.story-avatar-small{
  width:31px;
  height:31px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
  margin-bottom:4px;
}

.add-story{
  background:var(--glass-strong);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
}

.add-story-photo{
  height:105px;
  width:100%;
  object-fit:cover;
  background:#e8ebf1;
}

.add-story-plus{
  width:38px;
  height:38px;
  margin-top:-18px;
  z-index:3;
  border-radius:50%;
  border:4px solid white;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
}

.add-story-label{
  font-size:12px;
  font-weight:800;
  margin:7px 0 11px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
  border-radius:22px;
  padding:14px;
  margin-bottom:13px;
}

.composer-top{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  background:#1877f2;
  color:white;
  object-fit:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.composer-trigger{
  flex:1;
  border:0;
  border-radius:20px;
  background:rgba(235,238,243,.85);
  padding:12px 16px;
  color:var(--muted);
  text-align:left;
}

.composer-actions{
  border-top:1px solid var(--line);
  margin-top:12px;
  padding-top:9px;
  display:flex;
}

.composer-action{
  flex:1;
  border:0;
  background:transparent;
  padding:9px 3px;
  border-radius:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.composer-action:hover{
  background:rgba(0,0,0,.04);
}

/* =========================================================
   POST
========================================================= */

.post{
  border-radius:22px;
  margin-bottom:14px;
  overflow:hidden;
}

.post-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 15px 11px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-name{
  font-size:13px;
  font-weight:900;
}

.post-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.more-btn{
  border:0;
  background:rgba(0,0,0,.05);
  width:34px;
  height:34px;
  border-radius:50%;
}

.post-text{
  padding:0 15px 13px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
}

.feed-video{
  width:100%;
  max-height:600px;
  display:block;
  background:#000;
  object-fit:cover;
  cursor:pointer;
}

.post-image{
  width:100%;
  max-height:650px;
  display:block;
  object-fit:cover;
  background:#111;
}

.video-no-controls::-webkit-media-controls{
  display:none!important;
}

.post-stats{
  display:flex;
  justify-content:space-between;
  padding:10px 15px;
  color:var(--muted);
  font-size:11px;
  border-bottom:1px solid var(--line);
}

.post-actions{
  display:flex;
  padding:5px 8px;
}

.post-action{
  flex:1;
  border:0;
  background:transparent;
  padding:10px 3px;
  border-radius:11px;
  color:var(--muted);
  font-weight:800;
  font-size:12px;
}

.post-action.active{
  color:var(--blue);
  background:rgba(24,119,242,.07);
}

.comments{
  display:none;
  padding:10px 14px 14px;
  background:rgba(245,247,250,.75);
}

.comments.open{
  display:block;
}

.comment{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.comment-bubble{
  background:#e7eaf0;
  border-radius:14px;
  padding:8px 11px;
  font-size:12px;
}

.comment-author{
  font-weight:900;
  margin-bottom:2px;
}

.comment-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  border-radius:20px;
  padding:10px 13px;
  outline:none;
  background:white;
  font-size:12px;
}

.comment-send{
  border:0;
  border-radius:20px;
  padding:0 13px;
  color:white;
  background:var(--blue);
  font-weight:800;
}

/* =========================================================
   SHORTS
========================================================= */

.shorts-page{
  margin-left:-12px;
  margin-right:-12px;
}

.shorts-feed{
  width:100%;
}

.short{
  height:calc(100svh - var(--nav));
  min-height:550px;
  position:relative;
  overflow:hidden;
  background:#000;
  scroll-snap-align:start;
  margin-bottom:2px;
}

.shorts-feed{
  scroll-snap-type:y mandatory;
}

.short video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.short-gradient{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      transparent 45%,
      rgba(0,0,0,.72)
    );
}

.short-info{
  position:absolute;
  left:16px;
  right:75px;
  bottom:28px;
  color:white;
  z-index:3;
}

.short-author{
  font-size:15px;
  font-weight:900;
}

.short-caption{
  margin-top:7px;
  font-size:13px;
  line-height:1.4;
}

.short-side{
  position:absolute;
  right:13px;
  bottom:27px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.short-side button{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.4);
  color:white;
  backdrop-filter:blur(15px);
  font-size:18px;
}

.short-side small{
  display:block;
  font-size:9px;
  margin-top:-10px;
  text-align:center;
  color:white;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-cover{
  height:220px;
  border-radius:25px;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(135deg,#1877f2,#6d4aff);
}

.profile-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cover-edit{
  position:absolute;
  right:12px;
  bottom:12px;
  border:0;
  padding:9px 12px;
  border-radius:13px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:11px;
  font-weight:800;
  backdrop-filter:blur(15px);
}

.profile-info{
  margin-top:-42px;
  position:relative;
  z-index:2;
  padding:0 15px 18px;
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  border:5px solid white;
  background:var(--blue);
  object-fit:cover;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
}

.profile-name{
  font-size:21px;
  font-weight:900;
  margin-top:7px;
}

.profile-username{
  color:var(--muted);
  font-size:12px;
}

.profile-bio{
  margin-top:8px;
  font-size:13px;
  line-height:1.45;
}

.profile-stats{
  display:flex;
  gap:25px;
  margin-top:13px;
}

.profile-stat strong{
  display:block;
  font-size:17px;
}

.profile-stat span{
  color:var(--muted);
  font-size:10px;
}

/* =========================================================
   PEOPLE
========================================================= */

.search-box{
  margin-bottom:14px;
}

.search-input{
  width:100%;
  border:1px solid var(--line);
  background:var(--glass);
  border-radius:18px;
  padding:13px 15px;
  outline:none;
}

.person{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border-bottom:1px solid var(--line);
}

.person-info{
  flex:1;
}

.person-name{
  font-weight:900;
  font-size:13px;
}

.person-username{
  color:var(--muted);
  font-size:11px;
}

.person-btn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:12px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

.notification{
  display:flex;
  gap:10px;
  padding:13px;
  border-bottom:1px solid var(--line);
}

.notification.unread{
  background:rgba(24,119,242,.06);
}

.notification-text{
  font-size:12px;
  line-height:1.4;
}

.notification-time{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* =========================================================
   MESSAGES
========================================================= */

.message-list{
  margin-bottom:15px;
}

.message{
  display:flex;
  margin-bottom:8px;
}

.message.mine{
  justify-content:flex-end;
}

.message-bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  font-size:12px;
}

.message.mine .message-bubble{
  color:white;
  background:var(--blue);
  border-bottom-right-radius:5px;
}

.message:not(.mine) .message-bubble{
  background:#e6e9ef;
  border-bottom-left-radius:5px;
}

.message-form{
  display:flex;
  gap:7px;
  position:sticky;
  bottom:80px;
}

.message-input{
  flex:1;
  border:1px solid var(--line);
  border-radius:20px;
  padding:11px 14px;
  outline:none;
}

.message-send{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:var(--blue);
  color:white;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  height:var(--bottom);
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:2000;
  display:flex;
  background:rgba(255,255,255,.78);
  border-top:1px solid rgba(0,0,0,.06);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
}

.nav-item{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav-icon{
  font-size:19px;
}

.nav-label{
  font-size:9px;
  font-weight:800;
}

.nav-item.active{
  color:var(--blue);
}

/* =========================================================
   MODALS
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:8000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:90svh;
  overflow:auto;
  background:rgba(255,255,255,.93);
  border-radius:28px 28px 0 0;
  padding:18px;
  box-shadow:0 -20px 60px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-title{
  font-size:18px;
  font-weight:900;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#eef0f4;
}

.post-textarea{
  width:100%;
  min-height:130px;
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  resize:none;
  outline:none;
  background:#f7f8fa;
}

.upload{
  margin:12px 0;
  border:2px dashed #c9ced8;
  border-radius:18px;
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.upload input{
  display:none;
}

/* =========================================================
   STORY VIEWER
========================================================= */

.story-viewer{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
}

.story-viewer.open{
  display:flex;
}

.story-view-media{
  width:100%;
  height:100%;
  object-fit:contain;
}

.story-top{
  position:absolute;
  top:15px;
  left:12px;
  right:12px;
  z-index:3;
  color:white;
}

.story-progress{
  height:3px;
  background:rgba(255,255,255,.3);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.story-progress-inner{
  height:100%;
  width:0;
  background:white;
}

.story-view-user{
  display:flex;
  align-items:center;
  gap:8px;
}

.story-view-user img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.story-view-user strong{
  font-size:12px;
}

.story-close{
  position:absolute;
  right:15px;
  top:40px;
  z-index:4;
  border:0;
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:white;
}

.story-nav{
  position:absolute;
  inset:0;
  display:flex;
  z-index:2;
}

.story-nav-left,
.story-nav-right{
  width:50%;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  z-index:11000;
  left:50%;
  bottom:88px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:rgba(20,20,22,.88);
  color:white;
  padding:11px 17px;
  border-radius:14px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  backdrop-filter:blur(15px);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   EMPTY

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function initials(p){

  const first =
    p?.first_name?.trim()?.[0] || "";

  const last =
    p?.last_name?.trim()?.[0] || "";

  return (
    first + last ||
    p?.username?.[0] ||
    "U"
  ).toUpperCase();
}


function avatarHTML(p,className="avatar"){

  if(p?.avatar_url){

    return `
      <div class="${className}">
        <img
          src="${escapeHTML(p.avatar_url)}"
          alt="">
      </div>
    `;

  }

  return `
    <div class="${className}">
      ${escapeHTML(initials(p))}
    </div>
  `;
}


function formatDate(date){

  const d = new Date(date);

  const diff =
    Date.now() - d.getTime();

  const minutes =
    Math.floor(diff / 60000);

  if(minutes < 1) return "À l'instant";
  if(minutes < 60) return `${minutes} min`;

  const hours =
    Math.floor(minutes / 60);

  if(hours < 24) return `${hours} h`;

  const days =
    Math.floor(hours / 24);

  if(days < 7) return `${days} j`;

  return d.toLocaleDateString(
    "fr-FR",
    {
      day:"numeric",
      month:"short"
    }
  );
}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      () => el.classList.remove("show"),
      2500
    );
}


/* =========================================================
   AUTH
========================================================= */

function authTab(type){

  const login =
    document.getElementById("login-box");

  const register =
    document.getElementById("register-box");

  document
    .querySelectorAll(".auth-tab")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  if(type === "login"){

    login.classList.remove("hidden");
    register.classList.add("hidden");

    document
      .querySelectorAll(".auth-tab")[0]
      .classList.add("active");

  }else{

    login.classList.add("hidden");
    register.classList.remove("hidden");

    document
      .querySelectorAll(".auth-tab")[1]
      .classList.add("active");
  }
}


async function login(){

  const email =
    document
      .getElementById("login-email")
      .value.trim();

  const password =
    document
      .getElementById("login-password")
      .value;

  if(!email || !password){

    toast("⚠️ Remplissez les champs");
    return;
  }

  const { error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    toast("❌ " + error.message);
    return;
  }

  await boot();
}


async function register(){

  const first =
    document
      .getElementById("reg-first")
      .value.trim();

  const last =
    document
      .getElementById("reg-last")
      .value.trim();

  const username =
    document
      .getElementById("reg-username")
      .value.trim()
      .toLowerCase();

  const email =
    document
      .getElementById("reg-email")
      .value.trim();

  const password =
    document
      .getElementById("reg-password")
      .value;

  if(!first || !username || !email || !password){

    toast("⚠️ Remplissez les champs obligatoires");
    return;
  }

  const { data,error } =
    await db.auth.signUp({

      email,
      password,

      options:{
        data:{
          first_name:first,
          last_name:last,
          username
        }
      }

    });

  if(error){

    toast("❌ " + error.message);
    return;
  }

  if(data.user){

    toast(
      "✅ Compte créé. Vérifiez votre email si nécessaire."
    );
  }

  if(data.session){
    await boot();
  }
}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  const { data } =
    await db.auth.getSession();

  if(!data.session){

    document
      .getElementById("auth-screen")
      .style.display = "flex";

    return;
  }

  user = data.session.user;

  document
    .getElementById("auth-screen")
    .style.display = "none";

  document
    .getElementById("app")
    .style.display = "block";

  await loadProfile();

  await Promise.all([
    loadFeed(),
    loadStories(),
    loadNotifications(),
    loadPeople("")
  ]);

  updatePresence();
  subscribeRealtime();
}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  const { data,error } =
    await db
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(error){

    console.error(error);
    toast("❌ Impossible de charger le profil");
    return;
  }

  profile = data;

  if(!profile){

    await db
      .from("profiles")
      .insert({
        id:user.id,
        first_name:
          user.user_metadata?.first_name || "",
        last_name:
          user.user_metadata?.last_name || "",
        username:
          user.user_metadata?.username ||
          user.email?.split("@")[0],
        country:"Guinée"
      });

    const result =
      await db
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .single();

    profile = result.data;
  }

  renderProfile();
}


function renderProfile(){

  if(!profile) return;

  const avatar =
    document.getElementById("profile-avatar");

  if(profile.avatar_url){

    avatar.innerHTML =
      `<img src="${escapeHTML(profile.avatar_url)}">`;

  }else{

    avatar.textContent =
      initials(profile);
  }


  document.getElementById(
    "profile-name"
  ).textContent =
    `${profile.first_name || ""} ${profile.last_name || ""}`.trim()
    || "Utilisateur";


  document.getElementById(
    "profile-username"
  ).textContent =
    profile.username
      ? "@" + profile.username
      : "";


  document.getElementById(
    "profile-bio"
  ).textContent =
    profile.bio || "";


  const cover =
    document.getElementById("profile-cover");

  cover.src =
    profile.cover_url ||
    createCoverPlaceholder();


  document.getElementById(
    "composer-avatar"
  ).innerHTML =
    profile.avatar_url
      ? `<img src="${escapeHTML(profile.avatar_url)}">`
      : initials(profile);
}


function createCoverPlaceholder(){

  return `
    data:image/svg+xml;charset=UTF-8,
    ${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="1200"
           height="400"
           viewBox="0 0 1200 400">
        <defs>
          <linearGradient
            id="g"
            x1="0"
            y1="0"
            x2="1"
            y2="1">
            <stop offset="0" stop-color="#1877f2"/>
            <stop offset="1" stop-color="#684cff"/>
          </linearGradient>
        </defs>
        <rect width="1200" height="400" fill="url(#g)"/>
        <text
          x="600"
          y="210"
          text-anchor="middle"
          fill="white"
          font-size="44"
          font-family="Arial"
          font-weight="700">
          Ajoutez votre photo de couverture
        </text>
      </svg>
    `)}
  `;
}


async function uploadCover(event){

  const file =
    event.target.files?.[0];

  if(!file || !user) return;

  if(!file.type.startsWith("image/")){

    toast("⚠️ Choisissez une image");
    return;
  }

  const ext =
    file.name.split(".").pop();

  const path =
    `${user.id}/cover-${Date.now()}.${ext}`;

  const { error } =
    await db.storage
      .from("covers")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:file.type
        }
      );

  if(error){

    toast("❌ " + error.message);
    return;
  }

  const { data } =
    db.storage
      .from("covers")
      .getPublicUrl(path);

  await db
    .from("profiles")
    .update({
      cover_url:data.publicUrl
    })
    .eq("id",user.id);

  profile.cover_url =
    data.publicUrl;

  renderProfile();

  toast("✅ Photo de couverture mise à jour");
}

function go(page){

      p.classList.remove("active")

  document
    .getElementById("page-" + page)
    ?.classList.add("active");

  document
    .querySelectorAll(".nav-item")
    .forEach(n =>
      n.classList.remove("active")
    );

  document
    .getElementById("nav-" + page)
    ?.classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(page === "shorts"){
    renderShorts();
  }

  if(page === "profile"){
    loadMyPosts();
  }

  if(page === "messages"){
    loadMessages();
  }

  if(page === "notifications"){
    loadNotifications();
  }
}


/* =========================================================
   STORIES
========================================================= */

async function loadStories(){

  const { data,error } =
    await db
      .from("stories")
      .select(`
        *,
        profiles (
          id,
          username,
          first_name,
          last_name,
          avatar_url
        )
      `)
      .gt("expires_at",new Date().toISOString())
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);
    return;
  }

  const grouped = {};

  (data || []).forEach(story => {

    const id =
      story.user_id;

    if(!grouped[id]){

      grouped[id] = {
        user:story.profiles,
        stories:[]
      };
    }

    grouped[id].stories.push(story);
  });

  storyGroups =
    Object.values(grouped);

  renderStories();
}


function renderStories(){

  const container =
    document.getElementById("stories");

  let html = `

    <div class="story-card add-story"
         onclick="document.getElementById('story-input').click()">

      <div
        class="add-story-photo"
        style="
          background:
          linear-gradient(135deg,#1877f2,#6a4cff)">
      </div>

      <div class="add-story-plus">+</div>

      <div class="add-story-label">
        Ajouter une story
      </div>

    </div>

    <input
      id="story-input"
      type="file"
      accept="image/*,video/*"
      hidden
      onchange="uploadStory(event)">

  `;

  storyGroups.forEach((group,index) => {

    const first =
      group.stories[0];

    const avatar =
      group.user?.avatar_url || "";

    html += `

      <div
        class="story-card"
        onclick="openStoryGroup(${index})">

        ${
          first.media_type === "video"

          ?

          `<video
             src="${escapeHTML(first.media_url)}"
             muted
             playsinline>
           </video>`

          :

          `<img
             src="${escapeHTML(first.media_url)}"
             alt="">`
        }

        <div class="story-user">

          ${
            avatar
            ?
            `<img
               class="story-avatar-small"
               src="${escapeHTML(avatar)}">`
            :
            `<div
               class="story-avatar-small"
               style="
                 background:#1877f2;
                 display:flex;
                 align-items:center;
                 justify-content:center;">
               ${escapeHTML(initials(group.user))}
             </div>`
          }

          <div>
            ${
              escapeHTML(
                `${group.user?.first_name || ""}
                 ${group.user?.last_name || ""}`.trim()
                ||
                group.user?.username
                ||
                "Utilisateur"
              )
            }
          </div>

          <div style="opacity:.75">
            ${group.stories.length} story${group.stories.length > 1 ? "s" : ""}
          </div>

        </div>

    `;
  });

  container.innerHTML = html;

async function uploadStory(event){

  const file =
    event.target.files?.[0];

  if(!file || !user) return;

  const type =
    file.type.startsWith("video/")
      ? "video"
      : "image";

  if(type === "video" &&
     file.size > 100 * 1024 * 1024){

    toast("⚠️ Vidéo trop volumineuse");
    return;
  }

  const ext =
    file.name.split(".").pop();

  const path =
    `${user.id}/${Date.now()}.${ext}`;

  const { error } =
    await db.storage
      .from("stories")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );

  if(error){

    toast("❌ " + error.message);
    return;
  }

  const { data:urlData } =
    db.storage
      .from("stories")
      .getPublicUrl(path);

  const { error:insertError } =
    await db
      .from("stories")
      .insert({
        user_id:user.id,
        media_url:urlData.publicUrl,
        media_type:type,
        expires_at:
          new Date(
            Date.now() + 24*60*60*1000
          ).toISOString()
      });

  if(insertError){

    toast("❌ " + insertError.message);
    return;
  }

  await loadStories();

  toast("⭐ Story publiée");
}


/* =========================================================
   STORY VIEWER
========================================================= */

function openStoryGroup(index){

  currentStoryGroup =
    storyGroups[index];

  currentStoryIndex = 0;

  document
    .getElementById("story-viewer")
    .classList.add("open");

  showCurrentStory();
}


function closeStoryViewer(){

  clearTimeout(storyTimer);

  const video =
    document.getElementById("story-video");

  video.pause();
  video.removeAttribute("src");
  video.load();

  document
    .getElementById("story-viewer")
    .classList.remove("open");
}


async function showCurrentStory(){

  if(!currentStoryGroup) return;

  const story =
    currentStoryGroup
      .stories[currentStoryIndex];

  if(!story){

    closeStoryViewer();
    return;
  }

  const avatar =
    currentStoryGroup.user?.avatar_url;

  document.getElementById(
    "story-view-avatar"
  ).src =
    avatar || createCoverPlaceholder();

  document.getElementById(
    "story-view-name"
  ).textContent =
    `${currentStoryGroup.user?.first_name || ""}
     ${currentStoryGroup.user?.last_name || ""}`.trim()
    ||
    currentStoryGroup.user?.username
    ||
    "Utilisateur";


  const image =
    document.getElementById("story-image");

  const video =
    document.getElementById("story-video");

  image.style.display = "none";
  video.style.display = "none";

  clearTimeout(storyTimer);

  if(story.media_type === "video"){

    video.style.display = "block";

    video.src =
      story.media_url;

    video.currentTime = 0;
    video.muted = true;

    video.onloadedmetadata =
      () => {

        video.play()
          .catch(()=>{});

        const duration =
          Math.min(
            (video.duration || 5) * 1000,
            15000
          );

        startStoryProgress(duration);

        storyTimer =
          setTimeout(
            nextStory,
            duration
          );
      };

  }else{

    image.style.display = "block";

    image.src =
      story.media_url;

    startStoryProgress(5000);

    storyTimer =
      setTimeout(
        nextStory,
        5000
      );
  }

  if(story.user_id !== user.id){

    await db
      .from("story_views")
      .upsert({
        story_id:story.id,
        user_id:user.id
      },{
        onConflict:"story_id,user_id"
      });
  }
}


function startStoryProgress(duration){

  const bar =
    document.getElementById(
      "story-progress-inner"
    );

  bar.style.transition = "none";
  bar.style.width = "0%";

  requestAnimationFrame(() => {

    bar.style.transition =
      `width ${duration}ms linear`;

    bar.style.width = "100%";
  });
}


function nextStory(){

  clearTimeout(storyTimer);

  if(
    currentStoryIndex <
    currentStoryGroup.stories.length - 1
  ){

    currentStoryIndex++;
    showCurrentStory();

  }else{

    closeStoryViewer();
  }
}


function previousStory(){

  clearTimeout(storyTimer);

  if(currentStoryIndex > 0){

    currentStoryIndex--;
    showCurrentStory();

  }else{

    showCurrentStory();
  }
}

/* =========================================================
   AUTOPLAY FEED
========================================================= */

function setupFeedVideos(){

  if(feedObserver){
    feedObserver.disconnect();
  }

  feedObserver =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          const video =
            entry.target;

          if(entry.isIntersecting &&
             entry.intersectionRatio >= .60){

            document
              .querySelectorAll(".feed-video")
              .forEach(v => {

                if(v !== video){
                  v.pause();
                }

              });

            video.muted = true;

            video.play()
              .catch(()=>{});

          }else{

            video.pause();
          }

        });

      },

      {
        threshold:[0,.6,.8,1]
      }
    );


  document
    .querySelectorAll(".feed-video")
    .forEach(video => {

      feedObserver.observe(video);

      video.controls = false;

      video.addEventListener(
        "click",
        () => {

          /*
             La vidéo reste automatiquement muette
             dans le fil.
             Un clic peut activer/désactiver le son.
          */

          video.muted =
            !video.muted;

          if(video.muted){

            toast("🔇 Vidéo muette");

          }else{

            toast("🔊 Son activé");
          }
        }
      );

    });
}

async function toggleLike(postId){

  const post =
    posts.find(p => p.id === postId);

  if(!post) return;

  const already =
    (post.likes || [])
      .some(
        l => l.user_id === user.id
      );

  if(already){

    const { error } =
      await db
        .from("likes")
        .delete()
        .eq("post_id",postId)
        .eq("user_id",user.id);

    if(error){

      toast("❌ " + error.message);
      return;
    }

  }else{

    const { error } =
      await db
        .from("likes")
        .insert({
          post_id:postId,
          user_id:user.id
        });

    if(error){

      if(error.code !== "23505"){
        toast("❌ " + error.message);
      }

      return;
    }
  }

  await loadFeed();
}

  renderMessages(data || []);
}


function renderMessages(messages){

  const list =
    document.getElementById(
      "message-list"
    );

  if(!messages.length){

    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">💬</div>
        Aucun message pour le moment.
      </div>
    `;

    return;
  }

  list.innerHTML =
    messages.map(m => `

      <div
        class="message ${
          m.sender_id === user.id
            ? "mine"
            : ""
        }">

        <div class="message-bubble">
          ${escapeHTML(m.content || "")}
        </div>

      </div>

    `).join("");
}


async function sendMessage(){

  /*
    Le destinataire peut être défini plus tard
    depuis la page utilisateur.
  */

  if(!currentMessageUser){

    toast(
      "👤 Sélectionnez d'abord un utilisateur"
    );

    return;
  }

  const input =
    document.getElementById(
      "message-input"
    );

  const content =
    input.value.trim();

  if(!content) return;

  const { error } =
    await db
      .from("messages")
      .insert({
        sender_id:user.id,
        receiver_id:currentMessageUser,
        content
      });

  if(error){

    toast("❌ " + error.message);
    return;
  }

  input.value = "";

  await loadMessages();
}


/* =========================================================
   PRESENCE
========================================================= */

async function updatePresence(){

  if(!user) return;

  await db
    .from("profiles")
    .update({
      is_online:true,
      last_seen:new Date().toISOString()
    })
    .eq("id",user.id);

  window.addEventListener(
    "beforeunload",
    async () => {

      await db
        .from("profiles")
        .update({
          is_online:false,
          last_seen:new Date().toISOString()
        })
        .eq("id",user.id);

    }
  );
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  db.channel("guinee-social-live")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      async () => {

        await loadFeed();

        if(
          document
            .getElementById("page-shorts")
            .classList.contains("active")
        ){

          renderShorts();
        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"likes"
      },
      async () => {

        await loadFeed();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"comments"
      },
      async () => {

        await loadFeed();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"stories"
      },
      async () => {

        await loadStories();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"notifications"
      },
      async () => {

        await loadNotifications();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },
      async payload => {

        if(
          payload.new?.sender_id === user.id ||
          payload.new?.receiver_id === user.id
        ){

          await loadMessages();
        }

      }
    )

    .subscribe();
}


/* =========================================================
   SESSION
========================================================= */

db.auth.onAuthStateChange(
  async (event,session) => {

    if(session){

      user = session.user;

      if(
        event === "SIGNED_IN"
      ){

        await boot();
      }

    }else{

      user = null;
      profile = null;

      document
        .getElementById("app")
        .style.display = "none";

      document
        .getElementById("auth-screen")
        .style.display = "flex";
    }

  }
);


/* =========================================================
   START
========================================================= */

boot();

</script>
