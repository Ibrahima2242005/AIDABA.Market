<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Guinée Sociale 🇬🇳</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GUINÉE SOCIALE
   iOS 26 / LIQUID GLASS
========================================================= */

:root {
  --blue: #1877f2;
  --blue-light: #4da3ff;

  --bg: #eef3f8;
  --glass: rgba(255,255,255,.62);
  --glass-strong: rgba(255,255,255,.78);

  --border: rgba(255,255,255,.72);
  --line: rgba(0,0,0,.07);

  --text: #080808;
  --muted: #6d7278;

  --danger: #e53935;

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 30px;

  --blur: blur(24px);
  --shadow:
    0 10px 35px rgba(0,0,0,.08);

  --nav-height: 64px;
  --bottom-height: 74px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  font-family:
    "Plus Jakarta Sans",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(24,119,242,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(100,180,255,.18),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #eef4fa,
      #e8eef5
    );

  padding-bottom:
    calc(var(--bottom-height) + 25px);

  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

img,
video {
  max-width: 100%;
}

/* =========================================================
   GLASS
========================================================= */

.glass {
  background: var(--glass);

  border: 1px solid var(--border);

  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);

  box-shadow: var(--shadow);
}

/* =========================================================
   AUTH
========================================================= */

#auth-screen {
  position: fixed;
  inset: 0;

  z-index: 5000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(24,119,242,.35),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(255,255,255,.15),
      transparent 30%
    ),
    #0a0a0b;
}

.auth-card {
  width: 100%;
  max-width: 410px;

  padding: 30px;

  border-radius: 32px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.90),
      rgba(255,255,255,.65)
    );

  border: 1px solid rgba(255,255,255,.9);

  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);

  box-shadow:
    0 30px 90px rgba(0,0,0,.35);
}

.auth-logo {
  text-align: center;
  margin-bottom: 25px;
}

.auth-logo h1 {
  color: var(--blue);

  font-size: 30px;
  font-weight: 800;

  letter-spacing: -1px;
}

.auth-logo p {
  margin-top: 5px;

  color: var(--muted);

  font-size: 13px;
}

.auth-tabs {
  display: flex;

  padding: 5px;

  margin-bottom: 20px;

  border-radius: 16px;

  background: rgba(0,0,0,.06);
}

.auth-tab {
  flex: 1;

  padding: 11px;

  border-radius: 12px;

  background: transparent;

  color: var(--muted);

  font-size: 13px;
  font-weight: 700;
}

.auth-tab.active {
  background: rgba(255,255,255,.85);

  color: #000;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;

  margin-bottom: 7px;

  color: var(--muted);

  font-size: 11px;
  font-weight: 800;

  text-transform: uppercase;
}

.field input {
  width: 100%;

  padding: 14px 16px;

  border: 1px solid rgba(0,0,0,.08);

  border-radius: 15px;

  outline: none;

  background: rgba(255,255,255,.68);

  font-size: 14px;
}

.field input:focus {
  border-color: var(--blue);

  background: rgba(255,255,255,.9);
}

.field-row {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.primary-btn {
  width: 100%;

  padding: 14px;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #1877f2,
      #3f9bff
    );

  color: white;

  font-size: 14px;
  font-weight: 800;

  box-shadow:
    0 10px 25px rgba(24,119,242,.25);
}

/* =========================================================
   APP
========================================================= */

#app {
  display: none;
}

/* =========================================================
   TOP NAV
========================================================= */

.navbar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: var(--nav-height);

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    0 max(16px, env(safe-area-inset-right))
    0 max(16px, env(safe-area-inset-left));

  background: rgba(255,255,255,.62);

  border-bottom:
    1px solid rgba(255,255,255,.75);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.nav-brand {
  color: var(--blue);

  font-size: 22px;
  font-weight: 800;

  letter-spacing: -.7px;
}

.nav-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(255,255,255,.62);

  border: 1px solid rgba(255,255,255,.8);

  box-shadow:
    0 5px 15px rgba(0,0,0,.07);

  font-size: 17px;
}

/* =========================================================
   MAIN
========================================================= */

.main-container {
  width: 100%;
  max-width: 620px;

  margin:
    calc(var(--nav-height) + 16px)
    auto
    0;

  padding: 0 12px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.page-title {
  margin-bottom: 14px;

  font-size: 20px;
  font-weight: 800;
}

/* =========================================================
   STORIES
========================================================= */

.stories-wrapper {
  display: flex;

  gap: 11px;

  overflow-x: auto;

  padding: 5px 3px 18px;

  scrollbar-width: none;
}

.stories-wrapper::-webkit-scrollbar {
  display: none;
}

.story-item {
  flex-shrink: 0;

  width: 68px;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 6px;
}

.story-ring {
  width: 68px;
  height: 68px;

  padding: 3px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #1877f2,
      #75c8ff,
      #9b6cff
    );
}

.story-ring.add-story {
  background: rgba(255,255,255,.65);
}

.story-avatar {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 3px solid white;

  border-radius: 50%;

  background: #111;

  color: white;

  font-size: 17px;
  font-weight: 800;

  object-fit: cover;
}

.story-name {
  width: 68px;

  overflow: hidden;

  text-overflow: ellipsis;
  white-space: nowrap;

  text-align: center;

  font-size: 10.5px;
  font-weight: 700;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer {
  margin-bottom: 16px;

  padding: 15px;

  border-radius: var(--radius-lg);

  background: var(--glass);

  border: 1px solid var(--border);

  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);

  box-shadow: var(--shadow);
}

.composer-top {
  display: flex;
  align-items: center;

  gap: 11px;
}

.avatar {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #1877f2,
      #5cb4ff
    );

  color: white;

  font-size: 14px;
  font-weight: 800;
}

.composer-trigger {
  flex: 1;

  padding: 13px 17px;

  border-radius: 24px;

  background: rgba(0,0,0,.055);

  color: var(--muted);

  text-align: left;

  font-size: 13px;
}

.composer-footer {
  display: flex;

  margin-top: 12px;
  padding-top: 10px;

  border-top: 1px solid var(--line);
}

.c-action {
  flex: 1;

  padding: 9px;

  border-radius: 12px;

  background: transparent;

  color: var(--muted);

  font-size: 12px;
  font-weight: 700;
}

.c-action:hover {
  background: rgba(0,0,0,.05);
}

/* =========================================================
   POSTS
========================================================= */

.post-card {
  overflow: hidden;

  margin-bottom: 16px;

  border-radius: var(--radius-lg);

  background: var(--glass);

  border: 1px solid var(--border);

  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);

  box-shadow: var(--shadow);
}

.post-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 15px;
}

.post-user {
  display: flex;
  align-items: center;

  gap: 10px;
}

.post-author {
  font-size: 13.5px;
  font-weight: 800;
}

.post-meta {
  margin-top: 2px;

  color: var(--muted);

  font-size: 10.5px;
}

.delete-btn {
  padding: 7px 10px;

  border-radius: 10px;

  background: rgba(229,57,53,.08);

  color: var(--danger);

  font-size: 11px;
  font-weight: 700;
}

.post-text {
  padding: 0 16px 14px;

  font-size: 14px;
  line-height: 1.55;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.post-media {
  width: 100%;

  max-height: 500px;

  overflow: hidden;

  background: #000;
}

.post-media img,
.post-media video {
  width: 100%;

  max-height: 500px;

  display: block;

  object-fit: cover;
}

.post-stats {
  display: flex;
  justify-content: space-between;

  padding: 10px 15px;

  color: var(--muted);

  font-size: 11.5px;

  border-bottom: 1px solid var(--line);
}

.post-actions {
  display: flex;

  padding: 5px 7px;
}

.post-action {
  flex: 1;

  padding: 10px;

  border-radius: 12px;

  background: transparent;

  color: var(--muted);

  font-size: 12.5px;
  font-weight: 700;
}

.post-action:hover {
  background: rgba(0,0,0,.05);
}

.post-action.liked {
  color: var(--blue);
}

/* =========================================================
   COMMENTS
========================================================= */

.comments {
  display: none;

  padding: 12px 15px;

  background: rgba(0,0,0,.025);

  border-top: 1px solid var(--line);
}

.comments.open {
  display: block;
}

.comment {
  display: flex;

  gap: 8px;

  margin-bottom: 10px;
}

.comment-bubble {
  padding: 8px 11px;

  border-radius: 14px;

  background: rgba(0,0,0,.055);

  font-size: 12px;
}

.comment-author {
  margin-bottom: 2px;

  font-weight: 800;
}

.comment-row {
  display: flex;

  gap: 8px;

  margin-top: 10px;
}

.comment-input {
  flex: 1;

  padding: 10px 14px;

  border: 1px solid rgba(0,0,0,.08);

  border-radius: 20px;

  outline: none;

  background: rgba(255,255,255,.7);

  font-size: 12px;
}

.comment-send {
  padding: 0 15px;

  border-radius: 20px;

  background: var(--blue);

  color: white;

  font-size: 11px;
  font-weight: 800;
}

/* =========================================================
   SHORTS
========================================================= */

.shorts-grid {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;
}

.short {
  position: relative;

  aspect-ratio: 9 / 16;

  overflow: hidden;

  border-radius: 20px;

  background: #111;

  box-shadow: var(--shadow);
}

.short video {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.short-info {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  padding: 14px;

  color: white;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.85)
    );
}

.short-author {
  font-size: 12px;
  font-weight: 800;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-card {
  text-align: center;

  padding: 25px;

  margin-bottom: 18px;
}

.profile-avatar {
  width: 82px;
  height: 82px;

  margin: 0 auto 12px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #1877f2,
      #63baff
    );

  color: white;

  font-size: 28px;
  font-weight: 800;

  box-shadow:
    0 10px 25px rgba(24,119,242,.22);
}

.profile-name {
  font-size: 19px;
  font-weight: 800;
}

.profile-email {
  margin-top: 3px;

  color: var(--muted);

  font-size: 12px;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
  position: fixed;

  left: 10px;
  right: 10px;
  bottom: max(10px, env(safe-area-inset-bottom));

  height: var(--bottom-height);

  z-index: 1500;

  display: flex;
  align-items: center;

  border-radius: 25px;

  background:
    rgba(255,255,255,.70);

  border:
    1px solid rgba(255,255,255,.9);

  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.12);
}

.nav-item {
  flex: 1;

  height: 100%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border-radius: 20px;

  background: transparent;

  color: var(--muted);
}

.nav-item.active {
  color: var(--blue);
}

.nav-icon {
  font-size: 20px;
}

.nav-label {
  font-size: 9px;
  font-weight: 700;
}

/* =========================================================
   MODAL
========================================================= */

.modal {
  position: fixed;
  inset: 0;

  z-index: 4000;

  display: none;
  align-items: flex-end;
  justify-content: center;

  padding: 12px;

  background: rgba(0,0,0,.35);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 620px;

  padding: 20px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.86);

  border:
    1px solid rgba(255,255,255,.9);

  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);

  box-shadow:
    0 -10px 50px rgba(0,0,0,.18);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 16px;

  font-weight: 800;
}

.close-btn {
  width: 32px;
  height: 32px;

  border-radius: 50%;

  background: rgba(0,0,0,.06);
}

textarea {
  width: 100%;

  min-height: 120px;

  padding: 14px;

  border: 1px solid rgba(0,0,0,.08);

  border-radius: 18px;

  outline: none;

  resize: none;

  background: rgba(255,255,255,.65);

  font-size: 14px;
}

.upload {
  margin: 12px 0;

  padding: 17px;

  border: 2px dashed rgba(0,0,0,.12);

  border-radius: 17px;

  text-align: center;

  color: var(--muted);

  font-size: 12px;
  font-weight: 700;
}

.upload input {
  display: none;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;
  bottom: 100px;

  z-index: 6000;

  padding: 11px 18px;

  border-radius: 16px;

  background:
    rgba(20,20,20,.88);

  color: white;

  font-size: 12px;
  font-weight: 700;

  transform:
    translate(-50%, 20px);

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}

/* =========================================================
   EMPTY
========================================================= */

.empty {
  padding: 40px 20px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (min-width: 700px) {

  .bottom-nav {
    left: 50%;

    right: auto;

    width: 600px;

    transform:
      translateX(-50%);
  }

  .modal {
    align-items: center;
  }

  .modal-box {
    border-radius: 30px;
  }
}

</style>
</head>

<body>

<!-- ========================================================
     AUTHENTIFICATION
========================================================= -->

<div id="auth-screen">

  <div class="auth-card">

    <div class="auth-logo">

      <h1>Guinée Sociale 🇬🇳</h1>

      <p>
        Connectez-vous avec votre communauté
      </p>

    </div>

    <div class="auth-tabs">

      <button
        id="tab-register"
        class="auth-tab active"
        onclick="switchAuth('register')"
      >
        Inscription
      </button>

      <button
        id="tab-login"
        class="auth-tab"
        onclick="switchAuth('login')"
      >
        Connexion
      </button>

    </div>

    <!-- INSCRIPTION -->

    <div id="register-box">

      <div class="field-row">

        <div class="field">

          <label>Prénom</label>

          <input
            id="register-firstname"
            type="text"
            placeholder="Ibrahima"
          >

        </div>

        <div class="field">

          <label>Nom</label>

          <input
            id="register-lastname"
            type="text"
            placeholder="Diallo"
          >

        </div>

      </div>

      <div class="field">

        <label>Email</label>

        <input
          id="register-email"
          type="email"
          placeholder="vous@email.com"
        >

      </div>

      <div class="field">

        <label>Mot de passe</label>

        <input
          id="register-password"
          type="password"
          placeholder="••••••••"
        >

      </div>

      <button
        class="primary-btn"
        onclick="registerUser()"
      >
        Créer mon compte
      </button>

    </div>


    <!-- CONNEXION -->

    <div
      id="login-box"
      style="display:none;"
    >

      <div class="field">

        <label>Email</label>

        <input
          id="login-email"
          type="email"
          placeholder="vous@email.com"
        >

      </div>

      <div class="field">

        <label>Mot de passe</label>

        <input
          id="login-password"
          type="password"
          placeholder="••••••••"
        >

      </div>

      <button
        class="primary-btn"
        onclick="loginUser()"
      >
        Se connecter
      </button>

    </div>

  </div>

</div>


<!-- ========================================================
     APPLICATION
========================================================= -->

<div id="app">

  <!-- TOP BAR -->

  <header class="navbar">

    <div
      class="nav-brand"
      onclick="switchPage('feed')"
    >
      Guinée Sociale 🇬🇳
    </div>

    <div class="nav-actions">

      <button
        class="icon-btn"
        onclick="openMessages()"
      >
        💬
      </button>

      <button
        class="icon-btn"
        onclick="switchPage('notifications')"
      >
        🔔
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="main-container">

    <!-- ====================================================
         FEED
    ===================================================== -->

    <section
      id="page-feed"
      class="page active"
    >

      <div
        id="stories"
        class="stories-wrapper"
      ></div>


      <!-- CREATE POST -->

      <div class="composer glass">

        <div class="composer-top">

          <div
            id="composer-avatar"
            class="avatar"
          >
            G
          </div>

          <button
            class="composer-trigger"
            onclick="openPostModal('text')"
          >
            Quoi de neuf en Guinée ?
          </button>

        </div>

        <div class="composer-footer">

          <button
            class="c-action"
            onclick="openPostModal('text')"
          >
            📝 Texte
          </button>

          <button
            class="c-action"
            onclick="openPostModal('photo')"
          >
            📸 Photo
          </button>

          <button
            class="c-action"
            onclick="openPostModal('video')"
          >
            🎬 Vidéo
          </button>

        </div>

      </div>


      <div id="feed"></div>

    </section>


    <!-- ====================================================
         SHORTS
    ===================================================== -->

    <section
      id="page-shorts"
      class="page"
    >

      <h2 class="page-title">
        🎬 Shorts
      </h2>

      <div
        id="shorts"
        class="shorts-grid"
      ></div>

    </section>


    <!-- ====================================================
         COMMUNAUTÉ
    ===================================================== -->

    <section
      id="page-friends"
      class="page"
    >

      <h2 class="page-title">
        👥 Communauté
      </h2>

      <div class="composer glass">

        <div class="empty">

<script>

/* =========================================================
   1. SUPABASE
========================================================= */

/*
   IMPORTANT :

   Mets ici TON URL Supabase et TA CLÉ PUBLISHABLE.

   Ne mets jamais une clé service_role ici.
*/

const SUPABASE_URL =
  "https://bdzdaceiettpiosstxkp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3_HoxsdOo_ndX8mNZDSEVQ_6cS7cRG7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   2. ÉTAT
========================================================= */

let currentUser = null;

let currentProfile = null;

let postMode = "text";

let selectedFile = null;


/* =========================================================
   3. INITIALISATION
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init() {

  if (
    SUPABASE_URL === "TON_URL_SUPABASE" ||
    SUPABASE_KEY === "TA_CLE_PUBLISHABLE_SUPABASE"
  ) {

    console.warn(
      "Configure Supabase dans index.html"
    );

    return;
  }

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if (session) {

    currentUser =
      session.user;

    await loadProfile();

    showApp();

    await loadEverything();

  } else {

    showAuth();
  }

  supabaseClient.auth.onAuthStateChange(
    async (_event, session) => {

      if (session) {

        currentUser =
          session.user;

        await loadProfile();

        showApp();

        await loadEverything();

      } else {

        currentUser = null;
        currentProfile = null;

        showAuth();
      }
    }
  );
}


/* =========================================================
   4. AUTH
========================================================= */

function switchAuth(type) {

  const register =
    document.getElementById(
      "register-box"
    );

  const login =
    document.getElementById(
      "login-box"
    );

  const regTab =
    document.getElementById(
      "tab-register"
    );

  const loginTab =
    document.getElementById(
      "tab-login"
    );

  const isRegister =
    type === "register";

  register.style.display =
    isRegister ? "block" : "none";

  login.style.display =
    isRegister ? "none" : "block";

  regTab.classList.toggle(
    "active",
    isRegister
  );

  loginTab.classList.toggle(
    "active",
    !isRegister
  );
}


async function registerUser() {

  const firstname =
    value("register-firstname");

  const lastname =
    value("register-lastname");

  const email =
    value("register-email");

  const password =
    value("register-password");

  if (
    !firstname ||
    !email ||
    !password
  ) {

    toast(
      "⚠️ Remplissez les champs requis"
    );

    return;
  }

  if (password.length < 6) {

    toast(
      "⚠️ Le mot de passe doit contenir au moins 6 caractères"
    );

    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email,

      password,

      options: {
        data: {
          firstname,
          lastname
        }
      }

    });

  if (error) {

    toast(
      "❌ " + error.message
    );

    return;
  }

  if (!data.session) {

    toast(
      "📧 Vérifiez votre adresse email"
    );

  } else {

    toast(
      "🎉 Bienvenue sur Guinée Sociale"
    );
  }
}


async function loginUser() {

  const email =
    value("login-email");

  const password =
    value("login-password");

  if (!email || !password) {

    toast(
      "⚠️ Entrez vos identifiants"
    );

    return;
  }

  const {
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email,

      password

    });

  if (error) {

    toast(
      "❌ " + error.message
    );

    return;
  }

  toast(
    "✅ Connexion réussie"
  );
}


async function logout() {

  await supabaseClient.auth.signOut();

  toast(
    "👋 À bientôt"
  );
}


/* =========================================================
   5. PROFIL
========================================================= */

async function loadProfile() {

  if (!currentUser) {
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  if (error) {

    console.error(
      "Erreur profil:",
      error
    );

    return;
  }

  currentProfile =
    data;
}


function updateProfileUI() {

  if (!currentUser) {
    return;
  }

  const firstName =
    currentProfile?.first_name ||
    currentUser.user_metadata?.firstname ||
    "Utilisateur";

  const lastName =
    currentProfile?.last_name ||
    currentUser.user_metadata?.lastname ||
    "";

  const fullName =
    `${firstName} ${lastName}`.trim();

  const initial =
    firstName
      .charAt(0)
      .toUpperCase();

  document.getElementById(
    "composer-avatar"
  ).textContent =
    initial;

  document.getElementById(
    "profile-avatar"
  ).textContent =
    initial;

  document.getElementById(
    "profile-name"
  ).textContent =
    fullName;

  document.getElementById(
    "profile-email"
  ).textContent =
    currentUser.email || "";
}


/* =========================================================
   6. CHARGEMENT
========================================================= */

async function loadEverything() {

  updateProfileUI();

  await Promise.all([
    loadPosts(),
    loadStories(),
    loadNotifications()
  ]);
}


/* =========================================================
   7. POSTS
========================================================= */

async function loadPosts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("posts")
      .select(`
        id,
        user_id,
        content,
        media_url,
        media_type,
        created_at,
        profiles (
          id,
          first_name,
          last_name,
          avatar_url
        ),
        post_likes (
          user_id
        ),
        comments (
          id,
          user_id,
          content,
          created_at,
          profiles (
            first_name,
            last_name,
            avatar_url
          )
        )
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(
      "Erreur posts:",
      error
    );

    document.getElementById(
      "feed"
    ).innerHTML =
      `<div class="empty">
        Impossible de charger les publications.
      </div>`;

    return;
  }

  renderPosts(
    data || []
  );
}


function renderPosts(posts) {

  const feed =
    document.getElementById(
      "feed"
    );

  const profile =
    document.getElementById(
      "profile-posts"
    );

  if (!posts.length) {

    feed.innerHTML =
      `<div class="empty">
        Aucune publication pour le moment.<br>
        Soyez le premier à publier.
      </div>`;

    profile.innerHTML =
      `<div class="empty">
        Vous n'avez encore rien publié.
      </div>`;

    document.getElementById(
      "shorts"
    ).innerHTML =
      `<div class="empty">
        Aucun short disponible.
      </div>`;

    return;
  }

  feed.innerHTML =
    posts
      .map(renderPost)
      .join("");

  const myPosts =
    posts.filter(
      post =>
        post.user_id ===
        currentUser.id
    );

  profile.innerHTML =
    myPosts.length
      ? myPosts
          .map(renderPost)
          .join("")
      : `<div class="empty">
          Vous n'avez encore rien publié.
        </div>`;

  renderShorts(posts);
}


function renderPost(post) {

  const profile =
    post.profiles;

  const firstName =
    profile?.first_name ||
    "Utilisateur";

  const lastName =
    profile?.last_name ||
    "";

  const author =
    `${firstName} ${lastName}`.trim();

  const initial =
    firstName
      .charAt(0)
      .toUpperCase();

  const likes =
    post.post_likes || [];

  const liked =
    likes.some(
      like =>
        like.user_id ===
        currentUser.id
    );

  const comments =
    post.comments || [];

  const isOwner =
    post.user_id ===
    currentUser.id;

  const media =
    post.media_url
      ? `
        <div class="post-media">

          ${
            post.media_type === "video"
              ? `
                <video
                  src="${safe(post.media_url)}"
                  controls
                  playsinline
                  preload="metadata"
                ></video>
              `
              : `
                <img
                  src="${safe(post.media_url)}"
                  alt="Publication"
                >
              `
          }

        </div>
      `
      : "";

  const commentsHTML =
    comments
      .map(comment => {

        const cp =
          comment.profiles;

        const name =
          `${cp?.first_name || "Utilisateur"}
           ${cp?.last_name || ""}`.trim();

        return `
          <div class="comment">

            <div class="avatar"
              style="width:32px;height:32px;font-size:11px;">
              ${(cp?.first_name || "U")
                .charAt(0)
                .toUpperCase()}
            </div>

            <div class="comment-bubble">

              <div class="comment-author">
                ${escapeHTML(name)}
              </div>

              ${escapeHTML(comment.content)}

            </div>

          </div>
        `;
      })
      .join("");

  return `
    <article
      class="post-card"
      id="post-${post.id}"
    >

      <div class="post-head">

        <div class="post-user">

          <div class="avatar">
            ${initial}
          </div>

          <div>

            <div class="post-author">
              ${escapeHTML(author)}
            </div>

            <div class="post-meta">
              ${formatDate(post.created_at)}
              · 🌐 Public
            </div>

          </div>

        </div>

        ${
          isOwner
            ? `
              <button
                class="delete-btn"
                onclick="deletePost('${post.id}')"
              >
                Supprimer
              </button>
            `
            : ""
        }

      </div>

      ${
        post.content
          ? `
            <div class="post-text">
              ${escapeHTML(post.content)}
            </div>
          `
          : ""
      }

      ${media}

      <div class="post-stats">

        <span>
          ❤️ ${likes.length} j'aime
        </span>

        <span>
          💬 ${comments.length}
        </span>

      </div>

      <div class="post-actions">

        <button
          class="post-action ${liked ? "liked" : ""}"
          onclick="toggleLike('${post.id}', ${liked})"
        >
          ${liked ? "❤️" : "🤍"} J'aime
        </button>

        <button
          class="post-action"
          onclick="toggleComments('${post.id}')"
        >
          💬 Commenter
        </button>

        <button
          class="post-action"
          onclick="sharePost('${post.id}')"
        >
          ↗️ Partager
        </button>

      </div>

      <div
        class="comments"
        id="comments-${post.id}"
      >

        <div>
          ${commentsHTML}
        </div>

        <div class="comment-row">

          <input
            id="comment-input-${post.id}"
            class="comment-input"
            placeholder="Écrire un commentaire..."
            maxlength="500"
          >

          <button
            class="comment-send"
            onclick="addComment('${post.id}')"
          >
            Envoyer
          </button>

        </div>

      </div>

    </article>
  `;
}


/* =========================================================
   8. PUBLIER
========================================================= */

function openPostModal(mode) {

  postMode =
    mode;

  selectedFile =
    null;

  document.getElementById(
    "post-text"
  ).value = "";

  document.getElementById(
    "media-input"
  ).value = "";

  const upload =
    document.getElementById(
      "upload-box"
    );

  const label =
    document.getElementById(
      "upload-label"
    );

  if (mode === "text") {

    upload.style.display =
      "none";

    document.getElementById(
      "modal-title"
    ).textContent =
      "Créer une publication";

  } else {

    upload.style.display =
      "block";

    document.getElementById(
      "modal-title"
    ).textContent =
      mode === "photo"
        ? "Publier une photo"
        : "Publier une vidéo";

    label.textContent =
      mode === "photo"
        ? "📸 Choisir une photo"
        : "🎬 Choisir une vidéo";
  }

  document.getElementById(
    "post-modal"
  ).classList.add("show");
}


function closePostModal() {

  document.getElementById(
    "post-modal"
  ).classList.remove("show");

  selectedFile =
    null;
}


function closeModalOutside(event) {

  if (
    event.target.id ===
    "post-modal"
  ) {
    closePostModal();
  }
}


function handleMedia(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  selectedFile =
    file;

  document.getElementById(
    "upload-label"
  ).textContent =
    "✅ " + file.name;
}


async function publishPost() {

  if (!currentUser) {
    return;
  }

  const content =
    value("post-text");

  if (
    !content &&
    !selectedFile
  ) {

    toast(
      "⚠️ Ajoutez du contenu"
    );

    return;
  }

  let mediaUrl =
    null;

  let mediaType =
    null;


  /* UPLOAD */

  if (selectedFile) {

    const extension =
      selectedFile.name
        .split(".")
        .pop();

    const path =
      `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

    const {
      error
    } =
      await supabaseClient
        .storage
        .from("posts")
        .upload(
          path,
          selectedFile,
          {
            upsert: false
          }
        );

    if (error) {

      toast(
        "❌ Upload impossible : " +
        error.message
      );

      return;
    }

    const {
      data
    } =
      supabaseClient
        .storage
        .from("posts")
        .getPublicUrl(path);

    mediaUrl =
      data.publicUrl;

    mediaType =
      selectedFile.type
        .startsWith("video/")
        ? "video"
        : "image";
  }


  /* INSERT */

  const {
    error
  } =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:
          currentUser.id,

        content:
          content || null,

        media_url:
          mediaUrl,

        media_type:
          mediaType

      });

  if (error) {

    toast(
      "❌ " + error.message
    );

    return;
  }

  closePostModal();

  toast(
    "✅ Publication publiée"
  );

  await loadPosts();
}


/* =========================================================
   9. LIKES
========================================================= */

async function toggleLike(
  postId,
  liked
) {

  if (liked) {

    const {
      error
    } =
      await supabaseClient
        .from("post_likes")
        .delete()
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        );

    if (error) {

      toast(
        "❌ " + error.message
      );

      return;
    }

  } else {

    const {
      error
    } =
      await supabaseClient
        .from("post_likes")
        .insert({

          post_id:
            postId,

          user_id:
            currentUser.id

        });

    if (error) {

      toast(
        "❌ " + error.message
      );

      return;
    }
  }

  await loadPosts();
}


/* =========================================================
   10. COMMENTAIRES
========================================================= */

function toggleComments(id) {

  const element =
    document.getElementById(
      `comments-${id}`
    );

  if (element) {

    element.classList.toggle(
      "open"
    );
  }
}


async function addComment(postId) {

  const input =
    document.getElementById(
      `comment-input-${postId}`
    );

  const content =
    input.value.trim();

  if (!content) {
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("comments")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id,

        content

      });

  if (error) {

    toast(
      "❌ " + error.message
    );

    return;
  }

  input.value = "";

  toast(
    "💬 Commentaire ajouté"
  );

  await loadPosts();

  setTimeout(() => {

    const section =
      document.getElementById(
        `comments-${postId}`
      );

    if (section) {
      section.classList.add(
        "open"
      );
    }

  }, 50);
}


/* =========================================================
   11. SUPPRESSION
========================================================= */

async function deletePost(id) {

  if (
    !confirm(
      "Supprimer cette publication ?"
    )
  ) {
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("posts")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if (error) {

    toast(
      "❌ " + error.message
    );

    return;
  }

  toast(
    "🗑️ Publication supprimée"
  );

  await loadPosts();
}


/* =========================================================
   12. STORIES
========================================================= */

async function loadStories() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("stories")
      .select(`
        id,
        media_url,
        media_type,
        created_at,
        profiles (
          first_name,
          last_name
        )
      `)
      .gt(
        "expires_at",
        new Date().toISOString()
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(
      "Stories:",
      error
    );

    return;
  }

  renderStories(
    data || []
  );
}


function renderStories(stories) {

  const container =
    document.getElementById(
      "stories"
    );

  let html = `
    <div
      class="story-item"
      onclick="openStoryPicker()"
    >

      <div class="story-ring add-story">

        <div
          class="story-avatar"
          style="
            background:white;
            color:#1877f2;
            font-size:25px;
          "
        >
          +
        </div>

      </div>

      <span class="story-name">
        Votre story
      </span>

    </div>

    <input
      id="story-picker"
      type="file"
      accept="image/*,video/*"
      hidden
      onchange="uploadStory(event)"
    >
  `;

  html +=
    stories
      .map(story => {

        const profile =
          story.profiles;

        const name =
          `${profile?.first_name || "Utilisateur"}
           ${profile?.last_name || ""}`.trim();

        return `
          <div
            class="story-item"
            onclick="viewStory('${story.id}')"
          >

            <div class="story-ring">

              ${
                story.media_type === "video"
                  ? `
                    <video
                      src="${safe(story.media_url)}"
                      class="story-avatar"
                      muted
                    ></video>
                  `
                  : `
                    <img
                      src="${safe(story.media_url)}"
                      class="story-avatar"
                      alt="Story"
                    >
                  `
              }

            </div>

            <span class="story-name">
              ${escapeHTML(name)}
            </span>

          </div>
        `;
      })
      .join("");

  container.innerHTML =
    html;
}


function openStoryPicker() {

  const picker =
    document.getElementById(
      "story-picker"
    );

  if (picker) {
    picker.click();
  }
}


async function uploadStory(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  const extension =
    file.name
      .split(".")
      .pop();

  const path =
    `${currentUser.id}/stories/${crypto.randomUUID()}.${extension}`;

  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from("stories")
      .upload(
        path,
        file
      );

  if (uploadError) {

    toast(
      "❌ " +
      uploadError.message
    );

    return;
  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from("stories")
      .getPublicUrl(path);

  const {
    error
  } =
    await supabaseClient
      .from("stories")
      .insert({

        user_id:
          currentUser.id,

        media_url:
          data.publicUrl,

        media_type:
          file.type.startsWith("video/")
            ? "video"
            : "image",

        expires_at:
          new Date(
            Date.now() +
            24 * 60 * 60 * 1000
          ).toISOString()

      });

  if (error) {

    toast(
      "❌ " + error.message
    );

    return;
  }

  toast(
    "⭐ Story publiée"
  );

  await loadStories();
}


/* =========================================================
   13. SHORTS
========================================================= */

function renderShorts(posts) {

  const container =
    document.getElementById(
      "shorts"
    );

  const videos =
    posts.filter(
      post =>
        post.media_type ===
        "video"
    );

  if (!videos.length) {

    container.innerHTML =
      `<div class="empty">
        Aucun short disponible.
      </div>`;

    return;
  }

  container.innerHTML =
    videos
      .map(post => {

        const profile =
          post.profiles;

        const name =
          `${profile?.first_name || "Utilisateur"}
           ${profile?.last_name || ""}`.trim();

        return `
          <div class="short">

            <video
              src="${safe(post.media_url)}"
              muted
              loop
              controls
              playsinline
            ></video>

            <div class="short-info">
              <div class="short-author">
                ${escapeHTML(name)}
              </div>
            </div>

          </div>
        `;
      })
      .join("");
}


/* =========================================================
   14. NOTIFICATIONS
========================================================= */

async function loadNotifications() {

  const container =
    document.getElementById(
      "notifications"
    );

  const {
    data,
    error
  } =
    await supabaseClient
      .from("notifications")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(30);

  if (error) {

    console.error(
      error
    );

    container.innerHTML =
      `<div class="empty">
        Aucune notification.
      </div>`;

    return;
  }

  if (!data?.length) {

    container.innerHTML =
      `<div class="empty">
        🔔 Aucune notification récente.
      </div>`;

    return;
  }

  container.innerHTML =
    data
      .map(item => `
        <div
          style="
            padding:12px;
            border-bottom:1px solid var(--line);
            font-size:13px;
          "
        >
          ${escapeHTML(
            item.message ||
            "Nouvelle notification"
          )}
        </div>
      `)
      .join("");
}

/* =========================================================
   16. PARTAGE
========================================================= */

async function sharePost(id) {

  const url =
    `${location.origin}${location.pathname}#post-${id}`;

  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "Guinée Sociale",

        text:
          "Regardez cette publication sur Guinée Sociale 🇬🇳",

        url

      });

    } catch (_) {}

  } else {

    await navigator.clipboard.writeText(
      url
    );

    toast(
      "🔗 Lien copié"
    );
  }
}


/* =========================================================
   17. NAVIGATION
========================================================= */

function switchPage(page) {

  document
    .querySelectorAll(".page")
    .forEach(element => {

      element.classList.remove(
        "active"
      );
    });

  document
    .querySelectorAll(".nav-item")
    .forEach(element => {

      element.classList.remove(
        "active"
      );
    });

  const pageElement =
    document.getElementById(
      `page-${page}`
    );

  const navElement =
    document.getElementById(
      `nav-${page}`
    );

  if (pageElement) {

    pageElement.classList.add(
      "active"
    );
  }

  if (navElement) {

    navElement.classList.add(
      "active"
    );
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =========================================================
   19. UTILITAIRES
========================================================= */

function value(id) {

  return (
    document
      .getElementById(id)
      ?.value
      ?.trim() || ""
  );
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function safe(value) {

  return escapeHTML(
    value
  );
}


function formatDate(date) {

  if (!date) {
    return "À l'instant";
  }

  const d =
    new Date(date);

  return d.toLocaleDateString(
    "fr-FR",
    {
      day: "numeric",
      month: "short"
    }
  );
}


let toastTimer;

function toast(message) {

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2500
    );
}
